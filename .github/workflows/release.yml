name: Release

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Upload destination. none = GitHub Release only (if untagged)."
        required: true
        default: none
        type: choice
        options:
          - none
          - testpypi
          - pypi

concurrency:
  group: mechaharness-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"

      - name: Fetch release tags
        run: git fetch origin --tags

      - name: Verify candidate identity
        id: version
        run: python scripts/release_candidate.py --expected-sha "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate selected commit
        env:
          MECHA_STORY_BACKEND: static
        run: ./run_checks.sh

      - name: Build and check
        run: |
          python scripts/release_candidate.py --expected-sha "$GITHUB_SHA"
          python -m build --sdist --wheel
          python scripts/release_candidate.py --expected-sha "$GITHUB_SHA" --dist dist
          twine check dist/*

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Tag if missing
        id: tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags
          python scripts/release_candidate.py --expected-sha "$GITHUB_SHA"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${VERSION} already exists"
          else
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
            git push origin "v${VERSION}"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          RESPONSE=$(mktemp)
          STATE=$(mktemp)
          gh api --include "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" > "$RESPONSE" || true
          python scripts/release_candidate.py --expected-sha "$GITHUB_SHA" \
            --release-response "$RESPONSE" > "$STATE"
          if grep -qx 'release_state=missing' "$STATE"; then
            gh release create "v${VERSION}" dist/* --verify-tag \
              --title "Release v${VERSION}" \
              --notes "Install mechaharness==${VERSION}. Changelog: https://rl337.org/mechaharness/changelog.html"
          else
            echo "Matching published GitHub Release is preserved"
          fi

  publish:
    needs: package
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target != 'none'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        if: github.event.inputs.publish_target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: false
          attestations: false

      - name: Smoke-install from TestPyPI
        if: github.event.inputs.publish_target == 'testpypi'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          VERSION="${{ needs.package.outputs.version }}"
          # Install the uploaded package with --no-deps, then pull runtime
          # deps from PyPI only. Do not mix indexes: TestPyPI hosts a broken
          # FASTAPI-1.0 sdist that wins over real fastapi when merged.
          pip install --index-url https://test.pypi.org/simple/ --no-deps \
            "mechaharness==${VERSION}"
          python -c "
          from importlib.metadata import requires
          import subprocess, sys
          deps = [
              d.split(';')[0].strip()
              for d in (requires('mechaharness') or [])
              if d and 'extra ==' not in d.replace(' ', '')
          ]
          subprocess.check_call([
              sys.executable, '-m', 'pip', 'install',
              '--index-url', 'https://pypi.org/simple/', *deps,
          ])
          "
          python -c "import mechaharness; assert mechaharness.__version__ == '${VERSION}'"

      - name: Publish to PyPI
        if: github.event.inputs.publish_target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: false
          attestations: false
