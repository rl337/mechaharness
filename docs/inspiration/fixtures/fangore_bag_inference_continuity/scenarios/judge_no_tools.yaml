# RED acceptance story: judge consumes bag projection, returns typed verdict, has no tool loop.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph:
  inline:
    goal: judge proposal from verified evidence
    nodes:
    - id: evidence
      kind: compute
    - id: judge
      kind: judge
      depends_on: [evidence]
steps:
- do:
    graph_walk:
      action: start
  expect:
  - kind: equals
    key: status
    value: paused
- do:
    graph_walk:
      action: continue
  expect:
  - kind: equals
    key: status
    value: ok
  - kind: equals
    key: inference.judge.tool_call_count
    value: 0
  - kind: equals
    key: inference.judge.includes_verified_evidence
    value: true
  - kind: equals
    key: bag.out.judgment.valid
    value: true
complete:
  expect:
  - kind: equals
    key: status
    value: ok
cleanup: []
