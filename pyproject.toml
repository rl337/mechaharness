[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechaharness"
version = "0.10.0"
description = "Agentic harness that abstracts inference backends and model-family harness architectures"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "Richard Lee", email = "rlee@tokyo3.com" },
]
keywords = ["agent", "llm", "harness", "inference", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "pyiv>=1.1.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  # Always install: di.py imports it, and CI runs Python 3.12 where the old
  # ``python_version < '3.10'`` marker skipped the package and broke the CLI.
  "eval_type_backport>=0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "PyYAML>=6.0",
  "types-PyYAML>=6.0",
  "ruff>=0.5",
  # Exact pin: mypy 2.x requires Python >=3.10, and floating majors caused
  # CI (3.12) vs local (3.9) to disagree on what passes. Bump deliberately.
  "mypy==1.19.1",
  # FastAPI/Starlette TestClient (tests/test_api.py); not used by inference.
  "httpx>=0.27",
  "build>=1.2",
  "twine>=5.0",
]
docs = [
  "sphinx>=5.0.0",
  "sphinx-rtd-theme>=1.0.0",
  "myst-parser>=2.0.0",
]

[project.scripts]
mechaharness = "mechaharness.cli.main:app"
mechaharness-generator = "mechaharness.mcp_graph_driver:main"

[project.urls]
Homepage = "https://rl337.org/mechaharness/"
Documentation = "https://rl337.org/mechaharness/"
Repository = "https://github.com/rl337/mechaharness"
Issues = "https://github.com/rl337/mechaharness/issues"
Changelog = "https://rl337.org/mechaharness/changelog.html"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mechaharness = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "src/mechaharness"]
pythonpath = ["src", "."]
addopts = ["--doctest-modules"]
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]
markers = [
  "story_live: dual-mode user stories against live backends (MECHA_STORY_BACKEND=live)",
  "serial: sequential user-story suites that must not share workers (xdist)",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's idiomatic `x: T = typer.Option(...)` defaults trip B008.
"src/mechaharness/cli/main.py" = ["B008"]

[tool.mypy]
# Checker target only; runtime still supports 3.9+. Mypy 1.19+ requires >=3.10 here.
python_version = "3.10"
strict = true
packages = ["mechaharness"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "pyiv.*"
ignore_missing_imports = true

# User-story coverage gate (see scripts/story_coverage.py + run_checks.sh).
# Floor is branch-aware percent_covered; bump when the story suite improves.
[tool.coverage.run]
branch = true
source = ["mechaharness"]
omit = [
  # Entrypoints / hosts not driven by kind:cli / user_story walks
  "*/cli/main.py",
  "*/mcp_graph_driver.py",
  "*/project_coding.py",  # MCP ProjectCodingConfig host; unit-tested
  "*/github_client.py",  # forge HTTP; unit-tested + RecordingGitHubClient stories
  "*/github_connection.py",  # forge connection config; unit-tested
  "*/api/app.py",
  "*/host_apis.py",
  # Viz / render tooling (unit-tested separately when present)
  "*/recipe_diagram.py",
  "*/recipe_render.py",
  # Thin re-export shims (deprecated public import paths)
  "*/connection.py",
  "*/cross_task_isolation.py",
  "*/decisions.py",
  "*/evolution_campaign_hooks.py",
  "*/graph_template.py",
  "*/isolation_contract.py",
  "*/operations.py",
  "*/policy.py",
  "*/recipe_evolution.py",
  "*/recipe_port_search.py",
  "*/recipe_promotion_policy.py",
  "*/review_audit.py",
  "*/specification_debt.py",
  "*/tool_phase.py",
  "*/workspace_isolation.py",
  "*/api/__init__.py",
]

[tool.coverage.report]
skip_covered = true
show_missing = true
# Story-suite floor (branch coverage). Raise when stories cover more; never lower
# without an explicit decision — CI fails if coverage drops below this.
fail_under = 78

[tool.coverage.json]
output = "coverage-stories.json"
