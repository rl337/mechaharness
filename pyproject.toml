[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechaharness"
version = "0.1.0"
description = "Agentic harness that abstracts inference backends and model-family harness architectures"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "Richard Lee", email = "rlee@tokyo3.com" },
]
keywords = ["agent", "llm", "harness", "inference", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "pyiv>=0.3.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "eval_type_backport>=0.2; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "build>=1.2",
  "twine>=5.0",
]
docs = [
  "sphinx>=5.0.0",
  "sphinx-rtd-theme>=1.0.0",
  "myst-parser>=2.0.0",
]

[project.scripts]
mechaharness = "mechaharness.cli.main:app"

[project.urls]
Homepage = "https://rl337.org/mechaharness/"
Documentation = "https://rl337.org/mechaharness/"
Repository = "https://github.com/rl337/mechaharness"
Issues = "https://github.com/rl337/mechaharness/issues"
Changelog = "https://rl337.org/mechaharness/changelog.html"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mechaharness = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "story_live: dual-mode user stories against live backends (MECHA_STORY_BACKEND=live)",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["mechaharness"]

[[tool.mypy.overrides]]
module = "pyiv.*"
ignore_missing_imports = true
