# RED acceptance story: mock inference tool loop must inspect a frozen bag snapshot.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph:
  inline:
    goal: inspect prior evidence without observing live bag mutations
    nodes:
    - id: evidence
      kind: compute
    - id: agent
      kind: infer
      depends_on: [evidence]
steps:
- do:
    graph_walk:
      action: start
  expect:
  - kind: equals
    key: status
    value: paused
- do:
    graph_walk:
      action: continue
  expect:
  - kind: equals
    key: status
    value: ok
  - kind: equals
    key: inference.agent.inspection_snapshot_stable
    value: true
  - kind: equals
    key: inference.agent.unauthorized_inspection_denied
    value: true
  - kind: equals
    key: inference.agent.tool_results_in_transcript
    value: true
complete:
  expect:
  - kind: equals
    key: status
    value: ok
cleanup: []
