id: nubble_ci_static_smoke
persona: nubble
title: Prove the HTTP adapter in CI without a live model host
narrative: The local inference host is offline, but a pull request still needs green CI. Nubble wants
  the OpenAI-compatible path proven from a cassette — a recorded reply replayed through the real HTTP
  client — so merges do not depend on LAN reachability.
implementation: '`OpenAICompatStrategy` implements Chat Completions HTTP for reason-lane backends. CLI
  universe `cli:infer` via `CliInstrumentor` / `CliInferRunner` runs that strategy so cassette replay
  exercises the real client path and the same EventLog baseline as other one-shot runs.


  Covers: offline CI / OpenAI-compat smoke.'
validation: 'Harness `cli` scenario `cassette_smoke.yaml`: nonempty assistant text, positive cost units,
  exact baseline EventLog types. Cassette `response.json`. Live: `MECHA_STORY_BACKEND=live`.'
footnotes:
- id: openai-chat-completions
  label: OpenAI Chat Completions
  url: https://platform.openai.com/docs/api-reference/chat
  note: Wire models for reason-lane HTTP
kind: cli
commands:
- infer:
    prompt: Say hello.
expect:
- kind: nonempty
  key: text
- kind: positive
  key: cost_units
- kind: exactly
  key: event_types
  value:
  - core:access_check
  - core:graph_start
  - core:graph_node_start
  - core:cost
  - core:inference
  - core:graph_node_end
  - core:graph_end
