id: fangore_insp_state_governance
suite: fangore_access_authority
persona: fangore
title: Freeze graph metric ownership against agent writes
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. Graph quality targets
  have owners and can be frozen so agents cannot silently mutate success criteria. Accepts WalkingLabs
  L14 guidance[^wl-l14-gov].
implementation: '`GraphStateGovernance`, `FieldGovernance`, and `authorize_write` in `mechaharness.graph_state_governance`
  enforce owner/writer/mutability rules.'
validation: Harness `user_story` drives product verb(s) with environment `pass_through`/`mock`; hard expects
  on declared observation keys.
footnotes:
- id: wl-l14-gov
  label: WalkingLabs L14 Graph Engineering
  url: https://walkinglabs.github.io/learn-harness-engineering/en/lectures/lecture-14-graph-engineering/
  note: Metric ownership
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    state_governance_write:
      owner: ops
      writers:
      - ops
      mutable: false
      actor: agent
complete:
  expect:
  - kind: 'false'
    key: allowed
cleanup: []
