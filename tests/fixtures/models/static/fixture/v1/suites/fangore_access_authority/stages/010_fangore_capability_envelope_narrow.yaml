id: fangore_capability_envelope_narrow
suite: fangore_access_authority
persona: fangore
title: Narrow child capability envelopes without silent inheritance
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. He binds a parent
  capability envelope in the environment, runs `capability_envelope` to narrow a child and attempt a widen,
  and verifies the child stays a subset while widen raises and delegation prefers child.
implementation: '`CapabilityEnvelope.narrow` plus `DefaultDelegationPolicy`. Story `environment.capability_envelope`
  binds Config `get_capability_envelope`; product verb `capability_envelope` exercises narrow/widen.'
validation: Harness `user_story` scenario `capability_envelope_narrow.yaml` drives `capability_envelope`;
  expects narrow_ok / child_grant_count / widen_raises / delegation_choice.
footnotes: []
kind: user_story
environment:
  family: pass_through
  backend: mock
  capability_envelope:
    grants:
    - core:graph.execute
    - core:fs.read
  filesystem:
    type: temp
steps:
- do:
    capability_envelope:
      child_grants:
      - core:graph.execute
      widen_grants:
      - core:graph.execute
      - core:fs.write
complete:
  expect:
  - kind: 'true'
    key: narrow_ok
  - kind: equals
    key: child_grant_count
    value: 1
  - kind: 'true'
    key: widen_raises
  - kind: equals
    key: delegation_choice
    value: child
cleanup: []
