id: fangore_insp_evolution_ownership_split
suite: fangore_access_authority
persona: fangore
title: Keep recipe validation in the library and evolution campaigns in the host
narrative: 'Fangore starts the CLI host with family `pass_through` and backend `mock`. MechaHarness validates,
  executes, versions, and safety-gates recipes; the host (for example an AI assistant project) owns which
  workloads to run, how much to spend, and whether a candidate should be promoted. Two named hooks carry
  that split: one for evolution campaigns and one for promotion policy. Both default to doing nothing,
  a host can replace either, a host veto stops a promotion even when every test passed, and the library''s
  final-test gate still applies when the host has no opinion (`taloneth_insp_recipe_final_test_gate`).
  He walks product steps (recipe_plan) and verifies completion from the structured observation expects
  on this scenario. [^insp-sr-09]'
implementation: '`MechaHarnessConfig.get_recipe_promotion_policy()` (`RecipePromotionPolicy`, default
  `NoopRecipePromotionPolicy`) and `get_evolution_campaign_hooks()` (`EvolutionCampaignHooks`, default
  `NoopEvolutionCampaignHooks`) are registered in `configure()` as injectables, not `Settings`. `promote_recipe()`
  in `recipe_promotion_policy.py` lets the host policy decide, then the registry applies `promote_with_final_test`;
  when given the Config-bound hooks it calls `EvolutionCampaignHooks.on_promotion` after (and only after)
  a successful pointer move. Registry validation, evolvable allowlists, and the final-test gate stay in
  the library.'
validation: 'Harness `user_story` scenario `evolution_ownership_split.yaml`: environment + graph + steps
  + complete expects.'
footnotes:
- id: insp-sr-09
  label: Self-revising recipe evolution (MH-SR-09)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/self-revising-recipe-evolution.md
  note: AI assistant host versus MechaHarness ownership for evolution
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph: null
steps:
- do:
    recipe_plan:
      path: plans/evolution_ownership.yaml
complete:
  expect:
  - kind: 'true'
    key: default_policy_is_noop
  - kind: equals
    key: default_hooks
    value:
    - []
    - null
  - kind: equals
    key: host_hooks
    value:
    - - verify_repair:nightly
      - verify_repair:regression
    - 25.0
  - kind: equals
    key: host_policy_blocks
    value:
    - false
    - - release_freeze
  - kind: equals
    key: host_block_keeps_pointer
    value: '1'
  - kind: equals
    key: library_gate_without_final_test
    value:
    - false
    - '1'
  - kind: equals
    key: promoted_with_gates_passed
    value:
    - true
    - '2'
  - kind: equals
    key: host_hooks_saw_promotions
    value:
    - - verify_repair
      - '2'
cleanup: []
