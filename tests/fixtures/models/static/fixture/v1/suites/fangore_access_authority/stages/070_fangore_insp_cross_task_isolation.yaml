id: fangore_insp_cross_task_isolation
suite: fangore_access_authority
persona: fangore
title: Isolate job-lane run data; share only via brokered observe or handoff
narrative: 'Fangore starts the CLI host with family `pass_through` and backend `mock`. He treats each
  pipeline as a JobLane: assets publishes refs that do not bleed to billing until an explicit `lane_handoff`,
  matching MH-DOTS-07 as productized JobLaneBroker. Focused claims also live in `fangore_job_lane_*` stories
  (same-lane lineage, cross deny, meta allowlist, artifacts, before selector, handoff).'
implementation: '`JobLane` + `JobLaneBroker` (JL-01..10) in `mechaharness.job_lane_broker`; CLI verbs
  `lane_publish` / `lane_observe` / `lane_handoff`. Deprecated shim: `CrossTaskIsolationGuard`.'
validation: Harness `user_story` scenario `cross_task_isolation_bleed.yaml`; matrix stories `fangore_job_lane_*`.
footnotes:
- id: insp-dots-07
  label: OpenAI Dots agent safety (MH-DOTS-07)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/openai-dots-agent-safety-inspiration.md
  note: Cross-task context isolation → job-lane broker
- id: jl-broker
  label: Job lane broker requirements
  url: https://github.com/rl337/mechaharness/blob/main/docs/requirements/job-lane-broker.md
  note: JL vocabulary, YAML surface, story matrix
kind: user_story
environment:
  family: pass_through
  backend: mock
  job_lanes:
    origin:
      meta:
        mode: deny_all
      keys:
        approval:send-42:
          mode: deny_all
        memo:shared:
          mode: deny_all
        memo:private:
          mode: deny_all
    intervening:
      meta:
        mode: open
      keys: {}
    receiver:
      meta:
        mode: open
      keys: {}
  filesystem:
    type: temp
steps:
- do:
    lane_publish:
      keys:
        approval:send-42: true
        memo:shared: visible
        memo:private: hidden
  lane: origin
  run_id: origin-1
- do:
    lane_observe:
      target_lane: origin
      selector:
        latest: true
      key: approval:send-42
  lane: intervening
  expect:
  - kind: equals
    key: status
    value: denied
- do:
    lane_handoff:
      from_lane: origin
      to_lane: receiver
      evidence_refs:
      - memo:shared
- do:
    lane_observe:
      target_lane: origin
      selector:
        latest: true
      key: memo:shared
  lane: receiver
  expect:
  - kind: equals
    key: status
    value: ok
  - kind: equals
    key: value
    value: visible
- do:
    lane_observe:
      target_lane: origin
      selector:
        latest: true
      key: memo:private
  lane: receiver
  expect:
  - kind: equals
    key: status
    value: denied
- do:
    lane_handoff:
      from_lane: origin
      to_lane: receiver
      evidence_refs:
      - memo:ghost
  expect:
  - kind: equals
    key: status
    value: denied
  - kind: equals
    key: error
    value: lane 'origin' cannot hand off unreadable 'memo:ghost'
complete:
  expect:
  - kind: equals
    key: status
    value: denied
cleanup: []
