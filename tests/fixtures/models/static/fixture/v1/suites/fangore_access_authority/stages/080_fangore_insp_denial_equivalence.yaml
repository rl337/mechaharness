id: fangore_insp_denial_equivalence
suite: fangore_access_authority
persona: fangore
title: Persist denials and block equivalent actions across retries
narrative: 'Fangore starts the CLI host with family `pass_through` and backend `mock`. He runs `denial_equivalence`:
  a denied email.send to bob stays denied across provider/tool retries until `lift()`, while a different
  recipient is allowed. Native deny/allow paths: `fangore_insp_soft_vs_hard`, `fangore_jev_action_safety`.
  Tracks MH-DOTS-05[^insp-dots-05].'
implementation: '`DenialStore` / `InMemoryDenialStore` + `equivalent_action_digest` via product verb `denial_equivalence`
  (`cli_policy_verbs`); `AuthorityGate` records DENY and consults prior denials. Walk-bag `in`/`out` carry
  the denied intent and outcomes.'
validation: Harness `user_story` walks `denial_equivalence`; expects prior_denial on equivalent retries
  and allow after lift.
footnotes:
- id: insp-dots-05
  label: OpenAI Dots agent safety (MH-DOTS-05)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/openai-dots-agent-safety-inspiration.md
  note: Denial persistence and equivalent-action detection
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    denial_equivalence:
      denied:
        effect_class: email.send
        target: bob@example.com
        tool_name: smtp.send
      retries:
      - id: second_provider
        effect_class: email.send
        target: bob@example.com
        tool_name: sendgrid.send
      - id: graph_tool
        effect_class: email.send
        target: bob@example.com
        tool_name: graph.send
      - id: other_recipient
        effect_class: email.send
        target: amy@example.com
        tool_name: smtp.send
  expect:
  - kind: equals
    key: first
    value: deny:verdict_deny
  - kind: equals
    key: retries
    value:
      second_provider: deny:prior_denial
      graph_tool: deny:prior_denial
      other_recipient: allow
  - kind: 'true'
    key: lifted
  - kind: equals
    key: after_lift
    value: allow
complete:
  expect:
  - kind: equals
    key: first
    value: deny:verdict_deny
  - kind: 'true'
    key: lifted
  - kind: equals
    key: after_lift
    value: allow
cleanup: []
