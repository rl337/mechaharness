id: fangore_human_review_pending
suite: fangore_access_authority
persona: fangore
title: Hold mutations until a matching human approval exists
narrative: 'Fangore starts the CLI host with family `pass_through` and backend `mock`. A privileged mutate
  is gated by JudgementPolicy: without a matching approval digest the walk raises human review onto walk-bag
  register `ask`. The story step expects that request and injects the approval into `ans`; the second
  decide allows. ASK_HUMAN path for Dots MH-DOTS-04[^insp-dots-04-pending] and approval interrupt for
  MH-DOTS-02[^insp-dots-02-review].'
implementation: '`WalkBag` / `WalkBagRegister` (`ask`/`ans`) in `mechaharness.walk_bag`; `HumanReviewGateVerb`
  (`human_review_gate`) in `cli_policy_verbs` over `JudgementPolicy.require_approval_for` + `decide()`;
  story `expect` kind `human_review` with `inject` folded into the verb by the user_story harness.


  Covers: POL-04, GAT-04.'
validation: 'Harness `user_story` walks `human_review_gate` with `expect: human_review` + inject; hard
  expects on `verdict_kinds` / `final_verdict`.'
footnotes:
- id: insp-dots-02-review
  label: OpenAI Dots map (MH-DOTS-02 approval pending)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/openai-dots-agent-safety-requirements-map.md
  note: Approval interrupt path
- id: insp-dots-04-pending
  label: OpenAI Dots map (MH-DOTS-04 ask-human)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/openai-dots-agent-safety-requirements-map.md
  note: ASK_HUMAN path of independent review
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    human_review_gate:
      action: mutate
      action_digest: sha256:story
      policy_version: story-review
      require_approval_for:
      - mutate
      signals:
      - id: destructive
        p_true: 0.95
      thresholds:
      - signal_id: destructive
        allow_above: 0.9
        ask_below: 0.9
  expect:
  - kind: human_review
    inject:
      approvals:
        sha256:story: approved-1
  - kind: equals
    key: verdict_kinds
    value:
    - ASK_HUMAN
    - ALLOW
  - kind: equals
    key: final_verdict
    value: ALLOW
complete:
  expect:
  - kind: 'true'
    key: human_review_requested
  - kind: equals
    key: verdict_kinds
    value:
    - ASK_HUMAN
    - ALLOW
  - kind: equals
    key: final_verdict
    value: ALLOW
cleanup: []
