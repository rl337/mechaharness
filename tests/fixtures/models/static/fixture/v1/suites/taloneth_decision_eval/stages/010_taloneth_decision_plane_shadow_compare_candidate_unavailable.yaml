id: taloneth_decision_plane_shadow_compare__candidate_unavailable
suite: taloneth_decision_eval
persona: taloneth
title: Compare shadowed decision-plane answers before promotion (candidate_unavailable)
narrative: 'Taloneth starts the CLI host with family `pass_through` and backend `mock`. Taloneth reviews
  shadow versus production answers on matched refund triage cases to decide whether a smaller decision
  model is ready to own the path. Agreement and telemetry must be honest; missing candidate results stay
  missing. Related: `fangore_decision_plane_shadow`, `taloneth_shadow_decision_backends`.[^rc-dp-shadow-t]
  This stage covers the `candidate_unavailable` scenario.'
implementation: '`compare_shadow_decision` plus `build_decision_plane_telemetry` support promotion evidence
  for Agentic Recipe `decision_plane` without inventing unavailable candidate results (DP-07, DP-08).'
validation: Harness `user_story` drives product verb(s) with environment `pass_through`/`mock`; hard expects
  on declared observation keys. Stage id `taloneth_decision_plane_shadow_compare__candidate_unavailable`
  (scenario `candidate_unavailable`).
footnotes:
- id: rc-dp-shadow-t
  label: Recipes requirements DP-07 / DP-08
  url: https://github.com/rl337/mechaharness/blob/requirements/recipes-decision-plane/docs/requirements/recipes-and-decision-plane.md
  note: Shadow comparison for model promotion
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
