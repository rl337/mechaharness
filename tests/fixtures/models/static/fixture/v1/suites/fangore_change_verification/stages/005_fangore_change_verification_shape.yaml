id: fangore_change_verification_shape
suite: fangore_change_verification
persona: fangore
title: Instantiate the change_verification Agentic Recipe
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. He loads Agentic
  Recipe `change_verification` and verifies constrain/run/publish/validate node ids.
implementation: Agentic Recipe `change_verification` (`ChangeVerificationTemplate`) via `instantiate_recipe`.
validation: Suite stage `005_fangore_change_verification_shape` — template_name and node ids.
footnotes:
- id: gastronomic-m6-verification-shape
  label: Gastronomic M6 change_verification
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/gastronomic-guided-development-execution-plan.md
  note: Host-observed VerificationReport after scoped execution
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  recipe: change_verification
steps:
- do:
    instantiate_recipe:
      path: binds/change_verification.yaml
  expect:
  - kind: equals
    key: template_name
    value: change_verification
  - kind: includes
    key: subgraph_node_ids
    value:
    - seed
    - constrain
    - run
    - publish
    - validate
complete:
  expect:
  - kind: equals
    key: template_name
    value: change_verification
cleanup: []
