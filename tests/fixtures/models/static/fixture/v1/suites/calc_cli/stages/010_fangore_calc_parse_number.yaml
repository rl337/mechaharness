id: fangore_calc_parse_number
suite: calc_cli
persona: fangore
title: Bootstrap a CLI that evaluates number literals
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`, loads the `guided_coding`
  durable graph, and grows a shared calculator workspace from an empty arc. He asks for a small command-line
  program that reads one expression and prints a number literal value. He answers the external guidance
  soft point, confirms `calc.py` on disk, and runs it on `42` and `3.14` so the bootstrap claim is proven
  before later stages add operators. Live mode uses a real reason model for the coding burst; static mode
  uses an offline write stub.
implementation: 'Agentic Recipe catalog id `guided_coding` with `environment.local_work: project_coding`
  and `environment.workspace: suite`. Static mode uses offline `coding_write` stubs. Live mode (`MECHA_STORY_BACKEND=live`
  + `MECHA_BASE_URL`) ignores stubs and binds a real OpenAI-compat Completer into `ProjectCodingLocalWork`
  via `completer_as_tool_loop_complete`. Product verbs `workspace_read` / `run_python` assert on-disk
  `calc.py` and CLI stdout for this stage''s grammar plus regressions.'
validation: 'Harness `user_story` scenario `bootstrap.yaml` inside sequential suite `calc_cli` (ordered).
  Live eligibility: `environment.local_work: project_coding`. Suite harness asserts live HTTP POSTs when
  coding stages run under live backend.'
footnotes: []
kind: user_story
environment:
  family: pass_through
  backend: mock
  local_work: project_coding
  filesystem:
    type: suite
    contents: 010_fangore_calc_parse_number.files.json
graph:
  recipe: guided_coding
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: calc-bootstrap
      inputs:
        goal: 'Create calc.py in the workspace: a CLI math calculator that for now only evaluates number
          literals (e.g. 42, 3.14). Do not implement operators yet. Required API shape (non-negotiable):
          define both `def evaluate(expr)` and `def main(argv=None) -> int` by those exact names (main
          must not be only an inline `if __name__ == ''__main__''` block). main reads sys.argv[1], prints
          the result, exits 0 on success / 1 on error / 2 on bad usage. Implement a real expression parser
          — do NOT use eval(), exec(), or ast.literal_eval on the user expression. You MUST call write_file
          with the full calc.py contents before finishing.'
        max_iterations: 24
        verify_runs:
        - path: calc.py
          text_contains:
          - def evaluate
          - def main
          text_forbids:
          - eval(
          - exec(
        - args:
          - '42'
          exit_code: 0
          path: calc.py
          stdout_contains: '42'
        - args:
          - '3.14'
          exit_code: 0
          path: calc.py
          stdout_contains: '3.14'
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: gte
    key: guidance_yields
    value: 1
  - kind: gte
    key: local_steps
    value: 1
- do:
    answer:
      choose: minimal
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: gte
    key: resumes
    value: 1
  - kind: includes
    key: written_files
    value:
    - calc.py
- do:
    workspace_read:
      path: calc.py
  expect:
  - kind: 'true'
    key: exists
  - kind: contains
    key: text
    value: def evaluate
  - kind: contains
    key: text
    value: def main
- do:
    run_python:
      path: calc.py
      args:
      - '42'
  expect:
  - kind: equals
    key: exit_code
    value: 0
  - kind: contains
    key: stdout
    value: '42'
- do:
    run_python:
      path: calc.py
      args:
      - '3.14'
  expect:
  - kind: equals
    key: exit_code
    value: 0
  - kind: contains
    key: stdout
    value: '3.14'
complete:
  expect:
  - kind: equals
    key: exit_code
    value: 0
  - kind: includes
    key: event_types
    value:
    - core:graph_yield
    - core:guidance_resume
    - core:graph_start
    - core:graph_end
cleanup: []
