id: fangore_calc_functions
suite: calc_cli
persona: fangore
title: Add common calculator functions
narrative: Fangore finishes the calculator arc by adding common functions (`sqrt`, `abs`, `sin`/`cos`/`tan`
  in radians, `ln`/`log`, `min`/`max`) composable with prior operators and grouping. The shared workspace
  now holds a full expression CLI.
implementation: 'Agentic Recipe catalog id `guided_coding` with `environment.local_work: project_coding`
  and `environment.workspace: suite`. Static mode uses offline `coding_write` stubs. Live mode (`MECHA_STORY_BACKEND=live`
  + `MECHA_BASE_URL`) ignores stubs and binds a real OpenAI-compat Completer into `ProjectCodingLocalWork`
  via `completer_as_tool_loop_complete`. Product verbs `workspace_read` / `run_python` assert on-disk
  `calc.py` and CLI stdout for this stage''s grammar plus regressions.'
validation: 'Harness `user_story` scenario `functions.yaml` inside sequential suite `calc_cli` (ordered).
  Live eligibility: `environment.local_work: project_coding`. Suite harness asserts live HTTP POSTs when
  coding stages run under live backend.'
footnotes: []
kind: user_story
environment:
  family: pass_through
  backend: mock
  local_work: project_coding
  filesystem:
    type: suite
    contents: 060_fangore_calc_functions.files.json
graph:
  recipe: guided_coding
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: calc-functions
      inputs:
        goal: 'Read calc.py first, then extend it with call syntax fn(args) for sqrt, abs, sin, cos,
          tan (radians), ln, log (base 10), min, max. Examples: sqrt(9)→3, abs(-2)+1→3, min(3,1,2)→1,
          sin(0)→0. Do NOT drop prior grammar: + - * / , right-assoc ^, and parentheses must stay green
          (e.g. 2+3*4→14, 2^3^2→512, (1+2)*3→9). Required API shape (non-negotiable): define both `def
          evaluate(expr)` and `def main(argv=None) -> int` by those exact names (main must not be only
          an inline `if __name__ == ''__main__''` block). main reads sys.argv[1], prints the result, exits
          0 on success / 1 on error / 2 on bad usage. Implement a real expression parser — do NOT use
          eval(), exec(), or ast.literal_eval on the user expression. You MUST call write_file with the
          full calc.py contents before finishing. Extend the parser — do not rewrite from scratch in a
          way that drops working operators.'
        max_iterations: 24
        verify_runs:
        - path: calc.py
          text_contains:
          - def evaluate
          - def main
          text_forbids:
          - eval(
          - exec(
        - args:
          - '42'
          exit_code: 0
          path: calc.py
          stdout_contains: '42'
        - args:
          - '3.14'
          exit_code: 0
          path: calc.py
          stdout_contains: '3.14'
        - args:
          - 2+3*4
          exit_code: 0
          path: calc.py
          stdout_contains: '14'
        - args:
          - 2^3^2
          exit_code: 0
          path: calc.py
          stdout_contains: '512'
        - args:
          - (1+2)*3
          exit_code: 0
          path: calc.py
          stdout_contains: '9'
        - args:
          - sqrt(9)
          exit_code: 0
          path: calc.py
          stdout_contains: '3'
        - args:
          - abs(-2)+1
          exit_code: 0
          path: calc.py
          stdout_contains: '3'
        - args:
          - min(3,1,2)
          exit_code: 0
          path: calc.py
          stdout_contains: '1'
        - args:
          - sin(0)
          exit_code: 0
          path: calc.py
          stdout_contains: '0'
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: gte
    key: guidance_yields
    value: 1
  - kind: gte
    key: local_steps
    value: 1
- do:
    answer:
      choose: minimal
      on_decompose: accept_proposed
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: gte
    key: resumes
    value: 1
  - kind: includes_if
    if_key: changes_expected
    if_equals: true
    key: written_files
    value:
    - calc.py
- do:
    workspace_read:
      path: calc.py
  expect:
  - kind: 'true'
    key: exists
  - kind: contains
    key: text
    value: def evaluate
  - kind: contains
    key: text
    value: def main
- do:
    run_python:
      path: calc.py
      args:
      - (1+2)*3
  expect:
  - kind: equals
    key: exit_code
    value: 0
  - kind: contains
    key: stdout
    value: '9'
- do:
    run_python:
      path: calc.py
      args:
      - sqrt(9)
  expect:
  - kind: equals
    key: exit_code
    value: 0
  - kind: contains
    key: stdout
    value: '3'
- do:
    run_python:
      path: calc.py
      args:
      - abs(-2)+1
  expect:
  - kind: equals
    key: exit_code
    value: 0
  - kind: contains
    key: stdout
    value: '3'
- do:
    run_python:
      path: calc.py
      args:
      - min(3,1,2)
  expect:
  - kind: equals
    key: exit_code
    value: 0
  - kind: contains
    key: stdout
    value: '1'
- do:
    run_python:
      path: calc.py
      args:
      - sin(0)
  expect:
  - kind: equals
    key: exit_code
    value: 0
  - kind: contains
    key: stdout
    value: '0'
complete:
  expect:
  - kind: equals
    key: exit_code
    value: 0
  - kind: includes
    key: event_types
    value:
    - core:graph_yield
    - core:guidance_resume
    - core:graph_start
    - core:graph_end
cleanup: []
