id: fangore_gastronomic_calc_exponent
suite: fangore_gastronomic_calc
persona: fangore
title: Gastronomic Completer propose adds right-associative exponent
narrative: Fangore continues the shared gastronomic calc arc. He Completer-proposes right-associative ^ without
  breaking earlier precedence, applies it, and records an arm-B trial.
implementation: '`execution_constrain` / infer propose / `execution_materialize` / `execution_apply`;
  Agentic Recipe `change_execution`; `comparison_assemble`.'
validation: Suite stage `040_fangore_gastronomic_calc_exponent` — arm B trial success.
footnotes:
- id: gastronomic-calc-exponent
  label: Gastronomic calc arm B exponent
  url: https://github.com/rl337/mechaharness/blob/main/docs/guides/gastronomic-comparison.md
  note: Sequential gastronomic execute on shared calc workspace
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: suite
graph:
  inline:
    goal: extend calc with exponent via gastronomic execute
    nodes:
    - id: seed
      kind: compute
      payload:
        bag_put:
          in.goal: >-
            Update calc.py to add ^ as right-associative exponentiation (2^3^2 → 512, 2*3^2 → 18). Keep + - * /. Require evaluate/main. Extend the current calc.py from in.workspace_files (do not drop prior operators). No eval/exec.
          in.workspace: {root: .}
          in.approved_slice:
            id: exponent
            title: Exponentiation
            scope: {paths: [calc.py]}
            rollback: restore prior calc.py
          in.metrics:
            stages_passed: 4
            stages_total: 6
            model_calls: 4
            wall_ms: 4000
            repair_loops: 0
            guidance_yields: 0
            prior_regressions: 0
    - id: load_workspace
      kind: execution_load_workspace
      depends_on: [seed]
      payload:
        reads: {workspace: in.workspace}
        writes: {destination: in.workspace_files}
        parameters: {paths: [calc.py]}
    - id: constrain
      kind: execution_constrain
      depends_on: [load_workspace]
      payload:
        reads: {approved_slice: in.approved_slice}
        writes: {destination: acc.execution.constraints}
    - id: propose
      kind: infer
      depends_on: [constrain]
      payload:
        soft_point: propose_payload
        max_tokens: 16384
        completion:
          revisions:
          - path: calc.py
            content: |
              """CLI math calculator — + − × ÷ ^ (right-assoc)."""
              from __future__ import annotations

              import sys


              class _Parser:
                  def __init__(self, text: str) -> None:
                      self.text = text
                      self.i = 0

                  def skip(self) -> None:
                      while self.i < len(self.text) and self.text[self.i].isspace():
                          self.i += 1

                  def match(self, ch: str) -> bool:
                      self.skip()
                      if self.i < len(self.text) and self.text[self.i] == ch:
                          self.i += 1
                          return True
                      return False

                  def number(self) -> float:
                      self.skip()
                      start = self.i
                      while self.i < len(self.text) and (
                          self.text[self.i].isdigit() or self.text[self.i] == "."
                      ):
                          self.i += 1
                      if start == self.i:
                          raise ValueError(f"expected number at {start}")
                      return float(self.text[start : self.i])

                  def power(self) -> float:
                      base = self.number()
                      if self.match("^"):
                          exp = self.power()  # right-associative
                          return base ** exp
                      return base

                  def term(self) -> float:
                      value = self.power()
                      while True:
                          if self.match("*"):
                              value = value * self.power()
                          elif self.match("/"):
                              value = value / self.power()
                          else:
                              break
                      return value

                  def additive(self) -> float:
                      value = self.term()
                      while True:
                          if self.match("+"):
                              value = value + self.term()
                          elif self.match("-"):
                              value = value - self.term()
                          else:
                              break
                      return value

                  def parse(self) -> float:
                      value = self.additive()
                      self.skip()
                      if self.i != len(self.text):
                          raise ValueError(f"trailing input at {self.i}")
                      return value


              def evaluate(expr: str) -> float:
                  return _Parser(expr).parse()


              def main(argv=None) -> int:
                  args = list(sys.argv[1:] if argv is None else argv)
                  if len(args) != 1:
                      print("usage: calc.py <expression>", file=sys.stderr)
                      return 2
                  try:
                      print(evaluate(args[0]))
                      return 0
                  except Exception as exc:
                      print(f"error: {exc}", file=sys.stderr)
                      return 1


              if __name__ == "__main__":
                  raise SystemExit(main())
        context:
          version: '1'
          system: >-
            Do not think aloud. Put JSON only in answer content. Return exactly
            {"revisions":[{"path":"...","content":"...full file..."}]} with no
            markdown fences. Prefer extending the existing file; keep evaluate
            and main(argv=None).
          user_preamble: "/no_think\nUse only the following bag evidence."
          reads:
          - {path: in.goal, required: true}
          - {path: acc.execution.constraints, required: true}
          - {path: in.workspace_files, required: false}
          response:
            writes: acc.execution.proposed
            parse: json
    - id: materialize
      kind: execution_materialize
      depends_on: [propose]
      payload:
        reads:
          host_revisions: in.file_revisions
          proposed: acc.execution.proposed
        writes: {destination: acc.execution.revisions}
        parameters: {fail_if_incomplete: true}
    - id: apply
      kind: execution_apply
      depends_on: [materialize]
      payload:
        reads:
          constraints: acc.execution.constraints
          revisions: acc.execution.revisions
          workspace: in.workspace
        writes: {destination: acc.execution.apply_receipt}
    - id: publish
      kind: execution_publish
      depends_on: [apply]
      payload:
        reads:
          constraints: acc.execution.constraints
          receipt: acc.execution.apply_receipt
        writes: {destination: out.change_execution}
    - id: accept_seed
      kind: compute
      depends_on: [publish]
      payload:
        bag_put:
          in.development_outcome:
            version: '1'
            status: ok
            outcome: completed
            reason: host verify after gastronomic execute
            provenance: {gates_passed: true}
    - id: assemble
      kind: comparison_assemble
      depends_on: [accept_seed]
      payload:
        reads:
          development_outcome: in.development_outcome
          metrics: in.metrics
        writes: {destination: out.trial}
        parameters:
          trial_id: calc-b-exponent-1
          arm: B
          recipe_id: gastronomic_guided_development
          suite_id: fangore_gastronomic_calc
    - id: validate_trial
      kind: comparison_validate
      depends_on: [assemble]
      payload:
        reads: {source: out.trial}
        writes: {destination: acc.comparison.validation}
        parameters: {fail_if_invalid: true}
steps:
- do:
    graph_walk: {action: start, grants: [core:graph.execute, core:fs.write]}
  expect:
  - {kind: equals, key: status, value: paused}
- do:
    graph_walk: {action: continue}
  expect:
  - {kind: equals, key: status, value: ok}
  - {kind: equals, key: bag.out.trial.arm, value: B}
  - {kind: equals, key: bag.out.trial.success, value: true}
- do:
    run_python: {path: calc.py, args: ["2+3*4"]}
  expect:
  - {kind: equals, key: exit_code, value: 0}
  - {kind: contains, key: stdout, value: "14"}
- do:
    run_python: {path: calc.py, args: ["2*3^2"]}
  expect:
  - {kind: equals, key: exit_code, value: 0}
  - {kind: contains, key: stdout, value: "18"}
- do:
    run_python: {path: calc.py, args: ["2^3^2"]}
  expect:
  - {kind: equals, key: exit_code, value: 0}
  - {kind: contains, key: stdout, value: "512"}
complete:
  expect:
  - {kind: equals, key: exit_code, value: 0}
cleanup: []

