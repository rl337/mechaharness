  - {kind: contains, key: stdout, value: "3"}
- do:
    run_python: {path: calc.py, args: ["abs(-2)+1"]}
  expect:
  - {kind: equals, key: exit_code, value: 0}
  - {kind: contains, key: stdout, value: "3"}
- do:
    run_python: {path: calc.py, args: ["min(3,1,2)"]}
  expect:
  - {kind: equals, key: exit_code, value: 0}
  - {kind: contains, key: stdout, value: "1"}
- do:
    run_python: {path: calc.py, args: ["sin(0)"]}
  expect:
