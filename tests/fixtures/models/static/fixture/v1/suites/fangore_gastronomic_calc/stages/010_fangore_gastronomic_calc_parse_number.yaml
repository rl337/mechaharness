id: fangore_gastronomic_calc_parse_number
suite: fangore_gastronomic_calc
persona: fangore
title: Gastronomic Completer propose bootstraps calc number literals
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock` on a shared suite
  workspace. He walks gastronomic change_execution Completer propose → materialize → apply for calc.py
  number literals, verifies evaluate/main on disk, runs 42 and 3.14, and records an arm-B trial.
implementation: '`execution_constrain` / infer propose / `execution_materialize` / `execution_apply` / `verification_*`;
  Agentic Recipe `change_execution` under gastronomic arm B; `comparison_assemble`.'
validation: Suite stage `010_fangore_gastronomic_calc_parse_number` — arm B trial success.
footnotes:
- id: gastronomic-calc-parse
  label: Gastronomic calc arm B bootstrap
  url: https://github.com/rl337/mechaharness/blob/main/docs/guides/gastronomic-comparison.md
  note: Completer-propose execute path for fair calc comparison
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: suite
    contents: ../assets/empty.files.json
graph:
  inline:
    goal: bootstrap calc number literals via gastronomic execute
    nodes:
    - id: seed
      kind: compute
      payload:
        bag_put:
          in.goal: >-
            Create calc.py evaluating number literals only (42, 3.14). Require
            evaluate(expr) and main(argv=None). No eval/exec.
          in.workspace: {root: .}
          in.approved_slice:
            id: bootstrap
            title: Number literals CLI
            scope: {paths: [calc.py]}
            rollback: delete calc.py
          in.metrics:
            stages_passed: 1
            stages_total: 6
            model_calls: 1
            wall_ms: 1000
            repair_loops: 0
            guidance_yields: 0
            prior_regressions: 0
    - id: load_workspace
      kind: execution_load_workspace
      depends_on: [seed]
      payload:
        reads: {workspace: in.workspace}
        writes: {destination: in.workspace_files}
        parameters: {paths: [calc.py]}
    - id: constrain
      kind: execution_constrain
      depends_on: [load_workspace]
      payload:
        reads: {approved_slice: in.approved_slice}
        writes: {destination: acc.execution.constraints}
    - id: propose
      kind: infer
      depends_on: [constrain]
      payload:
        soft_point: propose_payload
        max_tokens: 8192
        completion:
          revisions:
          - path: calc.py
            content: |
              """CLI math calculator — number literals."""
              from __future__ import annotations

              import sys


              def evaluate(expr: str) -> float:
                  text = expr.strip()
                  if not text:
                      raise ValueError("empty expression")
                  return float(text)


              def main(argv=None) -> int:
                  args = list(sys.argv[1:] if argv is None else argv)
                  if len(args) != 1:
                      print("usage: calc.py <expression>", file=sys.stderr)
                      return 2
                  try:
                      print(evaluate(args[0]))
                      return 0
                  except Exception as exc:
                      print(f"error: {exc}", file=sys.stderr)
                      return 1


              if __name__ == "__main__":
                  raise SystemExit(main())
        context:
          version: '1'
          system: >-
            Do not think aloud. Put JSON only in answer content. Return exactly
            {"revisions":[{"path":"...","content":"...full file..."}]} with no
            markdown fences. Prefer extending the existing file; keep evaluate
            and main(argv=None).
          user_preamble: "/no_think\nUse only the following bag evidence."
          reads:
          - {path: in.goal, required: true}
          - {path: acc.execution.constraints, required: true}
          - {path: in.workspace_files, required: false}
          response:
            writes: acc.execution.proposed
            parse: json
    - id: materialize
      kind: execution_materialize
      depends_on: [propose]
      payload:
        reads:
          host_revisions: in.file_revisions
          proposed: acc.execution.proposed
        writes: {destination: acc.execution.revisions}
        parameters: {fail_if_incomplete: true}
    - id: apply
      kind: execution_apply
      depends_on: [materialize]
      payload:
        reads:
          constraints: acc.execution.constraints
          revisions: acc.execution.revisions
          workspace: in.workspace
        writes: {destination: acc.execution.apply_receipt}
    - id: publish
      kind: execution_publish
      depends_on: [apply]
      payload:
        reads:
          constraints: acc.execution.constraints
          receipt: acc.execution.apply_receipt
        writes: {destination: out.change_execution}
    - id: seed_verify
      kind: compute
      depends_on: [publish]
      payload:
        bag_put:
          in.change_contract:
            version: '1'
            status: ok
          in.verify_runs:
            - path: calc.py
              text_contains:
              - def evaluate
              - def main
              text_forbids:
              - eval(
              - exec(
              python_parses: true
            - path: calc.py
              args:
              - '42'
              exit_code: 0
              stdout_contains: '42'
            - path: calc.py
              args:
              - '3.14'
              exit_code: 0
              stdout_contains: '3.14'
    - id: v_constrain
      kind: verification_constrain
      depends_on: [seed_verify]
      payload:
        reads:
          contract: in.change_contract
          execution: out.change_execution
          verify_runs: in.verify_runs
        writes: {destination: acc.verification.constraints}
    - id: v_run
      kind: verification_run
      depends_on: [v_constrain]
      payload:
        reads: {constraints: acc.verification.constraints, workspace: in.workspace}
        writes: {destination: acc.verification.run_receipt}
    - id: v_publish
      kind: verification_publish
      depends_on: [v_run]
      payload:
        reads:
          constraints: acc.verification.constraints
          receipt: acc.verification.run_receipt
        writes: {destination: out.verification_report}
    - id: v_validate
      kind: verification_validate
      depends_on: [v_publish]
      payload:
        reads: {source: out.verification_report}
        writes: {destination: acc.verification.validation}
        parameters: {fail_if_invalid: true}
    - id: accept_seed
      kind: compute
      depends_on: [v_validate]
      payload:
        bag_put:
          in.development_outcome:
            version: '1'
            status: ok
            outcome: completed
            reason: host verify after gastronomic execute
            provenance: {gates_passed: true}
    - id: assemble
      kind: comparison_assemble
      depends_on: [accept_seed]
      payload:
        reads:
          development_outcome: in.development_outcome
          metrics: in.metrics
        writes: {destination: out.trial}
        parameters:
          trial_id: calc-b-parse-1
          arm: B
          recipe_id: gastronomic_guided_development
          suite_id: fangore_gastronomic_calc
    - id: validate_trial
      kind: comparison_validate
      depends_on: [assemble]
      payload:
        reads: {source: out.trial}
        writes: {destination: acc.comparison.validation}
        parameters: {fail_if_invalid: true}
steps:
- do:
    graph_walk: {action: start, grants: [core:graph.execute, core:fs.write]}
  expect:
  - {kind: equals, key: status, value: paused}
- do:
    graph_walk: {action: continue}
  expect:
  - {kind: equals, key: status, value: ok}
  - {kind: equals, key: bag.acc.execution.revisions.source, value: proposed}
  - {kind: equals, key: bag.out.change_execution.status, value: ok}
  - {kind: equals, key: bag.out.trial.arm, value: B}
  - {kind: equals, key: bag.out.verification_report.status, value: ok}
  - {kind: equals, key: bag.out.trial.success, value: true}
- do:
    workspace_read: {path: calc.py}
  expect:
  - {kind: 'true', key: exists}
  - {kind: contains, key: text, value: def evaluate}
  - {kind: contains, key: text, value: def main}
- do:
    run_python: {path: calc.py, args: ['42']}
  expect:
  - {kind: equals, key: exit_code, value: 0}
  - {kind: contains, key: stdout, value: '42'}
- do:
    run_python: {path: calc.py, args: ['3.14']}
  expect:
  - {kind: equals, key: exit_code, value: 0}
  - {kind: contains, key: stdout, value: '3.14'}
complete:
  expect:
  - {kind: equals, key: exit_code, value: 0}
cleanup: []
