id: fangore_contract_extraction_shape
suite: fangore_contract_extraction
persona: fangore
title: Instantiate the contract_extraction Agentic Recipe
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. He loads Agentic
  Recipe `contract_extraction` and verifies freeze/propose/assemble/validate node ids.
implementation: Agentic Recipe `contract_extraction` (`ContractExtractionTemplate`) via `instantiate_recipe`.
validation: Suite stage `005_fangore_contract_extraction_shape` — template_name and node ids.
footnotes:
