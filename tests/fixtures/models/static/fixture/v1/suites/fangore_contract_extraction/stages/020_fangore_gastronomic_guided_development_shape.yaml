id: fangore_gastronomic_guided_development_shape
suite: fangore_contract_extraction
persona: fangore
title: Instantiate gastronomic_guided_development discovery→…→accept tiles
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. He loads Agentic
  Recipe `gastronomic_guided_development` and verifies discovery_tile through accept_tile subgraphs
  without mutating guided_coding.
implementation: Agentic Recipe `gastronomic_guided_development` (`GastronomicGuidedDevelopmentTemplate`)
  tiles `workspace_discovery`, `contract_extraction`, `change_decomposition`, `change_execution`,
  `change_verification`, `failure_diagnosis`, `strategy_revision`, and `development_acceptance`.
validation: Suite stage `020_fangore_gastronomic_guided_development_shape` — template_name and tile node
  ids.
footnotes:
- id: gastronomic-m6-product-shape
  label: Gastronomic M6 product recipe
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/gastronomic-guided-development-execution-plan.md
  note: Product recipe through development_acceptance
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  recipe: gastronomic_guided_development
steps:
- do:
    instantiate_recipe:
      path: binds/gastronomic_guided_development.yaml
  expect:
  - kind: equals
    key: template_name
    value: gastronomic_guided_development
  - kind: includes
    key: subgraph_node_ids
    value:
    - seed
    - discovery_tile
    - contract_tile
    - plan_tile
    - execute_tile
    - verify_tile
    - diagnose_tile
    - revise_tile
    - publish_revision
    - publish
    - publish_verification
    - publish_execution
    - publish_plan
    - publish_contract
    - publish_inventory
complete:
  expect:
  - kind: equals
    key: template_name
    value: gastronomic_guided_development
cleanup: []