id: fangore_insp_operation_compensation
suite: fangore_lifecycle_ops
persona: fangore
title: Declare operation idempotency and compensation
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. Cleanup and recovery
  operations declare idempotency and optional compensation so retries do not double side effects. Accepts
  WalkingLabs L12 guidance[^wl-l12-idem].
implementation: '`OperationContract.idempotent` and `compensation_strategy` in `mechaharness.operation_registry`.'
validation: Harness `user_story` drives product verb(s) with environment `pass_through`/`mock`; hard expects
  on declared observation keys.
footnotes:
- id: wl-l12-idem
  label: WalkingLabs L12 Clean Session Handoffs
  url: https://walkinglabs.github.io/learn-harness-engineering/en/lectures/lecture-12-why-every-session-must-leave-a-clean-state/
  note: Idempotency
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    operation_compensation:
      name: cleanup
      idempotent: true
      compensation_strategy: noop_if_clean
complete:
  expect:
  - kind: 'true'
    key: idempotent
  - kind: equals
    key: compensation_strategy
    value: noop_if_clean
cleanup: []
