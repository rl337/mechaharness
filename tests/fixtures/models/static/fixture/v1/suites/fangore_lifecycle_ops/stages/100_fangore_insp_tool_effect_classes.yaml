id: fangore_insp_tool_effect_classes
suite: fangore_lifecycle_ops
persona: fangore
title: Separate observe, prepare, and execute tool classes
narrative: 'Fangore starts the CLI host with family `pass_through` and backend `mock`. He runs `tool_phase_guard`:
  observe/prepare contracts cannot register write or external effects; execute may. An alias cannot smuggle
  a weaker phase. Lifecycle observe hooks exist (`fangore_insp_lifecycle_observe`) but are not a tool-class
  taxonomy. Tracks MH-DOTS-03[^insp-dots-03].'
implementation: '`OperationRegistry.register` + `OperationContract` / `ToolPhase` via product verb `tool_phase_guard`
  (`cli_policy_verbs`). Walk-bag `in`/`out` carry contracts and register/refuse lists.'
validation: Harness `user_story` walks `tool_phase_guard`; expects registered / refused / alias_supported.
footnotes:
- id: insp-dots-03
  label: OpenAI Dots agent safety (MH-DOTS-03)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/openai-dots-agent-safety-inspiration.md
  note: Observe/Prepare/Execute tool classes
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    tool_phase_guard:
      contracts:
      - name: peek
        tool_phase: observe
        external_effects: read
      - name: peek_alias
        tool_phase: observe
        external_effects: write
      - name: draft_email
        tool_phase: prepare
        external_effects: none
      - name: draft_send
        tool_phase: prepare
        external_effects: external
      - name: mystery_observer
        tool_phase: observe
        external_effects: unknown
      - name: send_email
        tool_phase: execute
        external_effects: external
      alias_probe: peek_alias
  expect:
  - kind: equals
    key: registered
    value:
    - peek
    - draft_email
    - send_email
  - kind: equals
    key: refused
    value:
    - peek_alias
    - draft_send
    - mystery_observer
  - kind: 'false'
    key: alias_supported
complete:
  expect:
  - kind: equals
    key: registered
    value:
    - peek
    - draft_email
    - send_email
  - kind: 'false'
    key: alias_supported
cleanup: []
