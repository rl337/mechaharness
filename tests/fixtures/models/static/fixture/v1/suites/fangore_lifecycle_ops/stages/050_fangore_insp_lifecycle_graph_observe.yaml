id: fangore_insp_lifecycle_graph_observe
suite: fangore_lifecycle_ops
persona: fangore
title: Watch graph node attempts without replacing failure policy
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. He binds host lifecycle
  extensions ['acme:graph_watch'] and runs product step `tool_lifecycle` (mode=graph). He verifies extension
  effects on the tool/graph path.
implementation: Product verb `tool_lifecycle` (`ToolLifecycleVerb`) with Config/host-bound `LifecycleExtension`
  instances (story fixtures under tests.stories.hosts).
validation: user_story `lifecycle_extension_graph_observe.yaml` tool_lifecycle; hard expects on extension
  observations.
footnotes:
- id: insp-r20-graph
  label: 'Inspiration requirements (req 20: graph observe)'
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/dev-blog-inspiration.md
  note: Req 20 — graph observe
kind: user_story
environment:
  family: pass_through
  backend: mock
  lifecycle_extensions: &id001
  - acme:graph_watch
  filesystem:
    type: temp
graph: null
steps:
- do:
    tool_lifecycle:
      mode: graph
      prompt: write
      grants:
      - core:fs.write
      tool_calls: []
      extension_ids: *id001
      goal: lifecycle
complete:
  expect:
  - kind: equals
    key: graph_status
    value: ok
  - kind: equals
    key: boundary
    value: core:before_graph_node
  - kind: equals
    key: extension_id
    value: acme:graph_watch
  - kind: 'true'
    key: default_ran
  - kind: equals
    key: cost_units
    value: 1
  - kind: lte
    key: budget_spent
    value: 10
cleanup: []
