id: fangore_insp_lifecycle_observe
suite: fangore_lifecycle_ops
persona: fangore
title: Watch tool calls in a fixed order without changing them
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. He binds host lifecycle
  extensions ['acme:watch_a', 'acme:watch_b'] and runs product step `tool_lifecycle` (mode=tool). He verifies
  extension effects on the tool/graph path.
implementation: Product verb `tool_lifecycle` (`ToolLifecycleVerb`) with Config/host-bound `LifecycleExtension`
  instances (story fixtures under tests.stories.hosts).
validation: user_story `lifecycle_extension_observe.yaml` tool_lifecycle; hard expects on extension observations.
footnotes:
- id: insp-r20
  label: 'Inspiration requirements (req 20: lifecycle interception)'
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/dev-blog-inspiration.md
  note: Req 20 — lifecycle interception
kind: user_story
environment:
  family: pass_through
  backend: mock
  lifecycle_extensions: &id001
  - acme:watch_a
  - acme:watch_b
  filesystem:
    type: temp
graph: null
steps:
- do:
    tool_lifecycle:
      mode: tool
      prompt: write
      grants:
      - core:fs.write
      tool_calls:
      - id: c1
        name: write_file
        arguments:
          path: a.txt
      extension_ids: *id001
      goal: lifecycle
complete:
  expect:
  - kind: equals
    key: extension_ids
    value:
    - acme:watch_a
    - acme:watch_b
  - kind: equals
    key: orders
    value:
    - 1
    - 2
  - kind: 'true'
    key: default_ran
  - kind: equals
    key: tool_result
    value: wrote a.txt
cleanup: []
