id: fangore_strategy_revision_accept
suite: fangore_strategy_revision
persona: fangore
title: Green diagnosis yields continue_or_accept
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. He walks
  strategy_revision against a none-class Diagnosis and verifies disposition continue_or_accept.
implementation: '`revision_*` hard nodes; Agentic Recipe `strategy_revision`.'
validation: Suite stage `015_fangore_strategy_revision_accept` — continue_or_accept.
footnotes:
- id: gastronomic-m6-revision-accept
  label: Gastronomic M6 revision accept
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/gastronomic-guided-development-execution-plan.md
  note: Green verify path continues without inventing a repair loop
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  inline:
    goal: revise green
    nodes:
    - id: seed
      kind: compute
      payload:
        bag_put:
          in.diagnosis:
            version: '1'
            status: ok
            failure_class: none
            next_experiment: continue_or_accept
            evidence: []
    - id: constrain
      kind: revision_constrain
      depends_on: [seed]
      payload:
        reads: {diagnosis: in.diagnosis}
        writes: {destination: acc.revision.constraints}
    - id: decide
      kind: revision_decide
      depends_on: [constrain]
      payload:
        reads: {constraints: acc.revision.constraints}
        writes: {destination: acc.revision.decision}
    - id: publish
      kind: revision_publish
      depends_on: [decide]
      payload:
        reads:
          constraints: acc.revision.constraints
          decision: acc.revision.decision
        writes: {destination: out.strategy_revision}
    - id: validate
      kind: revision_validate
      depends_on: [publish]
      payload:
        reads: {source: out.strategy_revision}
        writes: {destination: acc.revision.validation}
        parameters: {fail_if_invalid: true}
steps:
- do:
    graph_walk: {action: start, grants: [core:graph.execute]}
  expect:
  - {kind: equals, key: status, value: paused}
- do:
    graph_walk: {action: continue}
  expect:
  - {kind: equals, key: status, value: ok}
  - {kind: equals, key: bag.out.strategy_revision.disposition, value: continue_or_accept}
complete:
  expect:
  - {kind: equals, key: bag.out.strategy_revision.evidence_delta_required, value: false}
cleanup: []
