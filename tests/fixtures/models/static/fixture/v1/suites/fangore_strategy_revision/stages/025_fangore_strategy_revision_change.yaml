id: fangore_strategy_revision_change
suite: fangore_strategy_revision
persona: fangore
title: Repeat failure class forces change_strategy
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. He walks
  strategy_revision against a Diagnosis whose next_experiment already marks a repeated class, and
  verifies disposition change_strategy with strategy_changed true.
implementation: '`revision_*` hard nodes; Agentic Recipe `strategy_revision`.'
validation: Suite stage `025_fangore_strategy_revision_change` — change_strategy.
footnotes:
- id: gastronomic-m6-revision-change
  label: Gastronomic M6 revision change strategy
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/gastronomic-guided-development-execution-plan.md
  note: Repeated identical failure cannot cause unbounded identical retries
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  inline:
    goal: revise change strategy
    nodes:
    - id: seed
      kind: compute
      payload:
        bag_put:
          in.diagnosis:
            version: '1'
            status: ok
            failure_class: budget
            next_experiment: change_strategy_after_repeat_budget
            evidence: [{text: 'budget exhausted'}]
          in.retry_budget: {attempts_used: 1, attempts_max: 3}
    - id: constrain
      kind: revision_constrain
      depends_on: [seed]
      payload:
        reads:
          diagnosis: in.diagnosis
          retry_budget: in.retry_budget
        writes: {destination: acc.revision.constraints}
    - id: decide
      kind: revision_decide
      depends_on: [constrain]
      payload:
        reads: {constraints: acc.revision.constraints}
        writes: {destination: acc.revision.decision}
    - id: publish
      kind: revision_publish
      depends_on: [decide]
      payload:
        reads:
          constraints: acc.revision.constraints
          decision: acc.revision.decision
        writes: {destination: out.strategy_revision}
    - id: validate
      kind: revision_validate
      depends_on: [publish]
      payload:
        reads: {source: out.strategy_revision}
        writes: {destination: acc.revision.validation}
        parameters: {fail_if_invalid: true}
steps:
- do:
    graph_walk: {action: start, grants: [core:graph.execute]}
  expect:
  - {kind: equals, key: status, value: paused}
- do:
    graph_walk: {action: continue}
  expect:
  - {kind: equals, key: status, value: ok}
  - {kind: equals, key: bag.out.strategy_revision.disposition, value: change_strategy}
  - {kind: equals, key: bag.out.strategy_revision.strategy_changed, value: true}
complete:
  expect:
  - {kind: equals, key: bag.out.strategy_revision.disposition, value: change_strategy}
cleanup: []
