id: fangore_local_plan_resume
suite: fangore_durable_ioc
persona: fangore
title: Resume a durable local plan after a crash
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. A local plan's require_file
  node fails when `/work/input.txt` is missing on the virtual filesystem. He observes that failure, seeds
  the file into MemoryFilesystem, and resumes the same checkpointed `run_id` (held on walk-bag `ctx`)
  so the node succeeds. Checkpoints — not chat — carry the plan across the gap. Incompatible harness fingerprints
  remain covered by `fangore_insp_durable_resume`. See inspiration requirements for durable long-running
  work[^insp-resume].
implementation: '`LocalPlanResumeVerb` (`local_plan_resume`) in `cli_policy_verbs`: shared `MemoryFilesystem`
  + `GraphExecutor` checkpoint store; fail on missing path; seed; re-arm failed node; `resume=True` with
  the same `run_id` on walk-bag `ctx`. Fan-in / merge / precondition helpers stay available as library
  units; fingerprint refuse is `fangore_insp_durable_resume`.'
validation: Harness `user_story` walks `local_plan_resume`; expects first_status=failed (missing_file),
  resume_status=ok, file_content, and stable run_id.
footnotes:
- id: loop-vs-graph
  label: Loop vs graph engineering
  url: https://medium.com/@neuraldev/loop-engineering-vs-graph-engineering-the-architecture-shift-quietly-reshaping-ai-agents-c83488435d23
  note: Explicit control flow; MechaHarness extends into execution graphs
- id: insp-resume
  label: Inspiration requirements (durable resume)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/dev-blog-inspiration.md
  note: Req 12 — resumable external state; incompatible fingerprint refuse
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    local_plan_resume:
      run_id: story-local-plan
      required_path: /work/input.txt
      seed_content: plan-payload
      goal: consume required input file
  expect:
  - kind: equals
    key: first_status
    value: failed
  - kind: equals
    key: first_error
    value: missing_file:/work/input.txt
  - kind: equals
    key: resume_status
    value: ok
  - kind: equals
    key: file_content
    value: plan-payload
  - kind: equals
    key: run_id
    value: story-local-plan
  - kind: equals
    key: recovery_boundary
    value: commit
complete:
  expect:
  - kind: equals
    key: first_status
    value: failed
  - kind: equals
    key: resume_status
    value: ok
  - kind: equals
    key: file_content
    value: plan-payload
  - kind: equals
    key: run_id
    value: story-local-plan
cleanup: []
