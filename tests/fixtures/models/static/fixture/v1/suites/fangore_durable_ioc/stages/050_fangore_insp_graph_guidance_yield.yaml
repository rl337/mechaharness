id: fangore_insp_graph_guidance_yield
suite: fangore_durable_ioc
persona: fangore
title: Yield typed guidance and resume without treating advice as approval
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`, loads the `verify_repair`
  durable graph (controller `story`, store `memory`). When a run needs higher-level judgment, start returns
  an advice yield with a typed question and choices. The driver answers in a later call; the run completes.
  This is not a human approval interrupt (`fangore_insp_approval_interrupt`) and not an in-process sparse
  advisor consult (`fangore_insp_sparse_advisor`). He walks product steps (start, answer) and verifies
  completion from the structured observation expects on this scenario. [^insp-ioc-02]
implementation: '`GuidanceRequest` / `GuidanceResponse` / `GraphYield` with kind `advice_requested`; `DurableGraphGenerator.resume`
  validates request_id, choice schema, and rejects `requested_authority=final_approval` so ordinary advice
  cannot unlock approval-only mutations.'
validation: 'Harness `user_story` scenario `session.yaml`: environment + graph + steps + complete expects.'
footnotes:
- id: insp-ioc-02
  label: Durable graph generators (R-IOC-GUIDANCE)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/durable-graph-generators-inversion-of-control.md
  note: R-IOC-GUIDANCE typed guidance suspension
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  recipe: verify_repair
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: folk-guidance
      inputs:
        guidance:
        - question: How should exhaustion affect the sword maneuver?
          choices:
          - id: slow
            label: Slower
          - id: precise
            label: Precise
          recommendation: precise
          requested_authority: artistic_direction
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: equals
    key: question
    value: How should exhaustion affect the sword maneuver?
- do:
    answer:
      choose: precise
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: 'true'
    key: pending_cleared
  - kind: equals
    key: resumes
    value: 1
complete:
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: 'true'
    key: pending_cleared
  - kind: equals
    key: resumes
    value: 1
cleanup: []
