id: fangore_insp_durable_graph_generator
suite: fangore_durable_ioc
persona: fangore
title: Drive a registered recipe to completion as a durable generator
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`, loads the `verify_repair`
  durable graph (controller `story`, store `memory`). Long-running judgment-bearing work is started as
  a durable generator over a registered recipe. When no external guidance is required, the first start
  call returns completion — the driver does not invent a second harness or free-form graph. Complements
  offline recipe evolution (`taloneth_insp_recipe_evolution_loop`) which chooses which recipe is active.
  He walks product steps (start) and verifies completion from the structured observation expects on this
  scenario. [^insp-ioc-01]
implementation: '`DurableGraphGenerator.start` / `list_recipes` resolve `GraphTemplateRegistry` catalog
  ids and persist via `GeneratorRunStore`. Host entry: `host_kit.host_durable_graph_generator` / `durable_generator_host`.
  Node component kind `guidance_request` is reserved for guidance soft points; this story exercises zero-advice
  completion.'
validation: 'Harness `user_story` scenario `session.yaml`: environment + graph + steps + complete expects.'
footnotes:
- id: insp-ioc-01
  label: Durable graph generators (R-IOC-GENERATOR)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/durable-graph-generators-inversion-of-control.md
  note: R-IOC-GENERATOR durable ordered yields
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  recipe: verify_repair
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      inputs:
        goal: trivial
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: equals
    key: sequence
    value: 1
  - kind: 'true'
    key: recipe_listed
  - kind: equals
    key: guidance_yields
    value: 0
complete:
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: equals
    key: sequence
    value: 1
  - kind: 'true'
    key: recipe_listed
  - kind: equals
    key: guidance_yields
    value: 0
cleanup: []
