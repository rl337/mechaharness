id: fangore_insp_driver_session_resume
suite: fangore_durable_ioc
persona: fangore
title: Resume guidance in a later driver call without recursive callbacks
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`, loads the `verify_repair`
  durable graph (controller `session`, store `memory`). Frontier and other MCP-capable clients cannot
  reenter a model session during a pending tool call. Guidance therefore returns as an ordinary tool result;
  the same driving session calls resume later with the answer. Tracks R-IOC-SESSION. He walks product
  steps (start, answer) and verifies completion from the structured observation expects on this scenario.
  [^insp-ioc-03]
implementation: '`DurableGraphGenerator.start` returns a committed `GraphYield`; `resume` is a separate
  operation with `expected_sequence`. No recursive callback into an outstanding tool call is required.
  MCP adapter: `mechaharness.mcp_graph_driver` (unit/doctest).'
validation: 'Harness `user_story` scenario `session.yaml`: environment + graph + steps + complete expects.'
footnotes:
- id: insp-ioc-03
  label: Durable graph generators (R-IOC-SESSION)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/durable-graph-generators-inversion-of-control.md
  note: R-IOC-SESSION caller-session resume
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  recipe: verify_repair
  durable:
    controller: session
    store: memory
steps:
- do:
    start:
      run_id: session-1
      inputs:
        guidance:
        - question: Direction?
          choices:
          - id: a
            label: A
  expect:
  - kind: equals
    key: kind
    value: advice_requested
- do:
    answer:
      choose: a
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: 'true'
    key: separate_calls
complete:
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: 'true'
    key: separate_calls
cleanup: []
