id: fangore_insp_guidance_survive_restart
suite: fangore_durable_ioc
persona: fangore
title: Rehydrate the same pending guidance after a process restart
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`, loads the `verify_repair`
  durable graph (controller `c1`, store `shared`). A suspended generator run must survive executor or
  MCP process restart and present the identical pending question. Uses the CheckpointStore / run-store
  seam from durable resume (`fangore_insp_durable_resume`, `fangore_tdr_crash_before_intent`) rather than
  a second recovery protocol. Tracks R-IOC-RESUME. He walks product steps (start, rebuild, inspect) and
  verifies completion from the structured observation expects on this scenario. [^insp-ioc-05]
implementation: '`GeneratorRunStore` (in-memory shared instance or checkpoint-backed) rehydrates `GeneratorRunRecord.pending_request`
  for a new `DurableGraphGenerator` instance.'
validation: 'Harness `user_story` scenario `session.yaml`: environment + graph + steps + complete expects.'
footnotes:
- id: insp-ioc-05
  label: Durable graph generators (R-IOC-RESUME)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/durable-graph-generators-inversion-of-control.md
  note: R-IOC-RESUME survive restart
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  recipe: verify_repair
  durable:
    controller: c1
    store: shared
steps:
- do:
    start:
      run_id: restart-1
      inputs:
        guidance:
        - question: Still pending after restart?
          choices:
          - id: ok
            label: OK
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: equals
    key: question
    value: Still pending after restart?
- do:
    rebuild: {}
- do:
    inspect: {}
  expect:
  - kind: equals
    key: phase
    value: guidance_required
  - kind: equals
    key: pending_question
    value: Still pending after restart?
  - kind: 'true'
    key: same_request_id
complete:
  expect:
  - kind: equals
    key: phase
    value: guidance_required
  - kind: equals
    key: pending_question
    value: Still pending after restart?
  - kind: 'true'
    key: same_request_id
cleanup: []
