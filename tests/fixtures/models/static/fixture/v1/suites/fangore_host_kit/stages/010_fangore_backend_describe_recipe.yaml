id: fangore_backend_describe_recipe
suite: fangore_host_kit
persona: fangore
title: Describe an inference backend through the backend_describe recipe
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`, and works with the
  `backend_describe` recipe. Before Fangore wires a host, he wants a machine-readable description of a
  configured backend — name, network behavior, auth — without leaving the recipe catalog. He runs backend_describe
  with the mock backend and gets the same metadata the classic describe command used to print. Complements
  `fangore_harness_run_recipe`. He walks product steps (run_recipe) and verifies completion from the structured
  observation expects on this scenario.
implementation: 'Agentic Recipe catalog id `backend_describe` (`BackendDescribeTemplate`) with a single
  describe node. `BackendDescribeRunner` calls `InferenceStrategy.describe()` via DI. `CliInstrumentor`
  verb `run_recipe` calls `recipe_runner.run_backend_describe_recipe`. CLI `describe` / `recipes run backend_describe`
  share this path. Soft points: backend (required), model, base_url, api_key, describe_kind.'
validation: 'Harness `user_story` scenario `describe_mock.yaml`: environment + graph + steps + complete
  expects.'
footnotes: []
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  recipe: backend_describe
steps:
- do:
    run_recipe:
      name: backend_describe
      backend: mock
complete:
  expect:
  - kind: 'true'
    key: recipe_in_catalog
  - kind: equals
    key: status
    value: ok
  - kind: equals
    key: description_name
    value: mock
  - kind: exactly
    key: subgraph_node_ids
    value:
    - describe
  - kind: lte
    key: cost_units
    value: 0
cleanup: []
