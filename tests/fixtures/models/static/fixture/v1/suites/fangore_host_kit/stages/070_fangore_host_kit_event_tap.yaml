id: fangore_host_kit_event_tap
suite: fangore_host_kit
persona: fangore
title: Tap graph node events from the blessed host executor
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. Fangore’s console
  needs live path lighting as a durable plan runs. They want the same short host wiring used for submit-once
  jobs — not a second hand-built executor — and still receive node start and end events for the active
  steps. Complements `fangore_host_kit_submit_once` and feeds console zoom stories such as `fangore_conversational_tool_loop`.
  He walks product steps (infer) and verifies completion from the structured observation expects on this
  scenario. [^ai-asst-hf05-insp]
implementation: '`mechaharness.host_kit.host_graph_executor` accepts `event_log=`. `tapping_event_log`
  / `TappingEventLog` forward emits to a host callback while preserving query. `CliInstrumentor` stamps
  then taps the blessed executor log so consoles see `core:graph_node_start` / `core:graph_node_end` on
  the same path as CLI infer (HF-05).'
validation: 'Harness `user_story` scenario `tapped_node_lifecycle.yaml`: environment + graph + steps +
  complete expects.'
footnotes:
- id: ai-asst-hf05-insp
  label: AI assistant host-friction inspiration
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/ai-assistant-host-friction-inspiration.md
  note: HF-05 event tap on host_graph_executor
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph: null
steps:
- do:
    infer:
      prompt: light the path.
complete:
  expect:
  - kind: equals
    key: status
    value: ok
  - kind: exactly
    key: tapped_event_types
    value:
    - core:access_check
    - core:graph_start
    - core:graph_node
    - core:graph_node_start
    - core:cost
    - core:inference
    - core:graph_node_end
    - core:graph_node
    - core:graph_node
    - core:graph_end
  - kind: includes
    key: event_types
    value:
    - core:inference
    - core:cost
  - kind: positive
    key: total_tokens
  - kind: lte
    key: total_tokens
    value: 32
  - kind: lte
    key: cost_units
    value: 1
cleanup: []
