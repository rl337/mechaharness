id: fangore_config_access_policy
suite: fangore_host_kit
persona: fangore
title: Let the host app supply its own permission policy
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. His product needs
  permission rules defined by the application. He declares a compound access policy in the story environment,
  runs `access_check`, and verifies composed packs allow read/write while denying media — bound through
  Config DI, not Settings bags.
implementation: '`MechaHarnessConfig` hooks (`get_access_policy`, `get_access_control`, `get_grants`)
  bind host permission packs through pyiv injection. Story `environment.access_policy` / `grants` override
  those hooks; product verb `access_check` observes Config-injected `AccessControl`. Hosts also pass grants
  on `run_recipe(...)`.'
validation: Harness `user_story` scenario `config_access_policy.yaml` drives `access_check` with environment
  compound policy; expects allows_compound / denies_missing.
footnotes: []
kind: user_story
environment:
  family: pass_through
  backend: mock
  access_policy:
    layers:
    - - core:fs.read
    - - core:fs.write
  filesystem:
    type: temp
steps:
- do:
    access_check:
      must_allow:
      - core:fs.read
      - core:fs.write
      must_deny:
      - core:media.image
complete:
  expect:
  - kind: 'true'
    key: allows_compound
  - kind: 'true'
    key: denies_missing
cleanup: []
