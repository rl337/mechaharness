id: fangore_tdr_crash_after_accept_recorded
suite: fangore_tdr_crash
persona: fangore
title: Resume after accept is already checkpointed
narrative: 'Fangore starts the CLI host with family `pass_through` and backend `mock`. He dispatches a
  remote coding job on a durable plan; the MechaHarness process dies after acceptance is recorded but
  before the outcome is reduced. After restart he opens the same durable store, resumes the plan, and
  verifies the remote job is submitted exactly once with the expected effect state for this crash window.
  Sibling windows: `fangore_tdr_crash_before_intent`, `fangore_tdr_crash_after_intent_before_call`, `fangore_tdr_crash_after_accept_before_record`,
  `fangore_tdr_crash_after_accept_recorded`, `fangore_tdr_crash_after_reduce_before_checkpoint`, and `fangore_tdr_crash_after_final_commit`.
  Complements `fangore_insp_durable_resume` fingerprint refusal. Tracks transactional durable resume[^tdr-req]
  and MH-PA-05[^insp-pa-05]. He walks product steps (`transactional_resume`) and verifies completion from
  the structured observation expects on this scenario.'
implementation: '`SqliteCheckpointStore` + `host_graph_executor` with `ArmedCrashProbe` for coding_job
  effects. Product CLI verb `transactional_resume` (`mechaharness.cli_transactional_resume`). Unit matrix:
  `tests/fixtures/transactional_durable_resume/*.json`.'
validation: 'Harness `user_story` scenario `crash_after_accept_recorded.yaml` drives product verb `transactional_resume`
  with `crash_location: after_accept_recorded`; hard expects on declared observation keys.'
footnotes: []
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph: null
steps:
- do:
    transactional_resume:
      crash_location: after_accept_recorded
      goal: downstream-coding-job
      run_id_prefix: story-tdr
complete:
  expect:
  - kind: 'true'
    key: crashed
  - kind: equals
    key: status
    value: ok
  - kind: equals
    key: node_status
    value: succeeded
  - kind: equals
    key: dispatch_count
    value: 1
  - kind: equals
    key: dispatch_count_after_crash
    value: 1
  - kind: equals
    key: effect_state_before
    value: accepted
  - kind: equals
    key: effect_state_after
    value: completed
  - kind: 'true'
    key: reconciliation_invoked
  - kind: equals
    key: boundary_before
    value: post_effect_pre_record
  - kind: lte
    key: cost_units
    value: 1
cleanup: []
