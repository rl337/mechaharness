id: fangore_bounded_retry_recipe
suite: fangore_recipes_tiling
persona: fangore
title: Run a bounded-retry Agentic Recipe with visible escalation
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. He loads Agentic
  Recipe `bounded_retry` with three fixture attempts that succeed on the last try, runs `run_recipe`,
  and verifies attempt_count, success without escalation, and the repeating attempt stop contract. Must
  compose with durable external-effect recovery from TDR crash-window stories. [^rc-bounded-retry]
implementation: Agentic Recipe `bounded_retry` via `BoundedRetryTemplate` / `bounded_retry_runner` and
  product verb `run_recipe` (`BoundedRetryRecipeAdapter`).
validation: Harness `user_story` scenario `bounded_retry_recipe.yaml` drives `run_recipe`; expects attempt_count
  / attempt_succeeded / escalated plus shape keys.
footnotes:
- id: rc-bounded-retry
  label: Recipes requirements (bounded retry)
  url: https://github.com/rl337/mechaharness/blob/requirements/recipes-decision-plane/docs/requirements/recipes-and-decision-plane.md
  note: RT-01..05 reference recipe
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  recipe: bounded_retry
  bind: binds/bounded_retry.yaml
steps:
- do:
    run_recipe:
      name: bounded_retry
      path: binds/bounded_retry.yaml
complete:
  expect:
  - kind: 'true'
    key: recipe_in_catalog
  - kind: equals
    key: status
    value: ok
  - kind: equals
    key: template_name
    value: bounded_retry
  - kind: includes
    key: subgraph_node_ids
    value:
    - attempt
    - classify
    - permit_retry
    - backoff
    - escalate
  - kind: 'true'
    key: attempt_repeating
  - kind: equals
    key: max_iterations
    value: 3
  - kind: 'true'
    key: requires_effect_reconciliation
  - kind: equals
    key: attempt_count
    value: 3
  - kind: 'true'
    key: attempt_succeeded
  - kind: 'false'
    key: escalated
  - kind: lte
    key: budget_spent
    value: 10
  - kind: lte
    key: cost_units
    value: 10
cleanup: []
