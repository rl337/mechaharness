id: fangore_conversational_tool_loop
suite: fangore_recipes_tiling
persona: fangore
title: Expand a conversational tool loop under a tools graph node
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`, and works with the
  `conversational_tool_loop` recipe. Fangore binds the library conversational tool-loop recipe so a chat
  tools step grows nested rounds — model complete then per-tool calls — inside the tools node’s checkpoint
  without pre-creating empty max-turn slots. A stop contract bounds the loop. Complements `fangore_insp_stop_contract`,
  `fangore_node_components`, and `fangore_host_kit_event_tap`. He walks product steps (run_recipe) and
  verifies completion from the structured observation expects on this scenario. [^ai-asst-hf07]
implementation: Agentic Recipe catalog id `conversational_tool_loop` (`ConversationalToolLoopTemplate`).
  `CliInstrumentor` verb `run_recipe` executes it via `ConversationalToolLoopRunner`, which expands `tools.subgraph`
  with nested `inference` and `tool_call` graph nodes per round. Soft points cover runner kinds, stop/max_iterations,
  message state, inference and tool dispatch. Bounds use existing `StopContract` / repeating fields.
validation: 'Harness `user_story` scenario `expanded_rounds.yaml`: environment + graph + steps + complete
  expects.'
footnotes:
- id: ai-asst-hf07
  label: AI assistant host-friction requirements map
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/ai-assistant-host-friction-requirements-map.md
  note: HF-07 conversational tool loop
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  recipe: conversational_tool_loop
steps:
- do:
    run_recipe:
      name: conversational_tool_loop
      max_iterations: 4
      tool_name: lookup
complete:
  expect:
  - kind: equals
    key: status
    value: ok
  - kind: equals
    key: rounds
    value: 2
  - kind: includes
    key: event_types
    value:
    - core:inference
  - kind: equals
    key: total_tokens
    value: 4
  - kind: lte
    key: total_tokens
    value: 4
  - kind: exactly
    key: subgraph_node_ids
    value:
    - round_0/inference
    - round_0/tool_call:lookup:0
    - round_1/inference
  - kind: lte
    key: cost_units
    value: 2
cleanup: []
