id: fangore_insp_fan_in_policy
suite: fangore_recipes_tiling
persona: fangore
title: Accept fan-in with a named quorum policy
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. Parallel branches
  rejoin through an explicit fan-in acceptance policy such as quorum rather than an implicit reduce. Accepts
  WalkingLabs P08 guidance[^wl-p08-fanin].
implementation: '`FanInPolicy` and `accept_fan_in` in `mechaharness.fan_in_policy` support ALL/ANY/quorum/weighted/predicate/judge/human/custom
  strategies. The `fan_out_aggregate` Agentic Recipe binds fan-in behavior at its reduce soft point when
  hosts tile parallel branches.'
validation: Harness `user_story` drives product verb(s) with environment `pass_through`/`mock`; hard expects
  on declared observation keys.
footnotes:
- id: wl-p08-fanin
  label: WalkingLabs P08 First Explicit Graph
  url: https://walkinglabs.github.io/learn-harness-engineering/en/projects/project-08-graph-engineering-first-graph/
  note: Fan-in acceptance
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    fan_in_policy:
      strategy: quorum
      quorum: 2
      results:
      - true
      - true
      - false
complete:
  expect:
  - kind: 'true'
    key: accepted
cleanup: []
