id: fangore_verify_repair_recipe
suite: fangore_recipes_tiling
persona: fangore
title: Run the verify-repair Agentic Recipe until verification succeeds
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. He loads Agentic
  Recipe `verify_repair` with a fixture artifact that fails the first verify, runs `run_recipe`, and verifies
  one repair attempt makes verification succeed under the stop contract. Complements `fangore_bounded_repair_loop`
  for loop helper semantics. [^insp-pa-03-verify]
implementation: Agentic Recipe `verify_repair` via `VerifyRepairTemplate` / `verify_repair_runner` and
  product verb `run_recipe` (`VerifyRepairRecipeAdapter`).
validation: Harness `user_story` scenario `verify_repair_recipe.yaml` drives `run_recipe`; expects verification_passed,
  repair_attempts, final_status plus shape keys.
footnotes:
- id: rc-verify-repair
  label: Recipes requirements (verify_repair)
  url: https://github.com/rl337/mechaharness/blob/requirements/recipes-decision-plane/docs/requirements/recipes-and-decision-plane.md
  note: verify_repair tiling story
- id: insp-pa-03-verify
  label: Personal agent reliability map (MH-PA-03 verify_repair)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/personal-agent-reliability-requirements-map.md
  note: Named recipe contract with budgets and outcomes
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  recipe: verify_repair
  bind: binds/verify_repair.yaml
steps:
- do:
    run_recipe:
      name: verify_repair
      path: binds/verify_repair.yaml
complete:
  expect:
  - kind: 'true'
    key: recipe_in_catalog
  - kind: equals
    key: status
    value: ok
  - kind: equals
    key: template_name
    value: verify_repair
  - kind: includes
    key: subgraph_node_ids
    value:
    - produce
    - verify
    - repair
    - complete
  - kind: 'true'
    key: verification_passed
  - kind: equals
    key: repair_attempts
    value: 1
  - kind: equals
    key: final_status
    value: succeeded
  - kind: lte
    key: budget_spent
    value: 10
  - kind: lte
    key: cost_units
    value: 10
cleanup: []
