# Verify-repair Agentic Recipe: produce → verify → bounded repair → complete.
name: verify_repair
summary: Tile verify-repair into a concrete plan with default runner kinds.
goal: ship artifact with verify gate
soft_bindings:
  produce_kind: produce
  verify_kind: verify
  repair_kind: repair
  complete_kind: complete
stop_contract:
  version: "1"
  max_iterations: 3
inputs:
  initial_verify_ok: false
  repairs_needed: 1
  artifact:
    text: draft
    ok: false
