id: fangore_bounded_repair_loop
suite: fangore_recipes_tiling
persona: fangore
title: Bound verification repair loops to a fixed number of attempts
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. After a failed verification
  he runs Agentic Recipe `verify_repair` with a stop contract of three repair attempts. One repair makes
  verification succeed — the loop does not run forever. Complements `fangore_verify_repair_recipe` for
  the recipe tile and `fangore_convergence_ceiling` for judge loops. [^insp-repair]
implementation: Agentic Recipe `verify_repair` via `VerifyRepairTemplate` / `verify_repair_runner` and
  product verb `run_recipe` (`VerifyRepairRecipeAdapter`). Library helper `bounded_repair` remains unit-covered
  for VER-03.
validation: Harness `user_story` scenario `verify_repair_succeeds.yaml` drives `run_recipe`; hard expects
  on final_status / repair_attempts.
footnotes:
- id: insp-repair
  label: Inspiration requirements (verification loops)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/dev-blog-inspiration.md
  note: Req 5 — verification is part of execution; structured enough to route repair
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  recipe: verify_repair
  bind: binds/verify_repair_succeeds.yaml
steps:
- do:
    run_recipe:
      name: verify_repair
      path: binds/verify_repair_succeeds.yaml
complete:
  expect:
  - kind: equals
    key: final_status
    value: succeeded
  - kind: 'true'
    key: verification_passed
  - kind: lte
    key: repair_attempts
    value: 3
  - kind: equals
    key: template_name
    value: verify_repair
  - kind: lte
    key: budget_spent
    value: 10
  - kind: lte
    key: cost_units
    value: 10
cleanup: []
