id: fangore_insp_budget_subgraph_rollup
suite: fangore_graph_executor
persona: fangore
title: Roll nested subgraph spend into the parent budget
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. He sets `environment.budget.soft_limit`
  to 2 and runs `run_budgeted_graph` with nest enabled so child node costs share the parent ledger. After
  soft wind-down, the later parent step is cancelled. [^insp-budget-rollup]
implementation: '`Budget.child()` / nested `GraphExecutor` spend rollup. Product verb `run_budgeted_graph`
  with `nest: true`; story `environment.budget` binds the policy.'
validation: Harness `user_story` scenario `child_rollup.yaml` drives nested `run_budgeted_graph`; expects
  soft_exhausted / after_status cancelled.
footnotes:
- id: insp-budget-rollup
  label: Inspiration dynamic subgraphs + budgets
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/dev-blog-inspiration.md
  note: Req 3 nested graphs share observable resource ceilings with the parent
kind: user_story
environment:
  family: pass_through
  backend: mock
  budget:
    soft_limit: 2
    hard_limit: null
  filesystem:
    type: temp
steps:
- do:
    run_budgeted_graph:
      nest: true
      node_cost: 1
complete:
  expect:
  - kind: equals
    key: status
    value: soft_exhausted
  - kind: equals
    key: budget_spent
    value: 2.0
  - kind: equals
    key: budget_level
    value: soft
  - kind: equals
    key: error
    value: soft_budget_exceeded
  - kind: equals
    key: after_status
    value: cancelled
  - kind: lte
    key: cost_units
    value: 2
cleanup: []
