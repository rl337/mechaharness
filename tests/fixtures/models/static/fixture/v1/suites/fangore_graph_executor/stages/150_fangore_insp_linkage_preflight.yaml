id: fangore_insp_linkage_preflight
suite: fangore_graph_executor
persona: fangore
title: Resolve graph linkage before any node runs
narrative: 'Fangore starts the CLI host with family `pass_through` and backend `mock`. Fangore''s injector
  can build services while a plan still names an unwired step. Linkage must fail closed before runners
  start, naming the missing edge. Accepts inspiration requirement 2[^insp-r02]. Related: `fangore_insp_stop_contract`.'
implementation: '`DefaultLinkageResolver` runner preflight; `CliInstrumentor` verb `graph_linkage_preflight`.


  Acceptance walks the registered CLI verb (TestHarnessCliConfig promotes remaining story probes when
  no src product verb exists yet).'
validation: Harness `user_story` walks the promoted product/test verb (no `probe:` wrapper); hard expects
  on declared observation keys.
footnotes:
- id: insp-r02
  label: 'Inspiration requirements (req 2: linkage vs DI)'
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/dev-blog-inspiration.md
  note: Req 2 — linkage vs DI
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    graph_linkage_preflight:
      check_missing_runner: true
      check_missing_stop: false
      check_ok_linear: true
  expect: &id001
  - kind: 'false'
    key: missing_runner_ok
  - kind: equals
    key: missing_runner_codes_exactly
    value:
    - no_runner
  - kind: 'true'
    key: ok_linear_ok
  - kind: 'true'
    key: ok_linear_fingerprint_nonempty
complete:
  expect: *id001
cleanup: []
