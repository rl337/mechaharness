id: fangore_traversal_contract
suite: fangore_graph_executor
persona: fangore
title: Align live traversal with node-component ids from existing events
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. As a run proceeds,
  Fangore’s console lights interiors that were laid out ahead of time. Inference and tool events must
  map to the same node-component identities under a parent graph node so the path lights up without a
  second observability graph. Complements `fangore_node_components` and `nubble_insp_rollout_graph`. He
  walks product steps (recipe_plan) and verifies completion from the structured observation expects on
  this scenario. [^ai-asst-nc-trav]
implementation: '`mechaharness.node_component.traversal_from_events` projects EventLog payloads whose
  types are existing core events (`inference`, `tool_call`, `tool_result`, `turn_start`, …) into `TraversalRecord`
  rows with `parent_node_id` and component ids. Harness emits enrich those payloads with `parent_node_id`
  / `component_id` / `execution_node_id`.'
validation: 'Harness `user_story` scenario `traversal_contract.yaml`: environment + graph + steps + complete
  expects.'
footnotes:
- id: ai-asst-nc-trav
  label: Node components reference
  url: https://github.com/rl337/mechaharness/blob/main/docs/reference/node-components.md
  note: Traversal section
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph: null
steps:
- do:
    recipe_plan:
      path: plans/traversal_contract.yaml
complete:
  expect:
  - kind: gte
    key: record_count_min
    value: 3
  - kind: 'true'
    key: has_inference
  - kind: 'true'
    key: has_tool_call
  - kind: 'true'
    key: all_have_parent
cleanup: []
