id: fangore_insp_exit_clean_state
suite: fangore_graph_executor
persona: fangore
title: Require clean-state exit before handoff
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. A run is not done
  until checkpoint durability, pending-node policy, and optional handoff records satisfy a clean-state
  exit contract. Accepts WalkingLabs L12 guidance[^wl-l12-exit].
implementation: '`CleanStateContract` / `ExitContract` and `evaluate_exit` in `mechaharness.exit_contract`
  check post-run clean-state invariants.'
validation: Harness `user_story` drives product verb(s) with environment `pass_through`/`mock`; hard expects
  on declared observation keys.
footnotes:
- id: wl-l12-exit
  label: WalkingLabs L12 Clean Session Handoffs
  url: https://walkinglabs.github.io/learn-harness-engineering/en/lectures/lecture-12-why-every-session-must-leave-a-clean-state/
  note: Clean-state exit
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    exit_clean_state:
      require_handoff_record: true
      pending_nodes: []
      checkpoint_durable: true
      unresolved_effects: []
      handoff_record_ref: handoff:1
complete:
  expect:
  - kind: 'true'
    key: ok
  - kind: equals
    key: issues
    value: []
cleanup: []
