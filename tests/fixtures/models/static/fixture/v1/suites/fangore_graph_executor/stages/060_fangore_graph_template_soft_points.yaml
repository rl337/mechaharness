id: fangore_graph_template_soft_points
suite: fangore_graph_executor
persona: fangore
title: Instantiate a reusable graph template with soft points
narrative: 'Fangore starts the CLI host with family `pass_through` and backend `mock`, and works with
  the `fan_out_aggregate` recipe. Fangore picks the library fan-out Agentic Recipe, fills only the soft
  points the host owns (branch payloads, runner kind names, acceptance), and keeps the resulting concrete
  plan in the host app. The skeleton must stamp which recipe produced it so later upgrades can detect
  drift. Independent-review and verify-repair recipes follow the same GraphTemplate pattern. He walks
  product steps (instantiate_recipe, recipe_plan) and verifies completion from the structured observation
  expects on this scenario. [^insp-templates][^insp-sr-03-soft] Related: `fangore_insp_soft_evolution_allowlist`.'
implementation: Agentic Recipes are concrete `GraphTemplate` subclasses in `mechaharness.graph_templates`.
  Catalog ids include `fan_out_aggregate` (this story's primary exercise), `verify_repair`, `independent_review`,
  `environment_repair`, and `initialize_preflight`. Each declares `SoftPoint`s; `GraphTemplate.instantiate`
  builds via `build` then stamps `template_name`, `template_version`, `template_status`, and optional
  `source_workflow_ref`. Demoted templates refuse instantiate. Bound via `MechaHarnessConfig.get_graph_template_registry()`.
validation: 'Harness `user_story` scenario `graph_template_soft_points.yaml`: environment + graph + steps
  + complete expects.'
footnotes:
- id: insp-templates
  label: Inspiration requirements (subgraphs & templates)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/dev-blog-inspiration.md
  note: Reqs 3, 10, and 19 — dynamic subgraphs, independent review, evidence-driven template incubation
- id: insp-sr-03-soft
  label: Self-revising recipe map (MH-SR-03 soft points)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/self-revising-recipe-requirements-map.md
  note: Soft points; evolution allowlist is fangore_insp_soft_evolution_allowlist
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  recipe: fan_out_aggregate
steps:
- do:
    instantiate_recipe:
      path: binds/fan_out_aggregate.yaml
  expect:
  - kind: equals
    key: template_name
    value: fan_out_aggregate
  - kind: equals
    key: template_status
    value: active
  - kind: includes
    key: subgraph_node_ids
    value:
    - plan
    - branch_0
    - branch_1
    - reduce
  - kind: equals
    key: source_workflow_ref
    value: host:workflows/compare_v1
  - kind: 'true'
    key: catalog_soft_points_nonempty
- do:
    recipe_plan:
      path: plans/demoted_refuse.yaml
  expect:
  - kind: 'true'
    key: demoted_refused
complete:
  expect:
  - kind: 'true'
    key: demoted_refused
cleanup: []
