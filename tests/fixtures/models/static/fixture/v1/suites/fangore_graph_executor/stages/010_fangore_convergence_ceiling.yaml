id: fangore_convergence_ceiling
suite: fangore_graph_executor
persona: fangore
title: Stop agent loops that make no progress
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. Fangore’s repair
  loop keeps asking the same question and getting the same answer. A versioned ceiling must end as no-progress
  — never fake success — and nested repair must share parent budget. Graph repeating nodes additionally
  require an explicit stop contract at linkage (`fangore_graph_linkage_preflight`). See inspiration requirements
  for stop contracts[^insp-stop].
implementation: '`ConvergenceGuard` / `ConvergenceContract`; `CliInstrumentor` verb `convergence_ceiling`.


  Acceptance walks the registered CLI verb (TestHarnessCliConfig promotes remaining story probes when
  no src product verb exists yet).'
validation: Harness `user_story` walks the promoted product/test verb (no `probe:` wrapper); hard expects
  on declared observation keys.
footnotes:
- id: insp-stop
  label: Inspiration requirements (stop contracts)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/dev-blog-inspiration.md
  note: Req 4 — repeating execution requires an explicit stop contract
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    convergence_ceiling:
      contract:
        version: story-conv-v1
        max_iterations: 10
        stagnation_window: 2
        max_elapsed_ms: 60000
      fingerprints:
      - same
      - same
      - same
      elapsed_ms_per_tick: 5
  expect: &id001
  - kind: equals
    key: terminal
    value: no_progress
  - kind: equals
    key: reason
    value: stagnation
  - kind: 'false'
    key: success
complete:
  expect: *id001
cleanup: []
