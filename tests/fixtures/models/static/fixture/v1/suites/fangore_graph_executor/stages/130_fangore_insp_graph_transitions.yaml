id: fangore_insp_graph_transitions
suite: fangore_graph_executor
persona: fangore
title: Declare graph transitions separately from dependencies
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. Fangore needs success,
  rollback, and end paths declared as transitions — not inferred from dependency edges alone — so graphs
  can be inspected before they run. Accepts WalkingLabs L14 and P08 guidance[^wl-l14-transitions][^wl-p08-transitions].
implementation: '`TransitionContract` / `inspect_transitions`; `CliInstrumentor` verb `graph_transition_inspect`.


  Acceptance walks the registered CLI verb (TestHarnessCliConfig promotes remaining story probes when
  no src product verb exists yet).'
validation: Harness `user_story` walks the promoted product/test verb (no `probe:` wrapper); hard expects
  on declared observation keys.
footnotes:
- id: wl-l14-transitions
  label: WalkingLabs L14 Graph Engineering
  url: https://walkinglabs.github.io/learn-harness-engineering/en/lectures/lecture-14-graph-engineering/
  note: Transitions vs dependencies
- id: wl-p08-transitions
  label: WalkingLabs P08 First Explicit Graph
  url: https://walkinglabs.github.io/learn-harness-engineering/en/projects/project-08-graph-engineering-first-graph/
  note: Explicit transitions
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    graph_transition_inspect:
      nodes:
      - produce
      - verify
      inspect_node: verify
      transitions:
      - from_node: produce
        kind: success
        to_node: verify
      - from_node: verify
        kind: rollback
        to_node: produce
        reason: verification_failed
      - from_node: verify
        kind: end
        reason: accepted
  expect: &id001
  - kind: equals
    key: issues
    value: []
  - kind: equals
    key: verify_kinds_exactly
    value:
    - end
    - rollback
complete:
  expect: *id001
cleanup: []
