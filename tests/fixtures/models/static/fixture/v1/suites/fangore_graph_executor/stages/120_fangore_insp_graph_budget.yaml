id: fangore_insp_graph_budget
suite: fangore_graph_executor
persona: fangore
title: Enforce soft and hard spend limits on graph runs
narrative: 'Fangore starts the CLI host with family `pass_through` and backend `mock`. He runs `run_budgeted_graph`
  with soft then hard policies on a two-node compute graph. Soft wind-down returns soft_exhausted; hard
  fail returns hard_budget_exceeded. Related: `fangore_insp_budget_subgraph_rollup`. [^insp-budget]'
implementation: '`BudgetPolicy` soft/hard limits on `GraphExecutor`. Product verb `run_budgeted_graph`;
  hosts also pass `budget_policy=` on `run_recipe` / story `environment.budget`.'
validation: Harness `user_story` scenario `soft_and_hard.yaml` drives `run_budgeted_graph`; expects soft_status
  / hard_status and error codes.
footnotes:
- id: insp-budget
  label: Inspiration stop/budget ceilings
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/dev-blog-inspiration.md
  note: Req 4 stop contracts and resource budgets on repeating work
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    run_budgeted_graph:
      node_cost: 1
      soft_policy:
        soft_limit: 1
        hard_limit: null
      hard_policy:
        soft_limit: null
        hard_limit: 1
complete:
  expect:
  - kind: equals
    key: soft_status
    value: soft_exhausted
  - kind: equals
    key: soft_error
    value: soft_budget_exceeded
  - kind: equals
    key: soft_budget_level
    value: soft
  - kind: equals
    key: hard_status
    value: failed
  - kind: equals
    key: hard_error
    value: hard_budget_exceeded
  - kind: equals
    key: hard_budget_level
    value: hard
  - kind: lte
    key: cost_units
    value: 2
cleanup: []
