id: fangore_insp_verification_gate
suite: fangore_graph_executor
persona: fangore
title: Keep answer-generated distinct from task-complete
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. Producing an answer
  is not the same as finishing the task when verification is required. Accepts inspiration requirement
  5[^insp-r05].
implementation: '`OutcomeContract` in `mechaharness.outcome_contract` distinguishes `answer_generated`,
  `verified`, `complete`, and `failed`. `DefaultVerificationPolicy` selects the strongest sufficient oracle
  and gates completion through the outcome contract when `require_verification` is set.'
validation: Harness `user_story` drives product verb(s) with environment `pass_through`/`mock`; hard expects
  on declared observation keys.
footnotes:
- id: insp-r05
  label: 'Inspiration requirements (req 5: verification)'
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/dev-blog-inspiration.md
  note: Req 5 — verification
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    verification_outcome:
      require_verification: true
complete:
  expect:
  - kind: equals
    key: before_verify_completion
    value: answer_generated
  - kind: equals
    key: after_verify_completion
    value: complete
  - kind: 'true'
    key: verification_passed
cleanup: []
