id: fangore_insp_recipe_port_search
suite: fangore_recipe_registry
persona: fangore
title: Search compatible recipe compositions by typed ports
narrative: 'Fangore starts the CLI host with family `pass_through` and backend `mock`. Candidate compositions
  are found by searching only the registered recipes for ones whose declared inputs and outputs fit what
  is needed. The answer is a list of recipe names; nothing is generated, so no new executable code can
  enter the production path. A recipe that declares no ports is never suggested, and a type mismatch rules
  a recipe out. He walks product steps (recipe_plan) and verifies completion from the structured observation
  expects on this scenario. [^insp-sr-04] Related: `fangore_insp_isolation_io`.'
implementation: '`search_compatible_recipes(registry, required_inputs, required_outputs)` in `recipe_port_search.py`
  compares each active recipe''s `GraphTemplate.io_contract` (`TemplateIOContract` from `isolation_contract.py`)
  with the requested ports (type equality, `any` as a wildcard) and returns sorted catalog ids only. `io_contract`
  is declared on `safety_eval`, `independent_review`, `produce_critique_refine`, `verify_repair`, and
  `fan_out_aggregate`; other recipes are skipped until they declare ports.'
validation: 'Harness `user_story` scenario `recipe_port_search.yaml`: environment + graph + steps + complete
  expects.'
footnotes:
- id: insp-sr-04
  label: Self-revising recipe evolution (MH-SR-04)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/self-revising-recipe-evolution.md
  note: Typed-port composition search
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph: null
steps:
- do:
    recipe_plan:
      path: plans/port_search.yaml
complete:
  expect:
  - kind: equals
    key: found
    value:
      produces_artifact:
      - produce_critique_refine
      - verify_repair
      accepts_scenario:
      - safety_eval
      scenario_to_report:
      - safety_eval
      wildcard:
      - safety_eval
      wrong_type: []
      unknown_port: []
  - kind: 'true'
    key: all_catalog_ids
  - kind: 'true'
    key: undeclared_recipes_skipped
cleanup: []
