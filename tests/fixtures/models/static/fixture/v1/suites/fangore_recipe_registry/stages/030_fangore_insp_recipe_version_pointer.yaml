id: fangore_insp_recipe_version_pointer
suite: fangore_recipe_registry
persona: fangore
title: Promote and roll back recipes via an immutable version pointer
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. Recipe execution
  policies are versioned, testable, replaceable artifacts with a reversible promotion pointer — not only
  class version fields and demotion stamps. Incubation stamps exist in `fangore_insp_template_incubation`;
  lineage and evaluation attachments are in `fangore_insp_recipe_lineage_promote`. Tracks MH-SR-01. He
  walks product steps (recipe_plan) and verifies completion from the structured observation expects on
  this scenario. [^insp-sr-01]
implementation: '`GraphTemplateRegistry` stores every version of a catalog id (here `verify_repair`):
  `add_version` registers an immutable inactive candidate, `promote(name, version)` moves the active pointer,
  `rollback(name)` restores the previous target, and `get(name, version=...)` reads any stored version.
  `register` keeps legacy activate-by-name semantics. Eval results and promotion policy stay host-owned.'
validation: 'Harness `user_story` scenario `recipe_registry_versions.yaml`: environment + graph + steps
  + complete expects.'
footnotes:
- id: insp-sr-01
  label: Self-revising recipe evolution (MH-SR-01)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/self-revising-recipe-evolution.md
  note: Versioned replaceable recipe artifacts
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph: null
steps:
- do:
    recipe_plan:
      path: plans/registry_versions.yaml
complete:
  expect:
  - kind: equals
    key: active_version
    value: '1'
  - kind: equals
    key: versions
    value:
    - '1'
    - '2'
  - kind: equals
    key: lineage
    value:
      '1': null
      '2': '1'
  - kind: equals
    key: evaluation_counts
    value:
      '1': 0
      '2': 0
  - kind: equals
    key: errors
    value:
    - promote:KeyError
cleanup: []
