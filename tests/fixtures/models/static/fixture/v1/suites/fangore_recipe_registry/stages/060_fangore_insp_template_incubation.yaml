id: fangore_insp_template_incubation
suite: fangore_recipe_registry
persona: fangore
title: Stamp template provenance and refuse demoted skeletons
narrative: 'Fangore starts the CLI host with family `pass_through` and backend `mock`, and works with
  the `fan_out_aggregate` recipe. Reusable Agentic Recipes expose soft points and stamp provenance onto
  concrete graphs. Demoted templates that proved application-specific refuse instantiate. Accepts inspiration
  requirement 19. He walks product steps (instantiate_recipe, recipe_plan) and verifies completion from
  the structured observation expects on this scenario. [^insp-r19][^insp-sr-01-incubate] Related: `fangore_insp_recipe_version_pointer`.'
implementation: '`GraphTemplate` is the substrate for Agentic Recipes. `SoftPoint`, `GraphTemplate.stamp`,
  `status` active/deprecated/demoted, and optional `source_workflow_ref` support incubation. This story
  stamps and demotes via the `fan_out_aggregate` catalog entry.'
validation: 'Harness `user_story` scenario `graph_template_soft_points.yaml`: environment + graph + steps
  + complete expects.'
footnotes:
- id: insp-r19
  label: 'Inspiration requirements (req 19: template incubation)'
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/dev-blog-inspiration.md
  note: Req 19 — template incubation
- id: insp-sr-01-incubate
  label: Self-revising recipe map (MH-SR-01 incubation)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/self-revising-recipe-requirements-map.md
  note: Version/status stamps; pointer is fangore_insp_recipe_version_pointer
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  recipe: fan_out_aggregate
steps:
- do:
    instantiate_recipe:
      path: binds/fan_out_aggregate.yaml
  expect:
  - kind: equals
    key: template_name
    value: fan_out_aggregate
  - kind: equals
    key: template_status
    value: active
  - kind: includes
    key: subgraph_node_ids
    value:
    - plan
    - branch_0
    - branch_1
    - reduce
  - kind: equals
    key: source_workflow_ref
    value: host:workflows/compare_v1
  - kind: 'true'
    key: catalog_soft_points_nonempty
- do:
    recipe_plan:
      path: plans/demoted_refuse.yaml
  expect:
  - kind: 'true'
    key: demoted_refused
complete:
  expect:
  - kind: 'true'
    key: demoted_refused
cleanup: []
