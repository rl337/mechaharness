id: fangore_insp_soft_evolution_allowlist
suite: fangore_recipe_registry
persona: fangore
title: Declare which soft recipe fields may evolve under optimization
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. Hard nodes and trusted
  contracts are never silently rewritten by an optimizer; only allowlisted soft parameters (prompts, bounded
  rounds, reviewer counts) may evolve. Soft points already exist (`fangore_graph_template_soft_points`,
  `fangore_insp_soft_vs_hard`). Tracks MH-SR-03. He walks product steps (recipe_plan) and verifies completion
  from the structured observation expects on this scenario. [^insp-sr-03]
implementation: '`SoftPoint.evolvable` (default `False`) declares the evolution allowlist. `GraphTemplate.evolvable_soft_point_names()`
  lists it and `assert_evolution_allowed(changed)` refuses any edit outside it. `produce_critique_refine`
  marks `critique_prompt` and `max_rounds`; `independent_review` marks `reviewer_count`; every other catalog
  soft point stays hard.'
validation: 'Harness `user_story` scenario `soft_point_evolution_allowlist.yaml`: environment + graph
  + steps + complete expects.'
footnotes:
- id: insp-sr-03
  label: Self-revising recipe evolution (MH-SR-03)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/self-revising-recipe-evolution.md
  note: Soft optimizable vs hard immutable
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph: null
steps:
- do:
    recipe_plan:
      path: plans/soft_evolution.yaml
complete:
  expect:
  - kind: equals
    key: outcomes
    value:
      tune_prompt: allowed
      drop_isolation: refused
      more_reviewers: allowed
      swap_runner: refused
  - kind: equals
    key: evolvable
    value:
      produce_critique_refine:
      - critique_prompt
      - max_rounds
      independent_review:
      - reviewer_count
      verify_repair: []
cleanup: []
