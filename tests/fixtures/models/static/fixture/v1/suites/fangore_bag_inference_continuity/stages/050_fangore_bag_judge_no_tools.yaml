id: fangore_bag_judge_no_tools
suite: fangore_bag_inference_continuity
persona: fangore
title: Judge bag evidence with zero tool definitions
narrative: Fangore starts the CLI host with family `pass_through` and backend
  `mock`. He seeds a proposal plus verified evidence (and unrelated noise), then
  runs a bag-aware `judge` node whose ContextSpec selects only the authorized
  paths. The judge Completer receives no tool schemas, performs no tool calls,
  and publishes a typed verdict to `out.judgment`.
implementation: '`CliJudgeRunner` compiles `ContextSpec` against a frozen bag
  snapshot, refuses tool loops, validates typed verdicts, and publishes to the
  live bag; `graph_walk` registers `judge`/`cli:judge` and surfaces
  `inference.judge.*`.'
validation: Suite stage `050_fangore_bag_judge_no_tools` — continue completes with
  `inference.judge.tool_call_count=0`,
  `inference.judge.includes_verified_evidence=true`, and
  `bag.out.judgment.valid=true`.
footnotes:
- id: gastronomic-m3-judge
  label: Gastronomic guided-development M3 (no-tool judge)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/gastronomic-guided-development-execution-plan.md
  note: Judges compile bag context but never receive or dispatch tools
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  inline:
    goal: judge proposal from verified evidence
    nodes:
    - id: seed
      kind: compute
      payload:
        bag_put:
          out.proposal:
            action: add_number_parser
          out.verified:
            discovery_status: found
            files_ok: true
          ctx.noise:
            secret: ignore-me
    - id: judge
      kind: judge
      depends_on:
      - seed
      payload:
        completion:
          valid: true
          verdict: accept
          evidence_refs:
          - out.verified
        context:
          version: "1"
          system: Return one JSON judgment object only. No tools.
          user_preamble: Judge using only the following bag evidence.
          reads:
          - path: out.proposal
            required: true
          - path: out.verified
            required: true
          response:
            writes: out.judgment
            parse: json
steps:
- do:
    graph_walk:
      action: start
      until: judge
      stop: before
  expect:
  - kind: equals
    key: stopped_before
    value: judge
  - kind: equals
    key: bag.out.verified.files_ok
    value: true
- do:
    graph_walk:
      action: continue
  expect:
  - kind: equals
    key: status
    value: ok
  - kind: equals
    key: node_error
    value: ""
  - kind: equals
    key: inference.judge.tool_call_count
    value: 0
  - kind: equals
    key: inference.judge.includes_verified_evidence
    value: true
  - kind: equals
    key: model_inputs.judge.tool_definitions
    value: []
  - kind: equals
    key: bag.out.judgment.valid
    value: true
complete:
  expect:
  - kind: equals
    key: status
    value: ok
  - kind: equals
    key: bag.out.judgment.valid
    value: true
  - kind: equals
    key: inference.judge.tool_call_count
    value: 0
cleanup: []
