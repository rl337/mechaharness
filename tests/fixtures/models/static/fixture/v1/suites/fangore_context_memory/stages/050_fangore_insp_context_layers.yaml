id: fangore_insp_context_layers
suite: fangore_context_memory
persona: fangore
title: Project node-private context from shared graph state
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. Fangore keeps durable
  graph state large and shared while each node receives only the private projection it needs; only explicit
  exports re-enter shared state. Accepts WalkingLabs L14 and L04 guidance[^wl-l14-layers][^wl-l04-layers].
implementation: '`GraphSharedState`, `NodePrivateContext`, and `project_node_context` in `mechaharness.context_layers`
  formalize shared vs private layers and export-only write-back.'
validation: Harness `user_story` drives product verb(s) with environment `pass_through`/`mock`; hard expects
  on declared observation keys.
footnotes:
- id: wl-l14-layers
  label: WalkingLabs L14 Graph Engineering
  url: https://walkinglabs.github.io/learn-harness-engineering/en/lectures/lecture-14-graph-engineering/
  note: Shared vs private context
- id: wl-l04-layers
  label: WalkingLabs L04 Split Instructions
  url: https://walkinglabs.github.io/learn-harness-engineering/en/lectures/lecture-04-why-one-giant-instruction-file-fails/
  note: Load context close to use
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    context_layers_project:
      shared:
        goal: ship
        notes:
        - a
      needs:
      - goal
      exports:
        result: ok
complete:
  expect:
  - kind: includes
    key: projected_keys
    value:
    - goal
  - kind: 'true'
    key: shared_has_result
  - kind: 'false'
    key: projected_has_notes
cleanup: []
