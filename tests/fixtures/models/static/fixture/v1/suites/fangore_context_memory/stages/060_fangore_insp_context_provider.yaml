      content: 'alpha beta gamma alpha beta gamma alpha beta gamma alpha beta gamma alpha beta gamma alpha
        beta gamma alpha beta gamma alpha beta gamma alpha beta gamma alpha beta gamma alpha beta gamma
        alpha beta gamma alpha beta gamma alpha beta gamma alpha beta gamma alpha beta gamma alpha beta
        gamma alpha beta gamma alpha beta gamma alpha beta gamma '
complete:
  expect:
  - kind: equals
    key: index_count
