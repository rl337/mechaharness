id: fangore_insp_context_provider
suite: fangore_context_memory
persona: fangore
title: Discover context indices before loading large payloads
narrative: 'Fangore starts the CLI host with family `pass_through` and backend `mock`. Fangore''s host
  memory source must advertise what it can supply before dumping large payloads into a turn. Accepts inspiration
  requirement 6[^insp-r06]. Related personal-agent freshness/provenance story: `fangore_insp_tool_result_freshness`[^insp-pa-01-provider].'
implementation: '`ContextProvider` / `StaticContextProvider` expose `index` then `load` with provenance
  and token estimates.'
validation: Harness `user_story` drives product verb(s) with environment `pass_through`/`mock`; hard expects
  on declared observation keys.
footnotes:
- id: insp-r06
  label: 'Inspiration requirements (req 6: scoped context)'
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/dev-blog-inspiration.md
  note: Req 6 — scoped context
- id: insp-pa-01-provider
  label: Personal agent reliability map (MH-PA-01 provider)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/personal-agent-reliability-requirements-map.md
  note: Context provider provenance adjacent to MH-PA-01
kind: user_story
