environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  recipe: failure_diagnosis
steps:
- do:
    instantiate_recipe:
      path: binds/failure_diagnosis.yaml
  expect:
  - kind: equals
    key: template_name
