id: fangore_failure_diagnosis_syntax
suite: fangore_failure_diagnosis
persona: fangore
title: Classify syntax from python_parses verify failures
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. He walks
  failure_diagnosis against verify_runs evidence citing a python_parses SyntaxError and verifies
  failure_class syntax.
implementation: '`diagnosis_*` hard nodes; Agentic Recipe `failure_diagnosis`.'
validation: Suite stage `020_fangore_failure_diagnosis_syntax` — failure_class syntax.
footnotes:
- id: gastronomic-m6-diagnosis-syntax
  label: Gastronomic M6 diagnosis syntax
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/gastronomic-guided-development-execution-plan.md
  note: Distinguish syntax from semantics
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  inline:
    goal: diagnose syntax
    nodes:
    - id: seed
      kind: compute
      payload:
        bag_put:
          in.verification_report:
            version: '1'
            status: failed
            failures: []
            verify_runs:
            - ok: false
              path: src/calc/arithmetic.py
              index: 0
              failures:
              - 'verify_runs[0] src/calc/arithmetic.py: python_parses failed: SyntaxError'
            regression: {unchanged_invariants_ok: true, invariants_checked: 0}
    - id: constrain
      kind: diagnosis_constrain
      depends_on: [seed]
      payload:
        reads: {verification_report: in.verification_report}
        writes: {destination: acc.diagnosis.constraints}
    - id: classify
      kind: diagnosis_classify
      depends_on: [constrain]
      payload:
        reads: {constraints: acc.diagnosis.constraints}
        writes: {destination: acc.diagnosis.classification}
    - id: publish
      kind: diagnosis_publish
      depends_on: [classify]
      payload:
        reads:
          constraints: acc.diagnosis.constraints
          classification: acc.diagnosis.classification
        writes: {destination: out.diagnosis}
    - id: validate
      kind: diagnosis_validate
      depends_on: [publish]
      payload:
        reads: {source: out.diagnosis}
        writes: {destination: acc.diagnosis.validation}
        parameters: {fail_if_invalid: true}
steps:
- do:
    graph_walk: {action: start, grants: [core:graph.execute]}
  expect:
  - {kind: equals, key: status, value: paused}
- do:
    graph_walk: {action: continue}
  expect:
  - {kind: equals, key: status, value: ok}
  - {kind: equals, key: bag.out.diagnosis.failure_class, value: syntax}
complete:
  expect:
  - {kind: equals, key: bag.out.diagnosis.next_experiment, value: fix_parse_error_at_cited_span}
cleanup: []
