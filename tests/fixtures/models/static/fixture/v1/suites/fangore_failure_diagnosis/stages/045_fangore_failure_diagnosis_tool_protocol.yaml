id: fangore_failure_diagnosis_tool_protocol
suite: fangore_failure_diagnosis
persona: fangore
title: Classify tool_protocol from malformed tool_call evidence
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. He walks
  failure_diagnosis against VerificationReport failures that cite a malformed tool_call JSON
  payload, and verifies `out.diagnosis.failure_class` is tool_protocol.
implementation: '`diagnosis_*` hard nodes; Agentic Recipe `failure_diagnosis`.'
validation: Suite stage `045_fangore_failure_diagnosis_tool_protocol` — failure_class tool_protocol.
footnotes:
- id: gastronomic-m6-diagnosis-tool-protocol
  label: Gastronomic M6 diagnosis tool_protocol
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/gastronomic-guided-development-execution-plan.md
  note: Protocol shape failures are distinct from semantics
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  inline:
    goal: diagnose tool protocol
    nodes:
    - id: seed
      kind: compute
      payload:
        bag_put:
          in.verification_report:
            version: '1'
            status: failed
            failures:
            - 'malformed tool_call JSON: missing name'
            verify_runs: []
            regression: {unchanged_invariants_ok: true, invariants_checked: 0}
    - id: constrain
      kind: diagnosis_constrain
      depends_on: [seed]
      payload:
        reads: {verification_report: in.verification_report}
        writes: {destination: acc.diagnosis.constraints}
    - id: classify
      kind: diagnosis_classify
      depends_on: [constrain]
      payload:
        reads: {constraints: acc.diagnosis.constraints}
        writes: {destination: acc.diagnosis.classification}
    - id: publish
      kind: diagnosis_publish
      depends_on: [classify]
      payload:
        reads:
          constraints: acc.diagnosis.constraints
          classification: acc.diagnosis.classification
        writes: {destination: out.diagnosis}
    - id: validate
      kind: diagnosis_validate
      depends_on: [publish]
      payload:
        reads: {source: out.diagnosis}
        writes: {destination: acc.diagnosis.validation}
        parameters: {fail_if_invalid: true}
steps:
- do:
    graph_walk: {action: start, grants: [core:graph.execute]}
  expect:
  - {kind: equals, key: status, value: paused}
- do:
    graph_walk: {action: continue}
  expect:
  - {kind: equals, key: status, value: ok}
  - {kind: equals, key: bag.out.diagnosis.failure_class, value: tool_protocol}
complete:
  expect:
  - {kind: equals, key: bag.out.diagnosis.next_experiment, value: repair_tool_call_shape_or_schema}
cleanup: []
