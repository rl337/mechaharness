id: fangore_failure_diagnosis_unknown
suite: fangore_failure_diagnosis
persona: fangore
title: Unclassified host evidence yields failure_class unknown
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. He walks
  failure_diagnosis against VerificationReport failures whose text matches no known class rule,
  and verifies `out.diagnosis.failure_class` is unknown.
implementation: '`diagnosis_*` hard nodes; Agentic Recipe `failure_diagnosis`.'
validation: Suite stage `050_fangore_failure_diagnosis_unknown` — failure_class unknown.
footnotes:
- id: gastronomic-m6-diagnosis-unknown
  label: Gastronomic M6 diagnosis unknown
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/gastronomic-guided-development-execution-plan.md
  note: Unknown must not invent a class; next experiment gathers more evidence
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  inline:
    goal: diagnose unknown
    nodes:
    - id: seed
      kind: compute
      payload:
        bag_put:
          in.verification_report:
            version: '1'
            status: failed
            failures:
            - 'host observed opaque checker signal zzz-999'
            verify_runs: []
            regression: {unchanged_invariants_ok: true, invariants_checked: 0}
    - id: constrain
      kind: diagnosis_constrain
      depends_on: [seed]
      payload:
        reads: {verification_report: in.verification_report}
        writes: {destination: acc.diagnosis.constraints}
    - id: classify
      kind: diagnosis_classify
      depends_on: [constrain]
      payload:
        reads: {constraints: acc.diagnosis.constraints}
        writes: {destination: acc.diagnosis.classification}
    - id: publish
      kind: diagnosis_publish
      depends_on: [classify]
      payload:
        reads:
          constraints: acc.diagnosis.constraints
          classification: acc.diagnosis.classification
        writes: {destination: out.diagnosis}
    - id: validate
      kind: diagnosis_validate
      depends_on: [publish]
      payload:
        reads: {source: out.diagnosis}
        writes: {destination: acc.diagnosis.validation}
        parameters: {fail_if_invalid: true}
steps:
- do:
    graph_walk: {action: start, grants: [core:graph.execute]}
  expect:
  - {kind: equals, key: status, value: paused}
- do:
    graph_walk: {action: continue}
  expect:
  - {kind: equals, key: status, value: ok}
  - {kind: equals, key: bag.out.diagnosis.failure_class, value: unknown}
complete:
  expect:
  - {kind: equals, key: bag.out.diagnosis.next_experiment, value: gather_more_host_evidence_before_retry}
cleanup: []
