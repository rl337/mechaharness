id: fangore_jev_task_route_simple_local
suite: fangore_jev
persona: fangore
title: Route simple work to the local small model
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. He judges a simple
  workload to the local_small lane. He verifies completion from structured observation expects.
implementation: Product verb `judge` + code-owned quality override on complexity facts.
validation: 'user_story judge; expect final_action=local_small. Live (`MECHA_STORY_BACKEND=live` + `MECHA_JUDGE_*`):
  same scenario via `SystemOneJudgeProvider` (cassette-exact token softens; behavioral expects hard).'
footnotes:
- id: jev-us07
  label: Jev typed-judgment inspiration (MH-JEV-US07)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/jev-typed-judgment-inspiration.md
  note: Task-specific model/workflow router
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph: null
steps:
- do:
    judge:
      state: 'WORKLOAD: rename a local variable in a unit test.'
      questions:
      - id: route
        kind: choice
        instructions: Choose the execution lane for this workload.
        options:
        - id: local_small
          description: local_small
        - id: frontier
          description: frontier
        - id: tool
          description: tool
        - id: human
          description: human
        allowed_actions:
        - local_small
        - frontier
        - tool
        - human
      action_question_id: route
      confidence_floor: 0.7
      facts:
        complexity: 0.2
      quality_complexity_floor: 0.7
      quality_override_action: frontier
complete:
  expect:
  - kind: equals
    key: final_action
    value: local_small
cleanup: []
