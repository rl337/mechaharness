name: independent_review
summary: Shape a requirements-aware review with isolated checkers
goal: requirements review
acceptance:
- stories_covered
- crash_tests_present
soft_bindings:
  reviewer_count: 2
  omit_producer_reasoning: true
inputs:
  reviewer_count: 2
  text: requirements draft
  producer_reasoning: should stay on produce
  review_findings:
  - id: coverage
    severity: note
  - id: crash
    severity: warn
