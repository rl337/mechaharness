id: fangore_jev_context_budget_pack
suite: fangore_jev
persona: fangore
title: Pack scored RAG candidates into a fixed token budget
narrative: 'Fangore starts the CLI host with family `pass_through` and backend `mock`. He binds a FixtureRagRetriever
  corpus and loads the `context_pack` Agentic Recipe for: Pack scored RAG candidates into a fixed token
  budget. He runs `run_recipe` context_pack (retrieve → pack via `assemble_context_within_budget`) and
  verifies selected_ids / within_budget. [^jev-us05]'
implementation: 'Agentic Recipe `context_pack` (`ContextPackTemplate`): `rag_retrieve` → `rag_pack`. Host
  binds `RagRetriever` (story: `FixtureRagRetriever` via `environment.rag_corpus`). Pack calls `assemble_context_within_budget`.
  Product verb `run_recipe`.'
validation: 'Harness `user_story` scenario `budget_pack.yaml`: environment.rag_corpus + graph.recipe context_pack
  + run_recipe; hard expects on selected_ids / within_budget.'
footnotes:
- id: jev-us05
  label: Jev typed-judgment inspiration (MH-JEV-US05)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/jev-typed-judgment-inspiration.md
  note: RAG context selection
- id: insp-pa-01-picker
  label: Personal agent reliability map (MH-PA-01 context freshness)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/personal-agent-reliability-requirements-map.md
  note: Native context freshness scoring; typed tool-result TTL is fangore_insp_tool_result_freshness
kind: user_story
environment:
  family: pass_through
  backend: mock
  rag_corpus: binds/corpus.yaml
  filesystem:
    type: temp
graph:
  recipe: context_pack
  bind: binds/pack.yaml
steps:
- do:
    run_recipe:
      name: context_pack
      path: binds/pack.yaml
complete:
  expect:
  - kind: equals
    key: selected_ids
    value:
    - c
    - a
  - kind: 'true'
    key: within_budget
  - kind: lte
    key: budget_spent
    value: 10
  - kind: lte
    key: cost_units
    value: 10
cleanup: []
