id: fangore_jev_action_safety__delete_low_risk_no_grant
suite: fangore_jev
persona: fangore
title: Let hard grants win over semantic risk classification (delete_low_risk_no_grant)
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. He judges semantic
  risk of a proposed action and applies hard AccessPolicy grants so hard grants always win. He verifies
  decision / hard_won / grants_unchanged. This stage covers the `delete_low_risk_no_grant` scenario.
implementation: Product verb `judge` with risk_question_id + required_abilities/grants; hard AccessPolicy
  gates over semantic risk.
validation: 'user_story scenarios with per-scenario cassettes; hard expects on decision keys. Live (`MECHA_STORY_BACKEND=live`
  + `MECHA_JUDGE_*`): same scenario via `SystemOneJudgeProvider` (cassette-exact token softens; behavioral
  expects hard). Stage id `fangore_jev_action_safety__delete_low_risk_no_grant` (scenario `delete_low_risk_no_grant`).'
footnotes:
- id: jev-us08
  label: Jev typed-judgment inspiration (MH-JEV-US08)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/jev-typed-judgment-inspiration.md
  note: Agent action safety firewall
- id: insp-pa-02-safety
  label: Personal agent reliability map (MH-PA-02 action safety)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/personal-agent-reliability-requirements-map.md
  note: Hard execution boundary for authority gate
- id: insp-dots-04
  label: OpenAI Dots agent safety (MH-DOTS-04)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/openai-dots-agent-safety-inspiration.md
  note: Independent action review allow/deny/request-approval
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph: null
steps:
- do:
    judge:
      state: 'Proposed action: delete /tmp/secret.txt'
      questions:
      - id: semantic_risk
        kind: choice
        instructions: Classify semantic risk of the proposed action.
        options:
        - id: low
          description: low
        - id: medium
          description: medium
        - id: high
          description: high
        allowed_actions:
        - low
        - medium
        - high
      action_question_id: semantic_risk
      risk_question_id: semantic_risk
      confidence_floor: 0.7
      grants: []
      required_abilities:
      - core:fs.write
complete:
  expect:
  - kind: equals
    key: decision
    value: deny
  - kind: equals
    key: hard_won
    value: true
  - kind: 'true'
    key: grants_unchanged
cleanup: []
