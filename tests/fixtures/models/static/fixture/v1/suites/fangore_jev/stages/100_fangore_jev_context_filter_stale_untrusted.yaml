id: fangore_jev_context_filter_stale_untrusted
suite: fangore_jev
persona: fangore
title: Keep stale or untrusted snippets out of the pack
narrative: 'Fangore starts the CLI host with family `pass_through` and backend `mock`. He binds a FixtureRagRetriever
  corpus and loads the `context_pack` Agentic Recipe for: Keep stale or untrusted snippets out of the
  pack. He runs `run_recipe` context_pack (retrieve → pack) and verifies selected_ids / within_budget.'
implementation: 'Agentic Recipe `context_pack` (`ContextPackTemplate`): `rag_retrieve` → `rag_pack`. Host
  binds `RagRetriever` (story: `FixtureRagRetriever` via `environment.rag_corpus`). Pack calls `assemble_context_within_budget`.
  Product verb `run_recipe`.'
validation: 'Harness `user_story` scenario `filter_stale_and_untrusted.yaml`: environment.rag_corpus +
  graph.recipe context_pack + run_recipe; hard expects on selected_ids / within_budget.'
footnotes: []
kind: user_story
environment:
  family: pass_through
  backend: mock
  rag_corpus: binds/corpus.yaml
  filesystem:
    type: temp
graph:
  recipe: context_pack
  bind: binds/pack.yaml
steps:
- do:
    run_recipe:
      name: context_pack
      path: binds/pack.yaml
complete:
  expect:
  - kind: equals
    key: selected_ids
    value:
    - fresh
  - kind: 'true'
    key: within_budget
  - kind: lte
    key: budget_spent
    value: 10
  - kind: lte
    key: cost_units
    value: 10
cleanup: []
