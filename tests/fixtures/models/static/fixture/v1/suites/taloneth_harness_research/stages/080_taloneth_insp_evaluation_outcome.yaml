id: taloneth_insp_evaluation_outcome
suite: taloneth_harness_research
persona: taloneth
title: Keep infrastructure failures out of task-success scores
narrative: Taloneth starts the CLI host with family `pass_through` and backend `mock`. Taloneth needs
  a dead sandbox or broken trace to count as unscorable execution failure, not as proof the model answered
  incorrectly. Accepts FineEnvs reward separation guidance[^fineenvs-outcome].
implementation: '`EvaluationOutcome` and `outcome_from_failure` in `mechaharness.evaluation_outcome`,
  with `task_trials` / `pass_at_k` in `mechaharness.eval_trial` excluding non-task outcomes from denominators.'
validation: Harness `user_story` drives product verb(s) with environment `pass_through`/`mock`; hard expects
  on declared observation keys.
footnotes:
- id: fineenvs-outcome
  label: FineEnvs multi-harness RL — rewards
  url: https://fineenvs-multi-harness-rl.hf.space/?__theme=system#rewards
  note: MH-MHRL-06
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    evaluation_outcome_filter:
      trials:
      - trial_id: '1'
        success: true
      - trial_id: '2'
        success: true
      - trial_id: '3'
        success: false
        outcome:
          kind: execution_failure
          reason: environment:sandbox_dead
      k: 1
complete:
  expect:
  - kind: equals
    key: task_trials
    value: 2
  - kind: 'true'
    key: pass_at_k_is_one
  - kind: equals
    key: non_task_trials
    value: 1
cleanup: []
