id: taloneth_insp_evaluator_compose
suite: taloneth_harness_research
persona: taloneth
title: Compose supplied evaluator claims with version metadata
narrative: Taloneth starts the CLI host with pass_through and mock. She supplies a versioned evaluator
  identity, a held-out label, and recorded file-check claims to evaluator_compose_run. She checks
  that passing claims compose to passed while evidence_origin stays caller_supplied. This walk does
  not execute or authenticate the named evaluator.
implementation: EvaluatorResult and Claim in mechaharness.evaluator and eval_evidence preserve the
  supplied identity and claims. compose_claims and all_passed compute the aggregate; no hardcoded
  passing grader runs.
validation: Harness `user_story` drives product verb(s) with environment `pass_through`/`mock`; hard
  expects on declared observation keys.
footnotes:
- id: anth-evals-evaluator
  label: Anthropic Demystifying evals for AI agents
  url: https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents
  note: Deterministic then model graders
- id: arxiv-verif-horizon
  label: Verification Horizon
  url: https://arxiv.org/abs/2606.26300
  note: Held-out evaluator versioning
- id: insp-sr-07-eval
  label: Self-revising recipe map (MH-SR-07 held_out)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/self-revising-recipe-requirements-map.md
  note: held_out metadata; final-test gate is taloneth_insp_recipe_final_test_gate
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    evaluator_compose_run:
      evaluator_id: fixture:file-check
      version: '1'
      held_out: true
      claims:
      - id: exists
        statement: file exists
        status: pass
        evidence_refs:
        - artifact:file-check
complete:
  expect:
  - kind: 'true'
    key: passed
  - kind: 'true'
    key: held_out
  - kind: equals
    key: evidence_origin
    value: caller_supplied
cleanup: []
