id: taloneth_insp_correction_spec_debt
suite: taloneth_harness_research
persona: taloneth
title: Capture corrections as reviewed specification debt before policy change
narrative: 'Taloneth starts the CLI host with family `pass_through` and backend `mock`. When a person
  corrects the agent, the correction is recorded as outstanding specification debt: the correction text,
  the scenarios that failed, and a link to the rule-promotion record it may harden into. The record stays
  flagged for human review until someone accepts it, and the host (not the library) generates the regression
  test and attaches it. Soft-to-hard promotion with provenance exists in `taloneth_insp_rule_promotion`.
  Tracks MH-PA-07[^insp-pa-07].'
implementation: '`SpecificationDebtRecord`, `SpecificationDebtLedger`, and `capture_correction()` in `specification_debt.py`
  hold the correction, `failing_scenario_refs`, `promotion_record_id` (from `PromotionRecord.record_id`),
  `review_required`, and a host-filled `generated_test_ref`; `link_test()` and `approve()` move status
  `open` → `test_linked` → `closed`. The library owns only the ledger schema; test generation stays with
  the host.


  Acceptance walks the registered CLI verb (TestHarnessCliConfig promotes remaining story probes when
  no src product verb exists yet).'
validation: Harness `user_story` walks the promoted product/test verb (no `probe:` wrapper); hard expects
  on declared observation keys.
footnotes:
- id: insp-pa-07
  label: Personal agent reliability (MH-PA-07)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/personal-agent-reliability-inspiration.md
  note: Correction-to-test feedback
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    specification_debt:
      correction: Reply on the original thread, never a new one.
      failing_scenarios:
      - scenario:reply-thread
      - scenario:cc-list
      promotion:
        record_id: promo:42
        observed_pattern: reply sent as a new thread
      host_test_ref: tests/test_reply.py::test_same_thread
  expect: &id001
  - kind: equals
    key: captured
    value:
      status: open
      review_required: true
      promotion_record_id: promo:42
      failing_scenario_refs:
      - scenario:reply-thread
      - scenario:cc-list
      generated_test_ref: null
  - kind: equals
    key: pending_at_capture
    value: 1
  - kind: equals
    key: status_after_test
    value: test_linked
  - kind: equals
    key: pending_after_test
    value: 1
  - kind: equals
    key: status_after_review
    value: closed
  - kind: equals
    key: pending_after_review
    value: 0
  - kind: 'true'
    key: linked_to_promotion
  - kind: 'true'
    key: blank_refused
complete:
  expect: *id001
cleanup: []
