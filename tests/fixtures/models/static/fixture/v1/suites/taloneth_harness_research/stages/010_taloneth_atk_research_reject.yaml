id: taloneth_atk_research_reject
suite: taloneth_harness_research
persona: taloneth
title: Reject research candidates that fail verified success
narrative: 'Taloneth starts the CLI host with family `pass_through` and backend `mock`. A cheap backend
  fails verified success against a frozen baseline. Research must reject it, keep negative results,
  and only promote noninferior survivors. Candidates cannot rewrite the evaluator. Related: `taloneth_validator_qualification`.
  Generic research loop for self-revising MH-SR-06; recipe-from-traces: `taloneth_insp_recipe_evolution_loop`[^insp-sr-06-research].'
implementation: "`ResearchLab` / `EvalProtocol` run bounded research: inspect \u2192 hypothesis \u2192\
  \ isolated experiment \u2192 ATK-style search \u2192 frozen evaluation protocol \u2192 promote/rollback.\
  \ Production evaluators stay protected.\n\nCovers: EXP-01, EXP-02, EXP-03, EXP-04. Final-test evidence\
  \ is supplied by the caller and bound to the candidate change set and protocol digest; no passing\
  \ evidence is synthesized."
validation: Harness `user_story` drives product verb(s) with environment `pass_through`/`mock`; hard
  expects on declared observation keys.
footnotes:
- id: insp-sr-06-research
  label: Self-revising recipe map (MH-SR-06 research loop)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/self-revising-recipe-requirements-map.md
  note: Generic research loop; recipe evolution is taloneth_insp_recipe_evolution_loop
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    atk_research_reject:
      task_split: story-atk-v1
      baseline_metric: 0.9
      candidates:
      - hypothesis: always pick cheapest backend
        change_set:
          decision_backend: tiny
        metric: 0.4
        whole_task_cost: 0.01
        safety_ok: true
      - hypothesis: keep rules + qualified tests
        change_set:
          verification_strategy: tests
        metric: 0.95
        whole_task_cost: 0.3
        ablations:
          no_ctx09: 0.94
        safety_ok: true
      final_test_hypothesis: keep rules + qualified tests
      final_test:
        evaluator_id: fixture:heldout
        version: '1'
        held_out: true
        passed: true
        claims:
        - id: test
          statement: held-out suite passed
          status: pass
          evidence_refs:
          - artifact:heldout-results
      final_test_candidate_digest: c76561657bf88c10a73620be25b067b205280d26bbfaccd3c0e3dda102cb9e2f
complete:
  expect:
  - kind: 'true'
    key: rejected_cheap_nonempty
  - kind: 'true'
    key: promoted_nonempty
  - kind: 'true'
    key: negative_results_nonempty
cleanup: []
