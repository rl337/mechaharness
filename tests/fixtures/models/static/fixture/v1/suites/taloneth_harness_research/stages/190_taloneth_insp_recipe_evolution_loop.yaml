id: taloneth_insp_recipe_evolution_loop
suite: taloneth_harness_research
persona: taloneth
title: Evolve recipe candidates from traces under registry and safety gates
narrative: 'Taloneth starts the CLI host with family `pass_through` and backend `mock`. A host can summarize
  past traces into suggestions, and the library turns them into a short list of candidate recipe settings
  that stay inside the catalog and inside the settings marked safe to tune. Anything that names an unknown
  recipe, an unknown or fixed setting, or a setting the host did not allow is reported as rejected rather
  than quietly dropped. Candidates are then chosen by an explicit scoring policy that respects its gates
  and a baseline. They walk product steps (recipe_plan) and verify completion from the structured observation
  expects on this scenario. [^insp-sr-06] Related: `taloneth_insp_recipe_final_test_gate`.'
implementation: '`recipe_evolution.py`: `RecipeTraceSummary` / `SoftBindingSuggestion` in, `propose_candidates()`
  out as `RecipeCandidate` soft-binding dicts validated by `validate_candidate()` against `GraphTemplateRegistry`
  names, `GraphTemplate.evolvable_soft_point_names()`, and an optional host allowlist; `select_candidate()`
  picks over `ScoredCandidate` results built from `ObjectivePolicy` / `aggregate_objective` with a deterministic
  tie-break. Pure structure for hosts such as an AI assistant project; evaluation reuses `ResearchLab`
  and the registry final-test gate.'
validation: 'Harness `user_story` scenario `recipe_evolution_candidates.yaml`: environment + graph + steps
  + complete expects.'
footnotes:
- id: insp-sr-06
  label: Self-revising recipe evolution (MH-SR-06)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/self-revising-recipe-evolution.md
  note: Candidate evolution loop
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph: null
steps:
- do:
    recipe_plan:
      path: plans/evolution_candidates.yaml
complete:
  expect:
  - kind: equals
    key: candidate_bindings
    value:
    - max_rounds: 3
    - critique_prompt: be strict about unsupported claims
  - kind: equals
    key: rejected
    value:
    - - refine_kind
      - soft_point_not_evolvable:refine_kind
    - - reviewer_count
      - soft_point_not_allowlisted:reviewer_count
    - - x
      - unknown_recipe:ghost_recipe
  - kind: 'true'
    key: deterministic
  - kind: 'false'
    key: graphs_synthesized
  - kind: equals
    key: selected_bindings
    value:
      critique_prompt: be strict about unsupported claims
  - kind: equals
    key: selected_over_baseline
    value: null
cleanup: []
