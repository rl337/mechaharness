id: taloneth_insp_gated_objective
suite: taloneth_harness_research
persona: taloneth
title: Apply efficiency only after correctness gates pass
narrative: Taloneth starts the CLI host with family `pass_through` and backend `mock`. Taloneth needs
  harness experiments to satisfy correctness first and only then prefer lower token use, matching gated
  FineEnvs reward design[^fineenvs-gated].
implementation: '`HarnessExperimentRunner.evaluate` accepts an `ObjectivePolicy` and uses gates plus `compare_lexicographic`
  so efficiency cannot beat a failed correctness gate.'
validation: Harness `user_story` drives product verb(s) with environment `pass_through`/`mock`; hard expects
  on declared observation keys.
footnotes:
- id: fineenvs-gated
  label: FineEnvs multi-harness RL — what we rewarded
  url: https://fineenvs-multi-harness-rl.hf.space/?__theme=system#what-we-rewarded
  note: MH-MHRL-08
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    gated_objective_evaluate:
      policy:
        policy_id: lexi
        gates:
        - correct
        lexicographic:
        - correct
        - efficiency
      treatment:
        correct: 0.0
        efficiency: 0.9
      control:
        correct: 1.0
        efficiency: 0.5
complete:
  expect:
  - kind: equals
    key: status
    value: retired
cleanup: []
