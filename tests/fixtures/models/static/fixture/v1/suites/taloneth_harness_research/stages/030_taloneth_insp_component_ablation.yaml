id: taloneth_insp_component_ablation
suite: taloneth_harness_research
persona: taloneth
title: Ablate harness components against a matched corpus
narrative: Taloneth starts the CLI host with family `pass_through` and backend `mock`. Taloneth runs a
  component-ablation experiment that disables named harness pieces against a matched corpus so retirement
  decisions rest on success/cost deltas. Accepts WalkingLabs L02 and P01 guidance[^wl-l02-ablation][^wl-p01-ablation].
implementation: '`ComponentAblationExperiment` and `ablation_delta` in `mechaharness.component_ablation`
  standardize baseline fingerprint, disabled component IDs, and quality/cost deltas.'
validation: Harness `user_story` drives product verb(s) with environment `pass_through`/`mock`; hard expects
  on declared observation keys.
footnotes:
- id: wl-l02-ablation
  label: WalkingLabs L02 What a Harness Is
  url: https://walkinglabs.github.io/learn-harness-engineering/en/lectures/lecture-02-what-a-harness-actually-is/
  note: Ablate components
- id: wl-p01-ablation
  label: WalkingLabs P01 Baseline vs Minimal
  url: https://walkinglabs.github.io/learn-harness-engineering/en/projects/project-01-baseline-vs-minimal-harness/
  note: Matched corpus
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    component_ablation_delta:
      baseline_fingerprint: full
      disabled_component_ids:
      - advisor
      task_corpus_ref: c1
      baseline_success_rate: 0.8
      ablated_success_rate: 0.5
complete:
  expect:
  - kind: equals
    key: success_delta
    value: -0.3
cleanup: []
