id: taloneth_insp_recipe_final_test_gate
suite: taloneth_harness_research
persona: taloneth
title: Require an untouched final test set before recipe promotion
narrative: 'Taloneth starts the CLI host with family `pass_through` and backend `mock`. A leading candidate
  must pass a separate untouched final test before it can be released, and that test must not be used
  as a tuning signal. Promotion is refused when no final-test result is supplied, when the result did
  not come from a held-out evaluator, or when it failed; only a passing held-out result opens the gate.
  The same rule guards both the research workflow and the recipe catalog''s active pointer. They walk
  product steps (recipe_plan) and verify completion from the structured observation expects on this scenario.
  [^insp-sr-07] Related: `taloneth_insp_evaluator_compose`.'
implementation: '`require_held_out_final_test()` and `FinalTestGateError` in `evaluator.py`; `ResearchLab.promote(candidate,
  final_test=...)` enforces it whenever `EvalProtocol.held_out_protected` (the default); `GraphTemplateRegistry.promote_with_final_test()`
  applies it before moving the active pointer and attaches the held-out result as an evaluation. Plain
  `GraphTemplateRegistry.promote()` stays an ungated pointer move for hosts that run their own gate.'
validation: 'Harness `user_story` scenario `recipe_final_test_gate.yaml`: environment + graph + steps
  + complete expects.'
footnotes:
- id: insp-sr-07
  label: Self-revising recipe evolution (MH-SR-07)
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/self-revising-recipe-evolution.md
  note: Held-out final-test release gate
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph: null
steps:
- do:
    recipe_plan:
      path: plans/final_test_gate.yaml
complete:
  expect:
  - kind: equals
    key: lab
    value:
      missing: refused
      not_held_out: refused
      held_out_failed: refused
      held_out_passed: promoted
  - kind: equals
    key: registry
    value:
      missing: refused
      not_held_out: refused
      held_out_failed: refused
      held_out_passed: promoted
  - kind: equals
    key: registry_pointer_after_refusals
    value: '1'
  - kind: 'true'
    key: unprotected_protocol_promotes
cleanup: []
