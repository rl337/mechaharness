title: Measure cache-aware prompt layout as an explicit experiment
narrative: Taloneth starts the CLI host with family `pass_through` and backend `mock`. Taloneth toggles
  cache-aware layout on and off. When enabled, stable policy blocks should sit in a stable prefix separate
  from the dynamic tail; when disabled, everything stays in the dynamic tail with diagnostics.
implementation: '`compile_cache_aware_layout` / `CacheLayout` under `CtxFlags.cache_aware_layout` — an
  independent experiment toggle with prefix identity diagnostics.


  Covers: CTX-09.'
validation: Harness `user_story` drives product verb(s) with environment `pass_through`/`mock`; hard expects
  on declared observation keys.
