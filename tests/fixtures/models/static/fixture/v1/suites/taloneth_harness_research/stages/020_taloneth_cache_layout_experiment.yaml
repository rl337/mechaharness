id: taloneth_cache_layout_experiment
suite: taloneth_harness_research
persona: taloneth
title: Compare enabled and disabled context layout
narrative: Taloneth starts the CLI host with family `pass_through` and backend `mock`. Taloneth toggles
  cache-aware layout on and off. When enabled, stable policy blocks should sit in a stable prefix
  separate from the dynamic tail; when disabled, everything stays in the dynamic tail with diagnostics.
implementation: "`compile_cache_aware_layout` / `CacheLayout` under `CtxFlags.cache_aware_layout`\
  \ \u2014 an independent experiment toggle with prefix identity diagnostics.\n\nCovers: CTX-09."
validation: Harness `user_story` drives product verb(s) with environment `pass_through`/`mock`; hard
  expects on declared observation keys.
footnotes: []
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    cache_layout_experiment:
      policy_blocks: &id001
      - policy
      relevant: &id002
      - ctx
      dynamic: &id003
      - q
      enabled: true
      policy_version: v2
  expect:
  - kind: 'true'
    key: enabled_has_stable_prefix
- do:
    cache_layout_experiment:
      policy_blocks: *id001
      relevant: *id002
      dynamic: *id003
      enabled: false
      policy_version: v2
complete:
  expect:
  - kind: equals
    key: enabled_has_stable_prefix
    value: false
  - kind: equals
    key: layout.dynamic_tail
    value:
    - policy
    - ctx
    - q
  - kind: equals
    key: provider_metrics_observed
    value: false
cleanup: []
