id: taloneth_insp_harness_hypothesis
suite: taloneth_harness_research
persona: taloneth
title: Express a harness change as a testable hypothesis
narrative: Taloneth starts the CLI host with family `pass_through` and backend `mock`. Taloneth writes
  the failure mode and expected metric before shipping a harness tweak, then evaluates with and without
  the change. Accepts inspiration requirement 14[^insp-r14].
implementation: '`HarnessExperiment` carries hypothesis, intervention, failure_mode, evidence, and `to_trace_fields`
  for version/assignment on traces.'
validation: Harness `user_story` drives product verb(s) with environment `pass_through`/`mock`; hard expects
  on declared observation keys.
footnotes:
- id: insp-r14
  label: 'Inspiration requirements (req 14: harness hypotheses)'
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/dev-blog-inspiration.md
  note: Req 14 — harness hypotheses
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    harness_experiment_retire:
      hypothesis: remove cache hint
      intervention: drop_cache_hint
      treatment_success: 0.6
      control_success: 0.85
complete:
  expect:
  - kind: equals
    key: status
    value: retired
  - kind: 'true'
    key: retirement_candidates_nonempty
cleanup: []
