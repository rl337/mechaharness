id: taloneth_insp_trial_reliability
suite: taloneth_harness_research
persona: taloneth
title: Separate pass@k capability from pass^k reliability
narrative: Taloneth starts the CLI host with family `pass_through` and backend `mock`. Taloneth records
  isolated trials with cost and latency, then reports pass@k for capability and pass^k for repeated-success
  reliability without conflating the two. Accepts Anthropic eval guidance, τ-bench, and HumanEval[^anth-evals-trial][^arxiv-taubench][^arxiv-humaneval].
implementation: '`Trial`, `pass_at_k`, `pass_caret_k`, and `trial_cost_rollup` in `mechaharness.eval_trial`
  aggregate isolated attempts.'
validation: Harness `user_story` drives product verb(s) with environment `pass_through`/`mock`; hard expects
  on declared observation keys.
footnotes:
- id: anth-evals-trial
  label: Anthropic Demystifying evals for AI agents
  url: https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents
  note: pass@k vs pass^k
- id: arxiv-taubench
  label: τ-bench
  url: https://arxiv.org/abs/2406.12045
  note: Reliability and end-state verification
- id: arxiv-humaneval
  label: Evaluating LLMs Trained on Code
  url: https://arxiv.org/abs/2107.03374
  note: pass@k definition
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    trial_reliability_metrics:
      trials:
      - trial_id: '1'
        success: true
        cost_usd: 0.01
        latency_ms: 10
      - trial_id: '2'
        success: false
        cost_usd: 0.02
        latency_ms: 20
      - trial_id: '3'
        success: true
        cost_usd: 0.01
        latency_ms: 15
      k: 2
complete:
  expect:
  - kind: 'true'
    key: pass_at_k_positive
  - kind: equals
    key: trials
    value: 3.0
cleanup: []
