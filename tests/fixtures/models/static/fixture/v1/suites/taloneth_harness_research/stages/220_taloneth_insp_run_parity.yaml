id: taloneth_insp_run_parity
suite: taloneth_harness_research
persona: taloneth
title: Surface material train and eval constraint mismatches
narrative: Taloneth starts the CLI host with family `pass_through` and backend `mock`. Taloneth needs
  comparable runs to record and flag mismatches in output caps, tool budgets, timeouts, and sampling so
  train and eval behavior stay aligned. Accepts FineEnvs train/eval parity findings. They walk product
  steps (compare_run_parity) and verify completion from the structured observation expects on this scenario.
  [^fineenvs-parity]
implementation: '`compare_parity` / `parity_from_harness_config` in `mechaharness.run_parity` compare
  harness constraint surfaces. `CliInstrumentor` verb `compare_run_parity` exposes the diagnostic.'
validation: 'Harness `user_story` scenario `parity_mismatch.yaml`: environment + graph + steps + complete
  expects.'
footnotes:
- id: fineenvs-parity
  label: FineEnvs multi-harness RL — train/eval decline
  url: https://fineenvs-multi-harness-rl.hf.space/?__theme=system#why-the-two-harbor-runs-declined
  note: MH-MHRL-12
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph: null
steps:
- do:
    compare_run_parity:
      a:
        model: m
        max_tokens: 1024
        temperature: 0.0
        max_turns: 4
        tools:
        - Read
      b:
        model: m
        max_tokens: 512
        temperature: 0.0
        max_turns: 4
        tools:
        - Read
complete:
  expect:
  - kind: 'false'
    key: comparable
  - kind: equals
    key: material_mismatches_exactly
    value:
    - max_tokens
    - sampling
cleanup: []
