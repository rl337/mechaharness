id: taloneth_insp_harness_health
suite: taloneth_harness_research
persona: taloneth
title: Snapshot harness health for cleanup evidence
narrative: Taloneth starts the CLI host with family `pass_through` and backend `mock`. Taloneth captures
  unused extensions, dead soft points, and unexercised routes as a harness-health snapshot so cleanup
  can be scheduled by the host. Accepts WalkingLabs L02 and L12 guidance[^wl-l02-health][^wl-l12-health].
implementation: '`HarnessHealthSnapshot` and `needs_cleanup` in `mechaharness.harness_health` provide
  the optional health schema.'
validation: Harness `user_story` drives product verb(s) with environment `pass_through`/`mock`; hard expects
  on declared observation keys.
footnotes:
- id: wl-l02-health
  label: WalkingLabs L02 What a Harness Is
  url: https://walkinglabs.github.io/learn-harness-engineering/en/lectures/lecture-02-what-a-harness-actually-is/
  note: Harness debt
- id: wl-l12-health
  label: WalkingLabs L12 Clean Session Handoffs
  url: https://walkinglabs.github.io/learn-harness-engineering/en/lectures/lecture-12-why-every-session-must-leave-a-clean-state/
  note: Cleanup evidence
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    harness_health:
      unused_extensions:
      - acme:old
      dead_soft_points: []
      unexercised_routes: []
complete:
  expect:
  - kind: 'true'
    key: needs_cleanup
cleanup: []
