id: taloneth_insp_cross_harness_failure
suite: taloneth_harness_research
persona: taloneth
title: Separate semantic task failure from invalid tool protocol
narrative: Taloneth starts the CLI host with family `pass_through` and backend `mock`. Taloneth needs
  cross-harness evaluation to classify invalid tool names and schema errors separately from simply getting
  the task wrong. Accepts FineEnvs out-of-harness failure modes[^fineenvs-xharness].
implementation: '`CrossHarnessFailure` and `classify_cross_harness_failure` in `mechaharness.cross_harness_failure`
  emit taxonomy kinds usable as claims inside matrix cells.'
validation: Harness `user_story` drives product verb(s) with environment `pass_through`/`mock`; hard expects
  on declared observation keys.
footnotes:
- id: fineenvs-xharness
  label: FineEnvs multi-harness RL — leaving native harness
  url: https://fineenvs-multi-harness-rl.hf.space/?__theme=system#when-a-model-leaves-the-harness-it-was-trained-in
  note: MH-MHRL-18
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    cross_harness_failure_classify:
      message: unknown tool foobar
complete:
  expect:
  - kind: equals
    key: kind
    value: invalid_tool_name
cleanup: []
