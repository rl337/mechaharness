id: nubble_insp_rollout_graph
suite: nubble_routing_topology
persona: nubble
title: Reconstruct retries and delegated agents as observed rollout branches
narrative: Nubble starts the CLI host with family `pass_through` and backend `mock`. Nubble needs the
  observed run topology — retries, spawned reviewers, and terminals — as a first-class graph linked back
  to the intended plan, not only the planned node list. Accepts FineEnvs training-sequence reconstruction[^fineenvs-rollout].
implementation: '`build_rollout_graph`; `CliInstrumentor` verb `rollout_graph_build`.


  Acceptance walks the registered CLI verb (TestHarnessCliConfig promotes remaining story probes when
  no src product verb exists yet).'
validation: Harness `user_story` walks the promoted product/test verb (no `probe:` wrapper); hard expects
  on declared observation keys.
footnotes:
- id: fineenvs-rollout
  label: FineEnvs multi-harness RL — training sequences
  url: https://fineenvs-multi-harness-rl.hf.space/?__theme=system#from-calls-to-training-sequences
  note: MH-MHRL-03
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    rollout_graph_build:
      records:
      - id: root
        kind: model_call
      - id: retry
        kind: retry
        parent_id: root
        execution_node_id: produce
        attempt: 2
      - id: review
        kind: delegated_agent
  expect: &id001
  - kind: equals
    key: roots_exactly
    value:
    - review
    - root
  - kind: 'true'
    key: retry_linked
complete:
  expect: *id001
cleanup: []
