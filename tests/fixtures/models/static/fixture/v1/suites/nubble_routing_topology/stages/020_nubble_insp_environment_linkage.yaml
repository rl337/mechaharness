id: nubble_insp_environment_linkage
suite: nubble_routing_topology
persona: nubble
title: Surface environment incompatibility as linkage failure
narrative: Nubble starts the CLI host with family `pass_through` and backend `mock`. Missing environment
  capability must become a structured pre-exec failure, not a mysterious mid-run error. Accepts inspiration
  requirement 16[^insp-r16].
implementation: '`DefaultLinkageResolver` environment grant check. `CliInstrumentor` verb `environment_linkage_fail`.


  Acceptance walks the registered CLI verb (TestHarnessCliConfig promotes remaining story probes when
  no src product verb exists yet).'
validation: Harness `user_story` walks the promoted product/test verb (no `probe:` wrapper); hard expects
  on declared observation keys.
footnotes:
- id: insp-r16
  label: 'Inspiration requirements (req 16: environment linkage)'
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/dev-blog-inspiration.md
  note: Req 16 — environment linkage
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    environment_linkage_fail:
      required_grant: core:media.image
  expect: &id001
  - kind: 'false'
    key: ok
  - kind: equals
    key: codes_exactly
    value:
    - environment_incompatible
complete:
  expect: *id001
cleanup: []
