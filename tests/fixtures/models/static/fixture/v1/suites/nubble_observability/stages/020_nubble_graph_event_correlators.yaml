id: nubble_graph_event_correlators
suite: nubble_observability
persona: nubble
title: Join every graph event to its graph, recipe, and authority
narrative: Nubble starts the CLI host with family `pass_through` and backend `mock`. Nubble loads graph
  events into a warehouse and cannot afford to open checkpoints to learn which graph, recipe, or authorization
  epoch produced a row. A multi-node run with a nested subgraph must stamp every event with the same graph
  id, recipe stamp, and epoch, and nested runs must point at their parent run so a flat table can rebuild
  per-node attempts[^obs-analytics].
implementation: 'Graph lifecycle emits carry warehouse correlators (`graph_id`, `recipe_id`, `authorization_epoch`,
  nest `parent_run_id` / `nest_depth`). `project_node_attempt_rows` projects attempt rows. `CliInstrumentor`
  verb `graph_event_correlators`.


  Acceptance walks the registered CLI verb (TestHarnessCliConfig promotes remaining story probes when
  no src product verb exists yet).'
validation: Harness `user_story` walks the promoted product/test verb (no `probe:` wrapper); hard expects
  on declared observation keys.
footnotes:
- id: obs-analytics
  label: Event analytics schema (OBS-A01..A06)
  url: https://github.com/rl337/mechaharness/blob/main/docs/requirements/event-analytics-schema.md
  note: Correlator contract and fact/dimension decomposition
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    graph_event_correlators:
      graph_id: corr-graph
      goal: ship the report
      recipe_id: verify_repair
      recipe_version: '1'
      authorization_epoch: 3
      nodes:
      - a
      - b
  expect: &id001
  - kind: equals
    key: status
    value: ok
  - kind: 'true'
    key: graph_events_have_graph_id
  - kind: 'true'
    key: node_events_have_node_id
  - kind: equals
    key: recipe
    value:
    - - verify_repair
      - '1'
  - kind: equals
    key: epochs
    value:
    - 3
  - kind: equals
    key: child_parent_run_ids
    value:
    - corr-run
  - kind: equals
    key: child_nest_depths
    value:
    - 1
  - kind: equals
    key: node_attempt_rows
    value:
    - - a
      - 1
      - succeeded
    - - b
      - 1
      - succeeded
    - - nest
      - 1
      - succeeded
  - kind: lte
    key: cost_units
    value: 3
complete:
  expect: *id001
cleanup: []
