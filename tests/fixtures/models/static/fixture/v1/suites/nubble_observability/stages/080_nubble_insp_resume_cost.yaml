id: nubble_insp_resume_cost
suite: nubble_observability
persona: nubble
title: Measure wake-to-productive resume cost
narrative: Nubble starts the CLI host with family `pass_through` and backend `mock`. Nubble records how
  expensive resume is — rebuild tokens, tool calls, and wake-to-first-productive time — so continuity
  work can be optimized. Accepts WalkingLabs L05 and P03 guidance[^wl-l05-resume][^wl-p03-resume].
implementation: '`ResumeCostMetrics` and `summarize_resume_cost` in `mechaharness.resume_cost` capture
  resume telemetry.'
validation: Harness `user_story` drives product verb(s) with environment `pass_through`/`mock`; hard expects
  on declared observation keys.
footnotes:
- id: wl-l05-resume
  label: WalkingLabs L05 Continuity
  url: https://walkinglabs.github.io/learn-harness-engineering/en/lectures/lecture-05-why-long-running-tasks-lose-continuity/
  note: Resume cost
- id: wl-p03-resume
  label: WalkingLabs P03 Multi-Session Continuity
  url: https://walkinglabs.github.io/learn-harness-engineering/en/projects/project-03-multi-session-continuity/
  note: Crash/resume metrics
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    resume_cost:
      wake_to_first_productive_ms: 1000
      rebuild_tokens: 400
      rebuild_tool_calls: 2
      provider_loads: 1
      revalidation_work: 1
      replayed_events: 5
complete:
  expect:
  - kind: equals
    key: rebuild_tokens
    value: 400
cleanup: []
