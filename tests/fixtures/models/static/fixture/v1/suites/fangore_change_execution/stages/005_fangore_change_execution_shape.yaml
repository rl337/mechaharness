id: fangore_change_execution_shape
suite: fangore_change_execution
persona: fangore
title: Instantiate the change_execution Agentic Recipe
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. He loads Agentic
  Recipe `change_execution` and verifies constrain/apply/publish/validate node ids.
implementation: Agentic Recipe `change_execution` (`ChangeExecutionTemplate`) via `instantiate_recipe`.
validation: Suite stage `005_fangore_change_execution_shape` — template_name and node ids.
footnotes:
- id: gastronomic-m6-execution-shape
  label: Gastronomic M6 change_execution
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/gastronomic-guided-development-execution-plan.md
  note: Scoped slice apply before verification
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  recipe: change_execution
steps:
- do:
    instantiate_recipe:
      path: binds/change_execution.yaml
  expect:
  - kind: equals
    key: template_name
    value: change_execution
  - kind: includes
    key: subgraph_node_ids
    value:
    - seed
    - constrain
    - apply
    - publish
    - validate
complete:
  expect:
  - kind: equals
    key: template_name
    value: change_execution
cleanup: []
