id: fangore_audited_infer_accept
suite: fangore_decision_plane
persona: fangore
title: Expand an audited infer-accept generate and gate spine
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`, and works with the
  `audited_infer_accept` recipe. He wants a generate → freeze criteria → decide → independent QA → deterministic
  → gate control pattern that a video production host can migrate onto, without shipping Comfy in the
  library. Soft modality selects text decide/QA kinds; principals for decide and QA differ. Complements
  `fangore_verify_repair_recipe` (oracle loop) and `fangore_guided_coding_recipe` (which tiles this spine).
  He walks product steps (instantiate_recipe) and verifies completion from the structured observation
  expects on this scenario.
implementation: 'Agentic Recipe catalog id `audited_infer_accept` (`AuditedInferAcceptTemplate` + `append_audited_infer_accept`).
  Domain `mechaharness.audited_decision` (`STAGES`, `criteria_hash`, `assert_principals_distinct`, `repair_target`).
  Default node kinds `audited.*`; hosts soft-bind runners (e.g. `host.infer.*`). Migration notes: `docs/inspiration/video-production-audited-infer-migration.md`.'
validation: 'Harness `user_story` scenario `spine.yaml`: environment + instantiate_recipe expects. Unit
  tests `tests/test_audited_decision.py`.'
footnotes: []
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  recipe: audited_infer_accept
steps:
- do:
    instantiate_recipe:
      path: binds/audited_infer_accept.yaml
  expect:
  - kind: equals
    key: template_name
    value: audited_infer_accept
  - kind: equals
    key: template_status
    value: active
  - kind: includes
    key: subgraph_node_ids
    value:
    - collect
    - freeze
    - decide
    - qa
    - deterministic
    - gate
complete:
  expect:
  - kind: equals
    key: template_name
    value: audited_infer_accept
  - kind: includes
    key: subgraph_node_ids
    value:
    - collect
    - gate
cleanup: []
