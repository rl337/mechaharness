id: fangore_decision_plane_shadow
suite: fangore_decision_plane
persona: fangore
title: Shadow a small decision model without giving it control
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. He loads Agentic
  Recipe `decision_plane` with `shadow_mode` and divergent production vs shadow fixture answers. He performs
  `run_recipe` and verifies production still controls while both outcomes are recorded and disagree. [^rc-dp-shadow]
implementation: Agentic Recipe `decision_plane` via `ShadowAskRunner` / `compare_shadow_decision` semantics.
  Product CLI verb `run_recipe` with `DecisionPlaneRecipeAdapter`.
validation: Harness `user_story` scenario `shadow_compare.yaml` drives `run_recipe`; hard expects on production_action
  / agreement keys.
footnotes:
- id: rc-dp-shadow
  label: Recipes requirements DP-07
  url: https://github.com/rl337/mechaharness/blob/requirements/recipes-decision-plane/docs/requirements/recipes-and-decision-plane.md
  note: Small-model shadow / evaluation mode
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
graph:
  recipe: decision_plane
  bind: binds/shadow_compare.yaml
steps:
- do:
    run_recipe:
      name: decision_plane
      path: binds/shadow_compare.yaml
complete:
  expect:
  - kind: equals
    key: production_action
    value: billing
  - kind: 'false'
    key: shadow_controls_execution
  - kind: 'true'
    key: both_outcomes_recorded
  - kind: equals
    key: agreement
    value: false
  - kind: lte
    key: budget_spent
    value: 10
  - kind: lte
    key: cost_units
    value: 10
cleanup: []
