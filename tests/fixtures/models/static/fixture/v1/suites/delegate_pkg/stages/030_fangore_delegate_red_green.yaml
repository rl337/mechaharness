id: fangore_delegate_red_green
suite: delegate_pkg
persona: fangore
title: Add a failing test then implement until pytest is green
narrative: 'Fangore asks the delegate to fix from a red test: pin `double()` in pytest first, then implement
  until the suite is green under verify_repair — the classic expensive coding handoff.'
implementation: 'Agentic Recipe catalog id `guided_coding` with `environment.local_work: project_coding`,
  `environment.workspace: suite`, soft point `external_guidance` (choices minimal/thorough), and budget
  soft point `max_iterations`. List stages pass `instruction_mode: list` into `ProjectCodingLocalWork`
  / `build_instruction_plan`. Host `verify_runs` include `pytest: true` and `text_contains` / `text_forbids`
  with repair. Live mode binds `completer_as_tool_loop_complete`; static `coding_writes` are provisional
  until the live suite passes. MCP `MECHA_MCP_HOST=project_coding` drives the same `DurableGraphGenerator`
  graph (no separate suite).'
validation: 'Harness `user_story` scenario `red_green.yaml` inside sequential suite `delegate_pkg` (ordered).
  Live eligibility: `environment.local_work: project_coding`. Do not treat static/cassette green as proof
  until live Completer on the suite host has passed.'
footnotes: []
kind: user_story
environment:
  family: pass_through
  backend: mock
  local_work: project_coding
  filesystem:
    type: suite
    contents: 030_fangore_delegate_red_green.files.json
graph:
  recipe: guided_coding
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: delegate-red_green
      inputs:
        goal: 'Add `Widget.double()` that doubles `value` and returns the new value. Ensure `tests/test_widget.py`
          includes `test_double` that would fail before the method exists, then implement so pytest is
          green. Keep inc and README. Required contracts (non-negotiable): keep package import `from widget
          import …` working. Do NOT use eval() or exec(). You MUST call write_file for every file you
          create or change before finishing. Tests under tests/ must stay green (pytest).'
        max_iterations: 24
        verify_runs:
        - path: widget/__init__.py
          text_contains:
          - def double
          text_forbids:
          - eval(
          - exec(
        - path: tests/test_widget.py
          text_contains:
          - test_double
          - double
          text_forbids:
          - eval(
          - exec(
        - exit_code: 0
          path: tests/test_widget.py
          pytest: true
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: gte
    key: guidance_yields
    value: 1
  - kind: gte
    key: local_steps
    value: 1
- do:
    answer:
      choose: minimal
  expect:
  - key: kind
    kind: equals
    value: completed
  - key: resumes
    kind: gte
    value: 1
  - key: written_files
    kind: includes
    value:
    - widget/__init__.py
    - tests/test_widget.py
- do:
    workspace_read:
      path: widget/__init__.py
  expect:
  - key: exists
    kind: 'true'
  - key: text
    kind: contains
    value: def double
- do:
    workspace_read:
      path: tests/test_widget.py
  expect:
  - key: exists
    kind: 'true'
  - key: text
    kind: contains
    value: test_double
  - key: text
    kind: contains
    value: double
complete:
  expect:
  - kind: includes
    key: event_types
    value:
    - core:graph_yield
    - core:guidance_resume
    - core:graph_start
    - core:graph_end
cleanup: []
