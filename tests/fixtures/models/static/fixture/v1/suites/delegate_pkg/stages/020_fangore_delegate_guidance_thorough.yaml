id: fangore_delegate_guidance_thorough
suite: delegate_pkg
persona: fangore
title: Honor thorough guidance by shipping code and README together
narrative: Fangore continues the shared Widget workspace and answers the external guidance soft point
  with thorough so the delegate must ship the code change and a README in the same burst — proving mid-arc
  human direction changes artifacts, not only labels.
implementation: 'Agentic Recipe catalog id `guided_coding` with `environment.local_work: project_coding`,
  `environment.workspace: suite`, soft point `external_guidance` (choices minimal/thorough), and budget
  soft point `max_iterations`. List stages pass `instruction_mode: list` into `ProjectCodingLocalWork`
  / `build_instruction_plan`. Host `verify_runs` include `pytest: true` and `text_contains` / `text_forbids`
  with repair. Live mode binds `completer_as_tool_loop_complete`; static `coding_writes` are provisional
  until the live suite passes. MCP `MECHA_MCP_HOST=project_coding` drives the same `DurableGraphGenerator`
  graph (no separate suite).'
validation: 'Harness `user_story` scenario `guidance_thorough.yaml` inside sequential suite `delegate_pkg`
  (ordered). Live eligibility: `environment.local_work: project_coding`. Do not treat static/cassette
  green as proof until live Completer on the suite host has passed.'
footnotes: []
kind: user_story
environment:
  family: pass_through
  backend: mock
  local_work: project_coding
  filesystem:
    type: suite
    contents: 020_fangore_delegate_guidance_thorough.files.json
graph:
  recipe: guided_coding
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: delegate-guidance_thorough
      inputs:
        goal: 'Extend `Widget` with `inc(n=1)` that mutates `value` and returns the new value. Extend
          tests for inc. Honor external guidance: when the driver chooses thorough, also write `README.md`
          with a `## Usage` section showing `from widget import Widget`. When minimal, skip the README.
          Required contracts (non-negotiable): keep package import `from widget import …` working. Do
          NOT use eval() or exec(). You MUST call write_file for every file you create or change before
          finishing. Tests under tests/ must stay green (pytest).'
        max_iterations: 24
        verify_runs:
        - path: widget/__init__.py
          text_contains:
          - def inc
          text_forbids:
          - eval(
          - exec(
        - path: tests/test_widget.py
          text_contains:
          - inc
          text_forbids:
          - eval(
          - exec(
        - path: README.md
          text_contains:
          - '## Usage'
          - from widget import Widget
          text_forbids:
          - eval(
          - exec(
        - exit_code: 0
          path: tests/test_widget.py
          pytest: true
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: gte
    key: guidance_yields
    value: 1
  - kind: gte
    key: local_steps
    value: 1
- do:
    answer:
      choose: thorough
  expect:
  - key: kind
    kind: equals
    value: completed
  - key: resumes
    kind: gte
    value: 1
  - key: written_files
    kind: includes
    value:
    - widget/__init__.py
    - tests/test_widget.py
    - README.md
- do:
    workspace_read:
      path: widget/__init__.py
  expect:
  - key: exists
    kind: 'true'
  - key: text
    kind: contains
    value: def inc
- do:
    workspace_read:
      path: tests/test_widget.py
  expect:
  - key: exists
    kind: 'true'
  - key: text
    kind: contains
    value: inc
- do:
    workspace_read:
      path: README.md
  expect:
  - key: exists
    kind: 'true'
  - key: text
    kind: contains
    value: '## Usage'
  - key: text
    kind: contains
    value: from widget import Widget
complete:
  expect:
  - kind: includes
    key: event_types
    value:
    - core:graph_yield
    - core:guidance_resume
    - core:graph_start
    - core:graph_end
cleanup: []
