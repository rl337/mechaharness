id: fangore_delegate_refactor
suite: delegate_pkg
persona: fangore
title: Rename Widget to Gadget without breaking tests
narrative: 'Fangore finishes the delegate arc with a rename refactor: the public type moves from Widget
  to Gadget while pytest and docs stay honest — proving the handoff can reshape APIs without contract
  drift.'
implementation: 'Agentic Recipe catalog id `guided_coding` with `environment.local_work: project_coding`,
  `environment.workspace: suite`, soft point `external_guidance` (choices minimal/thorough), and budget
  soft point `max_iterations`. List stages pass `instruction_mode: list` into `ProjectCodingLocalWork`
  / `build_instruction_plan`. Host `verify_runs` include `pytest: true` and `text_contains` / `text_forbids`
  with repair. Live mode binds `completer_as_tool_loop_complete`; static `coding_writes` are provisional
  until the live suite passes. MCP `MECHA_MCP_HOST=project_coding` drives the same `DurableGraphGenerator`
  graph (no separate suite).'
validation: 'Harness `user_story` scenario `refactor.yaml` inside sequential suite `delegate_pkg` (ordered).
  Live eligibility: `environment.local_work: project_coding`. Do not treat static/cassette green as proof
  until live Completer on the suite host has passed.'
footnotes: []
kind: user_story
environment:
  family: pass_through
  backend: mock
  local_work: project_coding
  filesystem:
    type: suite
    contents: 040_fangore_delegate_refactor.files.json
graph:
  recipe: guided_coding
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: delegate-refactor
      inputs:
        goal: 'Rename the public class `Widget` to `Gadget` everywhere (package, tests, README). Keep
          the package import path `from widget import Gadget`. Keep inc and double behavior. Required
          contracts (non-negotiable): keep package import `from widget import …` working. Do NOT use eval()
          or exec(). You MUST call write_file for every file you create or change before finishing. Tests
          under tests/ must stay green (pytest).'
        instruction_mode: oneshot
        max_iterations: 24
        max_repair_rounds: 4
        verify_runs:
        - path: widget/__init__.py
          text_contains:
          - class Gadget
          - def double
          text_forbids:
          - eval(
          - exec(
          - class Widget
        - path: tests/test_widget.py
          text_contains:
          - Gadget
          - test_double
          text_forbids:
          - eval(
          - exec(
          - Widget
        - path: README.md
          text_contains:
          - Gadget
          - from widget import Gadget
          text_forbids:
          - eval(
          - exec(
        - exit_code: 0
          path: tests/test_widget.py
          pytest: true
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: gte
    key: guidance_yields
    value: 1
  - kind: gte
    key: local_steps
    value: 1
- do:
    answer:
      choose: minimal
  expect:
  - key: kind
    kind: equals
    value: completed
  - key: resumes
    kind: gte
    value: 1
  - key: written_files
    kind: includes
    value:
    - widget/__init__.py
    - tests/test_widget.py
    - README.md
- do:
    workspace_read:
      path: widget/__init__.py
  expect:
  - key: exists
    kind: 'true'
  - key: text
    kind: contains
    value: class Gadget
  - key: text
    kind: contains
    value: def double
- do:
    workspace_read:
      path: tests/test_widget.py
  expect:
  - key: exists
    kind: 'true'
  - key: text
    kind: contains
    value: Gadget
  - key: text
    kind: contains
    value: test_double
- do:
    workspace_read:
      path: README.md
  expect:
  - key: exists
    kind: 'true'
  - key: text
    kind: contains
    value: Gadget
  - key: text
    kind: contains
    value: from widget import Gadget
complete:
  expect:
  - kind: includes
    key: event_types
    value:
    - core:graph_yield
    - core:guidance_resume
    - core:graph_start
    - core:graph_end
cleanup: []
