id: fangore_coding_git_open_pr
suite: fangore_guided_coding
persona: fangore
title: Open a formatted pull request with local git and mocked GitHub
narrative: Fangore asks guided coding to compare the feature branch to main with local git, draft a clear
  pull request summary, and open the PR. GitHub itself stays mocked so CI and live Completer walks do
  not need forge credentials; only the local git history is real. Complements `fangore_coding_git_inspect`
  and `fangore_guided_coding_recipe`.
implementation: 'Agentic Recipe catalog id `guided_coding` with `environment.local_work: project_coding`,
  `coding_git: local_mock_pr` (`RecordingPullRequestCodingGit` over `LocalProcessCodingGit`), and `git_seed:
  feature_branch`. Tools `git_log` / `git_diff` / `create_pull_request` hit injectable `CodingGit`. Production
  PR path is `LocalGitHttpPullRequestCodingGit` + `HttpGitHubClient` / `GitHubConnectionConfig` (HTTP
  token via `ProjectCodingConfig.get_github_client()` — no `gh` required). Stories keep the forge mocked.'
validation: 'Harness `user_story` scenario `open_pr.yaml` in suite `fangore_guided_coding`. Static mode
  uses `coding_tool_script: git_open_pr`. Live Completer may draft title/body but still uses the mock
  PR publisher under `local_mock_pr`. Asserts `.mechaharness/pr_url.txt` contains the mock URL. Unit coverage
  in `tests/test_github_client.py` and `tests/test_coding_git.py`.'
footnotes: []
kind: user_story
environment:
  family: pass_through
  backend: mock
  local_work: project_coding
  coding_git: local_mock_pr
  git_seed: feature_branch
  coding_tool_script: git_open_pr
  filesystem:
    type: temp
graph:
  recipe: guided_coding
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: coding-git-pr-1
      inputs:
        goal: Compare this branch to main with git_log and git_diff (base=main). Draft a PR title and
          markdown body (Summary + Test plan), then call create_pull_request with base=main. Write the
          returned PR URL to .mechaharness/pr_url.txt. Do not call a real GitHub host.
        max_iterations: 16
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: gte
    key: guidance_yields
    value: 1
- do:
    answer:
      choose: thorough
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: gte
    key: resumes
    value: 1
  - kind: includes
    key: written_files
    value:
    - .mechaharness/pr_url.txt
- do:
    workspace_read:
      path: .mechaharness/pr_url.txt
  expect:
  - kind: 'true'
    key: exists
  - kind: contains
    key: text
    value: https://example.test/pull/1
complete:
  expect:
  - kind: includes
    key: event_types
    value:
    - core:graph_yield
    - core:guidance_resume
    - core:graph_start
    - core:graph_end
cleanup: []
