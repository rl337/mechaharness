id: fangore_insp_instruction_gotchas
suite: fangore_guided_coding
persona: fangore
title: Measure gotcha trigger rates before promoting them
narrative: Fangore starts the CLI host with family `pass_through` and backend `mock`. Scarce instruction
  components distinguish invariants from learned gotchas. Over-triggering is measurable, and promotion
  to active policy is explicit. Accepts inspiration requirement 8[^insp-r08].
implementation: '`InstructionCatalog` / `InstructionComponent` track trigger, use, over/under rates; `promote`
  moves proposed gotchas to active after evaluation.'
validation: Harness `user_story` drives product verb(s) with environment `pass_through`/`mock`; hard expects
  on declared observation keys.
footnotes:
- id: insp-r08
  label: 'Inspiration requirements (req 8: skills and gotchas)'
  url: https://github.com/rl337/mechaharness/blob/main/docs/inspiration/dev-blog-inspiration.md
  note: Req 8 — skills and gotchas
kind: user_story
environment:
  family: pass_through
  backend: mock
  filesystem:
    type: temp
steps:
- do:
    instruction_gotcha_metrics:
      title: watch path
      body: do not dump full memory
      over_trigger: true
complete:
  expect:
  - kind: equals
    key: over_trigger_count
    value: 1
  - kind: equals
    key: status_after_promote
    value: active
  - kind: equals
    key: active_gotcha_count
    value: 1
cleanup: []
