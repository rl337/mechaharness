id: fangore_coding_ci_diagnose
suite: fangore_guided_coding
persona: fangore
title: Look up a failed CI check and write a diagnosis note from the job log
narrative: Fangore's pull request checks job fails again. He starts guided coding and asks the local Completer
  to look up check runs for HEAD, download the failing Actions job log, and write a short diagnosis note
  naming the check, job id, and root-cause signals — without editing product source yet. GitHub stays
  mocked in static stories via RecordingGitHubClient so CI and Completer walks do not need forge credentials;
  the production path uses HttpGitHubClient when a token is bound. Complements `fangore_coding_ci_repair`
  (seeded-log repair) and `fangore_coding_git_open_pr`.
implementation: 'Agentic Recipe catalog id `guided_coding` with `environment.local_work: project_coding`
  and `coding_github: local_mock_ci` (`RecordingGitHubClient` + `GitHubConnectionConfig` owner/repo).
  Tools `ci_checks` / `ci_job_log` come from `build_coding_tool_registry(..., github=…)`. Static `coding_tool_script:
  ci_diagnose` calls those tools then writes `.mechaharness/ci_diagnosis.md`. Production binds `HttpGitHubClient`
  via `ProjectCodingConfig.get_github_client()` / `GitHubConnectionConfig` (`MECHA_GITHUB_*` / `GITHUB_TOKEN`).
  Soft point `external_guidance` remains the human scope gate.'
validation: 'Harness `user_story` scenario `diagnose.yaml` in suite `fangore_guided_coding`. Static mode
  uses `coding_tool_script: ci_diagnose` against `coding_github: local_mock_ci`. Asserts `.mechaharness/ci_diagnosis.md`
  cites the failing check, job id, and root-cause markers from the canned log. Live Completer may drive
  the same tools with `MECHA_STORY_BACKEND=live`. Unit coverage in `tests/test_github_client.py` for `RecordingGitHubClient`
  and `job_id_from_details_url`.'
footnotes: []
kind: user_story
environment:
  family: pass_through
  backend: mock
  local_work: project_coding
  coding_github: local_mock_ci
  coding_tool_script: ci_diagnose
  filesystem:
    type: temp
graph:
  recipe: guided_coding
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: coding-ci-diagnose-1
      inputs:
        goal: The latest CI checks job failed. Use ci_checks on HEAD, then ci_job_log for the failing
          job_id from the check summary, and write .mechaharness/ci_diagnosis.md naming the check, job
          id, and root causes from the log. Do not edit product source and do not open a pull request.
          Prefer the bound mock GitHub client over any planted failure log file.
        max_iterations: 16
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: gte
    key: guidance_yields
    value: 1
- do:
    answer:
      choose: thorough
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: gte
    key: resumes
    value: 1
  - kind: includes
    key: written_files
    value:
    - .mechaharness/ci_diagnosis.md
- do:
    workspace_read:
      path: .mechaharness/ci_diagnosis.md
  expect:
  - kind: 'true'
    key: exists
  - kind: contains
    key: text
    value: checks
  - kind: contains
    key: text
    value: '9001'
  - kind: contains
    key: text
    value: Ruff
  - kind: contains
    key: text
    value: I001
  - kind: contains
    key: text
    value: Mypy
  - kind: contains
    key: text
    value: no-untyped-def
complete:
  expect:
  - kind: includes
    key: event_types
    value:
    - core:graph_yield
    - core:guidance_resume
    - core:graph_start
    - core:graph_end
cleanup: []
