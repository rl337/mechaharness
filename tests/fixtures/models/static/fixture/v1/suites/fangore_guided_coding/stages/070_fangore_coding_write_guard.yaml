id: fangore_coding_write_guard
suite: fangore_guided_coding
persona: fangore
title: Refuse catastrophic gutting of an existing workspace module
narrative: Fangore starts guided coding on a workspace that already has a substantial module. A careless
  Completer tries to replace that module with a tiny broken stub. The coding tools refuse the write, the
  original module stays intact, and he records a short note that the gutting attempt was blocked. Complements
  `fangore_coding_ci_repair`.
implementation: 'Agentic Recipe catalog id `guided_coding` with `environment.local_work: project_coding`
  and `ci_seed`-style workspace seed `write_guard_seed: healthy_module`. ``write_file`` in `build_coding_tool_registry`
  applies `CodingWriteGuard` (min retain ratio, Python parse, retain some top-level defs). Static `coding_tool_script:
  write_gutting_attempt` issues the bad write then notes the refusal. `verify_runs` may also use `min_bytes`
  / `python_parses`.'
validation: Harness `user_story` scenario `refuse_gutting.yaml` in suite `fangore_guided_coding`. Asserts
  the seeded module still contains its public defs and `.mechaharness/write_guard_note.md` mentions refused/gutting.
  Unit coverage in `tests/test_coding_write_guard.py`.
footnotes: []
kind: user_story
environment:
  family: pass_through
  backend: mock
  local_work: project_coding
  write_guard_seed: healthy_module
  coding_tool_script: write_gutting_attempt
  filesystem:
    type: temp
graph:
  recipe: guided_coding
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: coding-write-guard-1
      inputs:
        goal: Regression for CodingWriteGuard. Read healthy_module.py, then attempt to REPLACE it with
          a tiny stub that only defines build_coding_tool_registry as an empty dict factory (intentionally
          gutting). Expect write_file to refuse. Then write exactly .mechaharness/write_guard_note.md
          stating that gutting was blocked. healthy_module.py must still contain class WorkspacePaths,
          def build_coding_tool_registry, and def helper.
        max_iterations: 20
  expect:
  - kind: equals
    key: kind
    value: advice_requested
- do:
    answer:
      choose: thorough
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: gte
    key: resumes
    value: 1
- do:
    workspace_read:
      path: healthy_module.py
  expect:
  - kind: 'true'
    key: exists
  - kind: contains
    key: text
    value: def build_coding_tool_registry
  - kind: contains
    key: text
    value: class WorkspacePaths
  - kind: contains
    key: text
    value: def helper
- do:
    workspace_read:
      path: .mechaharness/write_guard_note.md
  expect:
  - kind: 'true'
    key: exists
  - kind: contains
    key: text
    value: blocked
complete:
  expect:
  - kind: includes
    key: event_types
    value:
    - core:graph_yield
    - core:guidance_resume
    - core:graph_start
    - core:graph_end
cleanup: []
