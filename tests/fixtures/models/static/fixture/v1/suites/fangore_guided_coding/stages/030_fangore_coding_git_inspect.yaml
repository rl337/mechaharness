id: fangore_coding_git_inspect
suite: fangore_guided_coding
persona: fangore
title: Inspect a feature branch against main with local git tools
narrative: Fangore hands guided coding a workspace that already has a feature branch ahead of main. He
  wants the local agent to inspect status, commit history, and the diff against main using the machine's
  git, then leave a short inspect note on disk. Complements `fangore_guided_coding_recipe` and `fangore_coding_git_open_pr`.
implementation: 'Agentic Recipe catalog id `guided_coding` with `environment.local_work: project_coding`.
  Story harness seeds a feature-branch git repo and binds `RecordingPullRequestCodingGit` wrapping `LocalProcessCodingGit`
  (`environment.coding_git: local_mock_pr`) so status/log/diff use real local `git` while forge calls
  stay mockable. Tools `git_status` / `git_log` / `git_diff` come from `build_coding_tool_registry(...,
  coding_git=…)`. Hosts override via `ProjectCodingConfig.get_coding_git()`.'
validation: 'Harness `user_story` scenario `inspect.yaml` in suite `fangore_guided_coding`. Static mode
  uses `coding_tool_script: git_inspect` (scripted tool calls against local git). Live mode uses a real
  Completer with the same `local_mock_pr` binding. Unit tests `tests/test_project_coding.py` cover injectable
  `CodingGit` fakes and local process git.'
footnotes: []
kind: user_story
environment:
  family: pass_through
  backend: mock
  local_work: project_coding
  coding_git: local_mock_pr
  git_seed: feature_branch
  coding_tool_script: git_inspect
  filesystem:
    type: temp
graph:
  recipe: guided_coding
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: coding-git-inspect-1
      inputs:
        goal: 'Inspect this workspace git repo vs main: call git_status, git_log (base=main), and git_diff
          (base=main, stat_only). Write .mechaharness/git_inspect.md summarizing that the feature branch
          added helper.py. Do not open a pull request.'
        max_iterations: 16
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: gte
    key: guidance_yields
    value: 1
- do:
    answer:
      choose: minimal
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: gte
    key: resumes
    value: 1
  - kind: includes
    key: written_files
    value:
    - .mechaharness/git_inspect.md
- do:
    workspace_read:
      path: .mechaharness/git_inspect.md
  expect:
  - kind: 'true'
    key: exists
  - kind: contains
    key: text
    value: helper.py
  - kind: contains
    key: text
    value: feature
- do:
    workspace_read:
      path: helper.py
  expect:
  - kind: 'true'
    key: exists
  - kind: contains
    key: text
    value: def answer
complete:
  expect:
  - kind: includes
    key: event_types
    value:
    - core:graph_yield
    - core:guidance_resume
    - core:graph_start
    - core:graph_end
cleanup: []
