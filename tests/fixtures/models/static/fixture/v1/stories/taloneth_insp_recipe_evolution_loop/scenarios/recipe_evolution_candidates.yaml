# Plan document: ../plans/evolution_candidates.yaml
kind: cli
commands:
- recipe_plan:
    path: plans/evolution_candidates.yaml
expect:
- kind: equals
  key: candidate_bindings
  value:
  - max_rounds: 3
  - critique_prompt: be strict about unsupported claims
- kind: equals
  key: rejected
  value:
  - - refine_kind
    - soft_point_not_evolvable:refine_kind
  - - reviewer_count
    - soft_point_not_allowlisted:reviewer_count
  - - x
    - unknown_recipe:ghost_recipe
- kind: 'true'
  key: deterministic
- kind: 'false'
  key: graphs_synthesized
- kind: equals
  key: selected_bindings
  value:
    critique_prompt: be strict about unsupported claims
- kind: equals
  key: selected_over_baseline
  value: null
