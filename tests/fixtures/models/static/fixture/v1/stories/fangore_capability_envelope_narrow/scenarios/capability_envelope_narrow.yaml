kind: cli
commands:
- probe:
    name: capability_envelope_narrow
    parent_grants:
    - core:graph.execute
    - core:fs.read
    child_grants:
    - core:graph.execute
    widen_grants:
    - core:graph.execute
    - core:fs.write
expect:
- kind: 'true'
  key: narrow_ok
- kind: equals
  key: child_grant_count
  value: 1
- kind: 'true'
  key: widen_raises
- kind: equals
  key: delegation_choice
  value: child
