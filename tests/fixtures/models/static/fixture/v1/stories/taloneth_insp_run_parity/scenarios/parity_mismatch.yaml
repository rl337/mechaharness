# user story: taloneth_insp_run_parity
# Taloneth starts the CLI host with family `pass_through` and backend `mock`.
# Taloneth needs comparable runs to record and flag mismatches in output caps, tool
# budgets, timeouts, and sampling so train and eval behavior stay aligned.
# Accepts FineEnvs train/eval parity findings.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph: null
steps:
- do:
    compare_run_parity:
      a:
        model: m
        max_tokens: 1024
        temperature: 0.0
        max_turns: 4
        tools:
        - Read
      b:
        model: m
        max_tokens: 512
        temperature: 0.0
        max_turns: 4
        tools:
        - Read
complete:
  expect:
  - kind: 'false'
    key: comparable
  - kind: equals
    key: material_mismatches_exactly
    value:
    - max_tokens
    - sampling
cleanup: []
