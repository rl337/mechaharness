# user story: fangore_harness_family_react
# Fangore starts the CLI host with family `react` and backend `mock`.
# Fangore switches the host to the classic ReAct family so models without reliable native
# tool calls still loop Thought/Action/Observation.
# He starts from the same CLI tool-loop verb, with family=react bound at harness
# initialization, and expects a final answer after one scripted tool round.
kind: user_story
environment:
  family: react
  backend: mock
graph: null
steps:
- do:
    tool_loop:
      prompt: find it
      tool_name: lookup
      family: react
      max_turns: 4
complete:
  expect:
  - kind: equals
    key: text
    value: done
  - kind: equals
    key: status
    value: ok
  - kind: includes
    key: event_types
    value:
    - core:inference
    - core:tool_call
    - core:cost
  - kind: positive
    key: total_tokens
  - kind: lte
    key: total_tokens
    value: 8
  - kind: lte
    key: cost_units
    value: 4
cleanup: []
