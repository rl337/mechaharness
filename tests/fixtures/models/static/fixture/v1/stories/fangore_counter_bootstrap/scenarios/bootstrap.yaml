# user story: fangore_counter_bootstrap
# Sequential counter_pkg stage — multi-file package + pytest contracts.
# Static: coding_writes stubs. Live: Completer ignores stubs.
kind: user_story
environment:
  family: pass_through
  backend: mock
  local_work: project_coding
  workspace: suite
  coding_writes:
  - path: "counter/__init__.py"
    content: |
      """Tiny Counter library — bootstrap."""

      from __future__ import annotations


      class Counter:
          def __init__(self, value: int = 0) -> None:
              self.value = int(value)
  - path: "tests/test_counter.py"
    content: |
      from counter import Counter


      def test_starts_at_zero() -> None:
          assert Counter().value == 0
graph:
  recipe: guided_coding
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: counter-bootstrap
      inputs:
        goal: "Create a Python package `counter/` with `__init__.py` exporting `Counter` (start value 0, attribute `value`). Add `tests/test_counter.py` with a test that constructs Counter and asserts value == 0. Required contracts (non-negotiable): keep package import `from counter import Counter` working; public class must be named `Counter`. Do NOT use eval() or exec(). You MUST call write_file for every file you create or change before finishing. Tests under tests/ must stay green (pytest)."
        max_iterations: 24
        verify_runs:
        - path: counter/__init__.py
          text_contains:
          - class Counter
          - value
          text_forbids:
          - eval(
          - exec(
        - path: tests/test_counter.py
          text_contains:
          - Counter
          - def test_
          text_forbids:
          - eval(
          - exec(
        - exit_code: 0
          path: tests/test_counter.py
          pytest: true
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: gte
    key: guidance_yields
    value: 1
  - kind: gte
    key: local_steps
    value: 1
- do:
    answer:
      choose: minimal
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: gte
    key: resumes
    value: 1
  - kind: includes
    key: written_files
    value:
    - counter/__init__.py
    - tests/test_counter.py
- do:
    workspace_read:
      path: counter/__init__.py
  expect:
  - key: exists
    kind: 'true'
  - key: text
    kind: contains
    value: class Counter
  - key: text
    kind: contains
    value: value
- do:
    workspace_read:
      path: tests/test_counter.py
  expect:
  - key: exists
    kind: 'true'
  - key: text
    kind: contains
    value: Counter
  - key: text
    kind: contains
    value: def test_
complete:
  expect:
  - kind: includes
    key: event_types
    value:
    - core:graph_yield
    - core:guidance_resume
    - core:graph_start
    - core:graph_end
cleanup: []
