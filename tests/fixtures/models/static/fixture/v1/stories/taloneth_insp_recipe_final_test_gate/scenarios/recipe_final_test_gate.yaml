# user story: taloneth_insp_recipe_final_test_gate
# Taloneth starts the CLI host with family `pass_through` and backend `mock`.
# A leading candidate must pass a separate untouched final test before it can be
# released, and that test must not be used as a tuning signal.
# Promotion is refused when no final-test result is supplied, when the result did not
# come from a held-out evaluator, or when it failed; only a passing held-out result opens
# the gate.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph: null
steps:
- do:
    recipe_plan:
      path: plans/final_test_gate.yaml
complete:
  expect:
  - kind: equals
    key: lab
    value:
      missing: refused
      not_held_out: refused
      held_out_failed: refused
      held_out_passed: promoted
  - kind: equals
    key: registry
    value:
      missing: refused
      not_held_out: refused
      held_out_failed: refused
      held_out_passed: promoted
  - kind: equals
    key: registry_pointer_after_refusals
    value: '1'
  - kind: 'true'
    key: unprotected_protocol_promotes
cleanup: []
