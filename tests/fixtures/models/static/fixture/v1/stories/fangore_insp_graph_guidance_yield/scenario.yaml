# Soft-point guidance then answer to completion
kind: durable_generator
graph: verify_repair
controller: story
store: memory

steps:
  - start:
      run_id: folk-guidance
      inputs:
        guidance:
          - question: How should exhaustion affect the sword maneuver?
            choices:
              - id: slow
                label: Slower
              - id: precise
                label: Precise
            recommendation: precise
            requested_authority: artistic_direction
    expect:
      kind: advice_requested
      question: How should exhaustion affect the sword maneuver?

  - answer:
      choose: precise
    expect:
      kind: completed
      pending_cleared: true
      resumes: 1
