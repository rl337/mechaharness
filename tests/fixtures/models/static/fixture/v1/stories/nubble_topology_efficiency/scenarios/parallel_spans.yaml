# user story: nubble_topology_efficiency
kind: user_story
environment:
  family: pass_through
  backend: mock
steps:
- do:
    topology_efficiency:
      graph_version: story-topo-v1
      worker_count: 2
      spans:
      - name: a
        start_ms: 0
        end_ms: 10
      - name: b
        start_ms: 0
        end_ms: 10
      - name: c
        start_ms: 10
        end_ms: 15
        parent: a
complete:
  expect:
  - kind: equals
    key: total_node_work_ms
    value: 25.0
  - kind: equals
    key: elapsed_ms
    value: 15.0
  - kind: 'true'
    key: work_exceeds_elapsed
  - kind: equals
    key: notes_exactly
    value:
    - worker_count=2
    - parallel_efficiency_not_comparable_without_serial_baseline
cleanup: []
