# Parallel spans: total work exceeds wall elapsed
kind: cli

commands:
  - topology_efficiency:
      graph_version: story-topo-v1
      worker_count: 2
      spans:
        - name: a
          start_ms: 0
          end_ms: 10
        - name: b
          start_ms: 0
          end_ms: 10
        - name: c
          start_ms: 10
          end_ms: 15
          parent: a

expect:
  total_node_work_ms: 25.0
  elapsed_ms: 15.0
  work_exceeds_elapsed: true
  notes_exactly:
    - worker_count=2
    - parallel_efficiency_not_comparable_without_serial_baseline
