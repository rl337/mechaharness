kind: cli
commands:
- probe:
    name: objective_policy_aggregate
    policy:
      policy_id: demo:lexi
      version: '1'
      component_signals:
      - correct
      - tokens
      formula: lexicographic
      gates:
      - correct
      lexicographic:
      - correct
      - tokens
    claims:
    - id: correct
      statement: ok
      status: pass
    - id: tokens
      statement: budget
      status: pass
expect:
- kind: 'true'
  key: scored
- kind: equals
  key: scalar
  value: 1.0
- kind: equals
  key: policy_id
  value: demo:lexi
