# Probe plan for scenario `tool_gating.yaml`.
# Story: Enforce grants mechanically instead of by prompt alone

summary: Enforce grants mechanically instead of by prompt alone
name: tool_gating
prompt: Write a.txt
deny_grants: []
allow_grants:
- core:fs.write
tool_calls:
- id: '1'
  name: write_file
  arguments:
    path: a.txt
