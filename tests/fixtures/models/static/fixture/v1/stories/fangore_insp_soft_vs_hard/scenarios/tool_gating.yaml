# user story: fangore_insp_soft_vs_hard
# Migrated from probe plan `tool_gating.yaml` → product/test verb `tool_gating`.
kind: user_story
environment:
  family: pass_through
  backend: mock
steps:
- do:
    tool_gating:
      prompt: Write a.txt
      deny_grants: []
      allow_grants:
      - core:fs.write
      tool_calls:
      - id: '1'
        name: write_file
        arguments:
          path: a.txt
  expect: &id001
  - kind: 'true'
    key: denied_without_grant
  - kind: 'true'
    key: allowed_with_grant
complete:
  expect: *id001
cleanup: []
