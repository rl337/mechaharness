kind: cli
commands:
- probe:
    name: tool_gating
    prompt: Write a.txt
    deny_grants: []
    allow_grants:
    - core:fs.write
    tool_calls:
    - id: '1'
      name: write_file
      arguments:
        path: a.txt
expect:
- kind: 'true'
  key: denied_without_grant
- kind: 'true'
  key: allowed_with_grant
