kind: cli
commands:
- probe:
    name: local_plan_resume
    goal: ship patch
    state_revision: r1
    evidence_refs:
    - obs:1
    satisfied: []
    fan_in_budget: 4
    branches:
    - path: app.py
      content: a
      status: ok
    - path: app.py
      content: b
      status: ok
expect:
- kind: equals
  key: stale_preconditions_exactly
  value:
  - approved
- kind: equals
  key: ready_exactly
  value:
  - consume
- kind: 'true'
  key: dependency_justified
- kind: equals
  key: fan_in_failures_exactly
  value:
  - bad
- kind: equals
  key: merge_conflicts_exactly
  value:
  - app.py
- kind: equals
  key: recovery_boundary
  value: dispatch
