# Local plan checkpoint, fan-in, and merge conflicts
kind: cli

commands:
  - local_plan_resume:
      goal: ship patch
      state_revision: r1
      evidence_refs: [obs:1]
      satisfied: []
      fan_in_budget: 4
      branches:
        - path: app.py
          content: a
          status: ok
        - path: app.py
          content: b
          status: ok

expect:
  stale_preconditions_exactly: [approved]
  ready_exactly: [consume]
  dependency_justified: true
  fan_in_failures_exactly: [bad]
  merge_conflicts_exactly: [app.py]
  recovery_boundary: dispatch
