# user story: fangore_local_plan_resume
# Fangore starts the CLI host with family `pass_through` and backend `mock`.
# He runs `local_plan_resume`: a require_file node fails when the VFS path is
# missing; the verb seeds MemoryFilesystem, keeps `run_id` on walk-bag `ctx`,
# re-arms the failed node, and resumes the same checkpointed plan successfully.
kind: user_story
environment:
  family: pass_through
  backend: mock
steps:
- do:
    local_plan_resume:
      run_id: story-local-plan
      required_path: /work/input.txt
      seed_content: plan-payload
      goal: consume required input file
  expect:
  - kind: equals
    key: first_status
    value: failed
  - kind: equals
    key: first_error
    value: 'missing_file:/work/input.txt'
  - kind: equals
    key: resume_status
    value: ok
  - kind: equals
    key: file_content
    value: plan-payload
  - kind: equals
    key: run_id
    value: story-local-plan
  - kind: equals
    key: recovery_boundary
    value: commit
complete:
  expect:
  - kind: equals
    key: first_status
    value: failed
  - kind: equals
    key: resume_status
    value: ok
  - kind: equals
    key: file_content
    value: plan-payload
  - kind: equals
    key: run_id
    value: story-local-plan
cleanup: []
