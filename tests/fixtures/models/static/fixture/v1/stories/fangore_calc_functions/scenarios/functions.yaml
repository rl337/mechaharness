        goal: "Update calc.py with call syntax fn(args) for sqrt, abs, sin, cos, tan (radians), ln, log (base 10), min, max. Examples: sqrt(9)\u21923, abs(-2)+1\u21923, min(3,1,2)\u21921, sin(0)\u21920. Keep operators and grouping. Required API shape (non-negotiable): define both `def evaluate(expr)` and `def main(argv=None) -> int` by those exact names (main must not be only an inline `if __name__ == '__main__'` block). main reads sys.argv[1], prints the result, exits 0 on success / 1 on error / 2 on bad usage. Implement a real expression parser \u2014 do NOT use eval(), exec(), or ast.literal_eval on the user expression. You MUST call write_file with the full calc.py contents before finishing."
