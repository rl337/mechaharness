# user story: fangore_insp_alert_escalation_rules
# Fangore starts the CLI host with family `pass_through` and backend `mock`.
# He runs `alert_escalation`: occurrence counts map to log → surface → propose
# with per-alert overrides; unordered thresholds are refused. No model in loop.
kind: user_story
environment:
  family: pass_through
  backend: mock
steps:
- do:
    alert_escalation:
      policy:
        repeated_at: 2
        persistent_at: 4
        overrides:
          disk_full:
          - 1
          - 2
      alert: queue_lag
      counts:
      - 1
      - 2
      - 3
      - 4
      - 6
      override_alert: disk_full
      override_counts:
      - 1
      - 2
      unordered_policy:
        repeated_at: 3
        persistent_at: 3
  expect:
  - kind: equals
    key: ladder
    value:
    - log
    - surface
    - surface
    - propose
    - propose
  - kind: equals
    key: override_ladder
    value:
    - surface
    - propose
  - kind: equals
    key: counter_walk
    value:
    - log
    - surface
    - surface
    - propose
    - propose
  - kind: 'true'
    key: unordered_refused
complete:
  expect:
  - kind: 'true'
    key: unordered_refused
  - kind: equals
    key: ladder
    value:
    - log
    - surface
    - surface
    - propose
    - propose
cleanup: []
