kind: cli
commands:
- probe:
    name: alert_escalation_stages
    policy:
      repeated_at: 2
      persistent_at: 4
      overrides:
        disk_full:
        - 1
        - 2
    alert: queue_lag
    counts:
    - 1
    - 2
    - 3
    - 4
    - 6
    override_alert: disk_full
    override_counts:
    - 1
    - 2
    unordered_policy:
      repeated_at: 3
      persistent_at: 3
expect:
- kind: equals
  key: ladder
  value:
  - log
  - surface
  - surface
  - propose
  - propose
- kind: equals
  key: override_ladder
  value:
  - surface
  - propose
- kind: equals
  key: counter_walk
  value:
  - log
  - surface
  - surface
  - propose
  - propose
- kind: 'true'
  key: unordered_refused
