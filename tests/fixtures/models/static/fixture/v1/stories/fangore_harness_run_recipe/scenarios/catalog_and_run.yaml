kind: cli
commands:
- run_recipe:
    name: harness_run
    prompt: say hello
    backend: mock
    family: pass_through
expect:
- kind: 'true'
  key: recipe_in_catalog
- kind: equals
  key: status
  value: ok
- kind: nonempty
  key: text
- kind: equals
  key: turns
  value: 1
- kind: includes
  key: event_types
  value:
  - core:inference
  - core:cost
- kind: equals
  key: total_tokens
  value: 2
- kind: lte
  key: total_tokens
  value: 2
- kind: exactly
  key: subgraph_node_ids
  value:
  - prepare
  - harness_loop
  - render
- kind: lte
  key: cost_units
  value: 1
