kind: cli
commands:
- run_recipe:
    name: harness_run
    prompt: say hello
    backend: mock
    family: pass_through
expect:
- kind: 'true'
  key: recipe_in_catalog
- kind: equals
  key: status
  value: ok
- kind: nonempty
  key: text
- kind: equals
  key: turns
  value: 1
- kind: exactly
  key: subgraph_node_ids
  value:
  - prepare
  - harness_loop
  - render
