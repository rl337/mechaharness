# user story: fangore_job_lane_handoff_oneshot
kind: user_story
environment:
  family: pass_through
  backend: mock
  job_lanes:
    assets.generate:
      meta: {mode: deny_all}
      keys:
        memo:1: {mode: deny_all}
        memo:2: {mode: deny_all}
    billing.settle:
      meta: {mode: open}
      keys: {}
steps:
- do:
    lane_publish:
      keys:
        memo:1: shared-secret
        memo:2: private
  lane: assets.generate
  run_id: gen-1
- do:
    lane_handoff:
      from_lane: assets.generate
      to_lane: billing.settle
      evidence_refs:
      - memo:1
  expect:
  - kind: equals
    key: status
    value: ok
- do:
    lane_observe:
      target_lane: assets.generate
      selector: {latest: true}
      key: memo:1
  lane: billing.settle
  expect:
  - kind: equals
    key: status
    value: ok
  - kind: equals
    key: value
    value: shared-secret
- do:
    lane_observe:
      target_lane: assets.generate
      selector: {latest: true}
      key: memo:2
  lane: billing.settle
  expect:
  - kind: equals
    key: status
    value: denied
- do:
    lane_handoff:
      from_lane: assets.generate
      to_lane: billing.settle
      evidence_refs:
      - memo:ghost
  expect:
  - kind: equals
    key: status
    value: denied
  - kind: equals
    key: error
    value: "lane 'assets.generate' cannot hand off unreadable 'memo:ghost'"
complete:
  expect:
  - kind: equals
    key: status
    value: denied
cleanup: []
