# user story: fangore_jev_action_safety
# Fangore starts the CLI host, runs decision_case for plan
# `plans/delete_low_risk_no_grant.yaml` (action_safety), and verifies completion.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph: null
steps:
- do:
    decision_case:
      path: plans/delete_low_risk_no_grant.yaml
complete:
  expect:
  - kind: equals
    key: decision
    value: deny
  - kind: 'true'
    key: hard_won
  - kind: 'true'
    key: grants_unchanged
cleanup: []
