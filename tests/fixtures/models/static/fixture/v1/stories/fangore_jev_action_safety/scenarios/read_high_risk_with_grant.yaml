# user story: fangore_jev_action_safety
# Hard grants win over semantic risk (read_high_risk_with_grant).
kind: user_story
environment:
  family: pass_through
  backend: mock
graph: null
steps:
- do:
    judge:
      state: 'HIGH RISK: bulk download of all customer PII including SSN, DOB, and full medical history for offsite use'
      questions:
      - id: semantic_risk
        kind: choice
        instructions: Classify semantic risk of the proposed action.
        options:
        - id: low
          description: low
        - id: medium
          description: medium
        - id: high
          description: high
        allowed_actions:
        - low
        - medium
        - high
      action_question_id: semantic_risk
      risk_question_id: semantic_risk
      confidence_floor: 0.7
      grants:
      - core:fs.read
      required_abilities: []
complete:
  expect:
  - kind: equals
    key: decision
    value: escalate_review
  - kind: 'false'
    key: hard_won
  - kind: 'true'
    key: grants_unchanged
cleanup: []
