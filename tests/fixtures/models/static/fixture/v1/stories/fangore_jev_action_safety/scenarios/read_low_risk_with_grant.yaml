kind: cli
commands:
- probe:
    name: action_safety_case
    questions:
    - id: semantic_risk
      kind: choice
      options:
      - id: low
        label: Low
      - id: medium
        label: Medium
      - id: high
        label: High
      allowed_actions:
      - low
      - medium
      - high
    action_question_id: semantic_risk
    answers:
      semantic_risk: low
    confidence: 0.9
    confidence_floor: 0.7
    grants:
    - core:fs.read
    required_grants: []
expect:
- kind: equals
  key: decision
  value: allow
- kind: 'true'
  key: grants_unchanged
