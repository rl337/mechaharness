# user story: fangore_coding_ci_repair
# Seeded CI failure log + broken module; repair and write fix note.
# Static: coding_tool_script. Live: Completer + same workspace seed.
kind: user_story
environment:
  family: pass_through
  backend: mock
  local_work: project_coding
  workspace: temp
  ci_seed: failing_check
  coding_tool_script: ci_repair
graph:
  recipe: guided_coding
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: coding-ci-repair-1
      inputs:
        goal: >-
          A CI checks job failed. Read .mechaharness/ci_failure.log, fix the
          broken source it names so local verify would pass, and write
          .mechaharness/ci_fix.md naming the failing check step and the file
          you changed. Do not open a pull request and do not call a real
          GitHub Actions host.
        max_iterations: 16
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: gte
    key: guidance_yields
    value: 1
- do:
    answer:
      choose: thorough
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: gte
    key: resumes
    value: 1
  - kind: includes
    key: written_files
    value:
    - .mechaharness/ci_fix.md
    - widget.py
- do:
    workspace_read:
      path: widget.py
  expect:
  - kind: 'true'
    key: exists
  - kind: contains
    key: text
    value: def answer
  - kind: contains
    key: text
    value: return 42
- do:
    workspace_read:
      path: .mechaharness/ci_fix.md
  expect:
  - kind: 'true'
    key: exists
  - kind: contains
    key: text
    value: Run checks
  - kind: contains
    key: text
    value: widget.py
complete:
  expect:
  - kind: includes
    key: event_types
    value:
    - core:graph_yield
    - core:guidance_resume
    - core:graph_start
    - core:graph_end
cleanup: []
