# user story: fangore_coding_git_inspect
# Seeded feature branch; local git inspect; GitHub unused.
# Static: coding_tool_script. Live: Completer + same CodingGit binding.
kind: user_story
environment:
  family: pass_through
  backend: mock
  local_work: project_coding
  workspace: temp
  coding_git: local_mock_pr
  git_seed: feature_branch
  coding_tool_script: git_inspect
graph:
  recipe: guided_coding
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: coding-git-inspect-1
      inputs:
        goal: >-
          Inspect this workspace git repo vs main: call git_status, git_log
          (base=main), and git_diff (base=main, stat_only). Write
          .mechaharness/git_inspect.md summarizing that the feature branch
          added helper.py. Do not open a pull request.
        max_iterations: 16
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: gte
    key: guidance_yields
    value: 1
- do:
    answer:
      choose: minimal
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: gte
    key: resumes
    value: 1
  - kind: includes
    key: written_files
    value:
    - .mechaharness/git_inspect.md
- do:
    workspace_read:
      path: .mechaharness/git_inspect.md
  expect:
  - kind: 'true'
    key: exists
  - kind: contains
    key: text
    value: helper.py
  - kind: contains
    key: text
    value: feature
- do:
    workspace_read:
      path: helper.py
  expect:
  - kind: 'true'
    key: exists
  - kind: contains
    key: text
    value: def answer
complete:
  expect:
  - kind: includes
    key: event_types
    value:
    - core:graph_yield
    - core:guidance_resume
    - core:graph_start
    - core:graph_end
cleanup: []
