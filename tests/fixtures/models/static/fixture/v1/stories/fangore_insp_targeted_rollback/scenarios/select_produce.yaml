kind: cli
commands:
- probe:
    name: targeted_rollback_select
    error: verification_failed
    node_id: verify
    repair_target: produce
    transitions:
    - from_node: verify
      kind: rollback
      to_node: produce
      reason: verification_failed
expect:
- kind: equals
  key: rollback_target
  value: produce
- kind: equals
  key: repair_target
  value: produce
