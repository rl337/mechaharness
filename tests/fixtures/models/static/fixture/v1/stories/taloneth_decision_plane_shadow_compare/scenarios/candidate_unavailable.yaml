# user story: taloneth_decision_plane_shadow_compare
kind: user_story
environment:
  family: pass_through
  backend: mock
steps:
- do:
    decision_plane_shadow_compare:
      questions:
      - id: team
        kind: choice
        options:
        - id: billing
          label: Billing
        - id: technical
          label: Technical
        allowed_actions:
        - billing
        - technical
      production_answers:
        team: billing
      shadow_answers: null
      confidence: 0.9
      confidence_floor: 0.7
      with_telemetry: false
complete:
  expect:
  - kind: 'true'
    key: shadow_unavailable
cleanup: []
