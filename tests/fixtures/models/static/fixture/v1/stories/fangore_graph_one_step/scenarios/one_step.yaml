# user story: fangore_graph_one_step
kind: user_story
environment:
  family: pass_through
  backend: mock
graph:
  inline:
    goal: linear
    nodes:
    - id: a
      kind: compute
    - id: b
      kind: compute
      depends_on: [a]
    - id: c
      kind: compute
      depends_on: [b]
steps:
- do:
    graph_walk:
      action: start
  expect:
  - kind: equals
    key: status
    value: paused
  - kind: equals
    key: effect_calls
    value: 1
  - kind: equals
    key: node_statuses
    value:
      a: succeeded
      b: ready
      c: blocked
- do:
    graph_walk:
      action: step
  expect:
  - kind: equals
    key: status
    value: paused
  - kind: equals
    key: effect_calls
    value: 2
- do:
    graph_walk:
      action: step
  expect:
  - kind: equals
    key: status
    value: ok
  - kind: equals
    key: effect_calls
    value: 3
  - kind: equals
    key: node_statuses
    value:
      a: succeeded
      b: succeeded
      c: succeeded
complete:
  expect:
  - kind: equals
    key: status
    value: ok
cleanup: []
