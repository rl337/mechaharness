# user story: fangore_jev_req_review_template_shape
kind: user_story
environment:
  family: pass_through
  backend: mock
graph:
  recipe: independent_review
  bind: binds/independent_review.yaml
steps:
- do:
    run_recipe:
      name: independent_review
      path: binds/independent_review.yaml
complete:
  expect:
  - kind: equals
    key: template_name
    value: independent_review
  - kind: 'true'
    key: omit_producer_reasoning
  - kind: equals
    key: review_count
    value: 2
  - kind: lte
    key: budget_spent
    value: 10
  - kind: lte
    key: cost_units
    value: 10
cleanup: []
