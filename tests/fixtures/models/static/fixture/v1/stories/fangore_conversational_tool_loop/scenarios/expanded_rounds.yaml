kind: cli
commands:
- run_recipe:
    name: conversational_tool_loop
    max_iterations: 4
    tool_name: lookup
expect:
- kind: equals
  key: status
  value: ok
- kind: equals
  key: rounds
  value: 2
- kind: includes
  key: event_types
  value:
  - core:inference
- kind: equals
  key: total_tokens
  value: 4
- kind: lte
  key: total_tokens
  value: 4
- kind: exactly
  key: subgraph_node_ids
  value:
  - round_0/inference
  - round_0/tool_call:lookup:0
  - round_1/inference
