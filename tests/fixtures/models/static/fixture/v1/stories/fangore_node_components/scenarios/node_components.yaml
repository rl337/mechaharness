# user story: fangore_node_components
# Fangore starts the CLI host with family `pass_through` and backend `mock`, and works
# with the `conversational_tool_loop` recipe.
# Before a run starts, Fangore’s console must place interior pieces inside each plan step
# — soft bindings, stop bounds, and nested child handles — so the camera can zoom into a
# node without inventing a parallel structure graph.
# Those pieces are node components of a parent graph node, not free-floating world nodes.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph:
  recipe: conversational_tool_loop
steps:
- do:
    instantiate_recipe:
      path: binds/conversational_tool_loop.yaml
complete:
  expect:
  - kind: 'true'
    key: all_have_parent
  - kind: 'true'
    key: kinds_subset_catalog
  - kind: 'true'
    key: has_stop_contract
  - kind: 'true'
    key: has_soft_point
cleanup: []
