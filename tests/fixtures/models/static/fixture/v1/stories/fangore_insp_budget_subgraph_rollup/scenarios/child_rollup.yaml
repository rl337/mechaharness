# user story: fangore_insp_budget_subgraph_rollup
kind: user_story
environment:
  family: pass_through
  backend: mock
  budget:
    soft_limit: 2
    hard_limit: null
steps:
- do:
    run_budgeted_graph:
      nest: true
      node_cost: 1
complete:
  expect:
  - kind: equals
    key: status
    value: soft_exhausted
  - kind: equals
    key: budget_spent
    value: 2.0
  - kind: equals
    key: budget_level
    value: soft
  - kind: equals
    key: error
    value: soft_budget_exceeded
  - kind: equals
    key: after_status
    value: cancelled
  - kind: lte
    key: cost_units
    value: 2
cleanup: []
