# Child subgraph spend rolls into parent soft budget
kind: cli

commands:
  - graph_budget_subgraph_rollup:
      soft_limit: 2
      hard_limit: null
      node_cost: 1

expect:
  status: soft_exhausted
  budget_spent: 2.0
  budget_level: soft
  error: soft_budget_exceeded
  after_status: cancelled
