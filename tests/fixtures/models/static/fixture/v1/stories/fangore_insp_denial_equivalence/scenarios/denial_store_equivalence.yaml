kind: cli
commands:
- probe:
    name: denial_store_equivalence
    denied:
      effect_class: email.send
      target: bob@example.com
      tool_name: smtp.send
    retries:
    - id: second_provider
      effect_class: email.send
      target: bob@example.com
      tool_name: sendgrid.send
    - id: graph_tool
      effect_class: email.send
      target: bob@example.com
      tool_name: graph.send
    - id: other_recipient
      effect_class: email.send
      target: amy@example.com
      tool_name: smtp.send
expect:
- kind: equals
  key: first
  value: deny:verdict_deny
- kind: equals
  key: retries
  value:
    second_provider: deny:prior_denial
    graph_tool: deny:prior_denial
    other_recipient: allow
- kind: 'true'
  key: lifted
- kind: equals
  key: after_lift
  value: allow
