# user story: fangore_insp_tool_result_freshness
# Fangore starts the CLI host with family `pass_through` and backend `mock`.
# He runs `tool_result_freshness`: expired or too-old ToolResults are rejected
# before a decision; a live CRM result within TTL passes.
kind: user_story
environment:
  family: pass_through
  backend: mock
steps:
- do:
    tool_result_freshness:
      now: '2026-10-18T12:00:00Z'
      policy:
        max_age_seconds: 86400
        require_provenance: false
      results:
      - tool_call_id: crm_cache_8d
        content: deal open
        source: crm.cache
        observed_at: '2026-10-10T12:00:00Z'
      - tool_call_id: quote_expired
        content: price 10
        source: pricing
        expires_at: '2026-10-18T11:00:00Z'
      - tool_call_id: crm_live
        content: deal open
        source: crm.api
        observed_at: '2026-10-18T11:45:00Z'
        expires_at: '2026-10-18T13:00:00Z'
  expect:
  - kind: equals
    key: rejected_ids
    value:
    - crm_cache_8d
    - quote_expired
  - kind: equals
    key: passed_ids
    value:
    - crm_live
complete:
  expect:
  - kind: equals
    key: rejected_ids
    value:
    - crm_cache_8d
    - quote_expired
  - kind: equals
    key: passed_ids
    value:
    - crm_live
cleanup: []
