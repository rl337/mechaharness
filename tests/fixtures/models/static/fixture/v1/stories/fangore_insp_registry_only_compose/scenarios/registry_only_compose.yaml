# user story: fangore_insp_registry_only_compose
# Fangore starts the CLI host with family `pass_through` and backend `mock`.
# Production graphs are composed from registered recipes (including nested recipes), not
# free-form node synthesis.
# Tiling and recipe-as-tool already help (`fangore_recipe_namespace_tile`,
# `fangore_recipe_as_tool`).
kind: user_story
environment:
  family: pass_through
  backend: mock
graph: null
steps:
- do:
    recipe_plan:
      path: plans/registry_compose.yaml
complete:
  expect:
  - kind: equals
    key: violations
    value:
      pure_tiling: []
      free_form:
      - free_form_node:adhoc_shell
      forged_version:
      - unregistered_recipe:verify_repair@99
cleanup: []
