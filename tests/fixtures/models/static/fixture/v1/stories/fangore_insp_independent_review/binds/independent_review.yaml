# Independent-review Agentic Recipe: produce → isolated review_* → aggregate.
# Reviewers see the artifact and acceptance contract, not producer reasoning.

name: independent_review
summary: Two isolated reviewers retain disagreement against acceptance.
goal: review

acceptance:
- lgtm

soft_bindings:
  produce_kind: produce
  review_kind: review
  aggregate_kind: aggregate_reviews
  # Story claim: more than one independent reviewer
  reviewer_count: 2
  # Reviewers must not reuse producer reasoning
  omit_producer_reasoning: true
  acceptance:
  - lgtm
