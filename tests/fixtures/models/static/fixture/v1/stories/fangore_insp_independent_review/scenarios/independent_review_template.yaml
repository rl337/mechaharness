# user story: fangore_insp_independent_review
# Fangore starts the CLI host with family `pass_through` and backend `mock`, and works
# with the `independent_review` recipe.
# Independent review must not reuse the producer's accumulated reasoning by default.
# Reviewers see the artifact and acceptance contract; disagreement is retained.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph:
  recipe: independent_review
steps:
- do:
    instantiate_recipe:
      path: binds/independent_review.yaml
complete:
  expect:
  - kind: 'true'
    key: recipe_in_catalog
  - kind: equals
    key: status
    value: ok
  - kind: equals
    key: review_count
    value: 2
  - kind: 'true'
    key: omit_producer_reasoning
  - kind: 'true'
    key: retain_disagreement
  - kind: equals
    key: template_name
    value: independent_review
cleanup: []
