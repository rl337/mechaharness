# user story: fangore_insp_independent_review
kind: user_story
environment:
  family: pass_through
  backend: mock
graph:
  recipe: independent_review
  bind: binds/independent_review.yaml
steps:
- do:
    run_recipe:
      name: independent_review
      path: binds/independent_review.yaml
complete:
  expect:
  - kind: 'true'
    key: recipe_in_catalog
  - kind: equals
    key: status
    value: ok
  - kind: equals
    key: review_count
    value: 2
  - kind: 'true'
    key: omit_producer_reasoning
  - kind: 'true'
    key: retain_disagreement
  - kind: 'true'
    key: disagreement_retained
  - kind: equals
    key: finding_count
    value: 2
  - kind: equals
    key: template_name
    value: independent_review
  - kind: lte
    key: budget_spent
    value: 10
  - kind: lte
    key: cost_units
    value: 10
cleanup: []
