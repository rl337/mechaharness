# user story: fangore_coding_ci_diagnose
# Mock forge CI lookup → job log → diagnosis note (no source repair yet).
# Static: coding_tool_script. Live: Completer + same RecordingGitHubClient.
kind: user_story
environment:
  family: pass_through
  backend: mock
  local_work: project_coding
  workspace: temp
  coding_github: local_mock_ci
  coding_tool_script: ci_diagnose
graph:
  recipe: guided_coding
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: coding-ci-diagnose-1
      inputs:
        goal: >-
          The latest CI checks job failed. Use ci_checks on HEAD, then
          ci_job_log for the failing job_id from the check summary, and write
          .mechaharness/ci_diagnosis.md naming the check, job id, and root
          causes from the log. Do not edit product source and do not open a
          pull request. Prefer the bound mock GitHub client over any planted
          failure log file.
        max_iterations: 16
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: gte
    key: guidance_yields
    value: 1
- do:
    answer:
      choose: thorough
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: gte
    key: resumes
    value: 1
  - kind: includes
    key: written_files
    value:
    - .mechaharness/ci_diagnosis.md
- do:
    workspace_read:
      path: .mechaharness/ci_diagnosis.md
  expect:
  - kind: 'true'
    key: exists
  - kind: contains
    key: text
    value: checks
  - kind: contains
    key: text
    value: '9001'
  - kind: contains
    key: text
    value: Ruff
  - kind: contains
    key: text
    value: I001
  - kind: contains
    key: text
    value: Mypy
  - kind: contains
    key: text
    value: no-untyped-def
complete:
  expect:
  - kind: includes
    key: event_types
    value:
    - core:graph_yield
    - core:guidance_resume
    - core:graph_start
    - core:graph_end
cleanup: []
