kind: cli
commands:
- probe:
    name: rollout_graph_build
    records:
    - id: root
      kind: model_call
    - id: retry
      kind: retry
      parent_id: root
      execution_node_id: produce
      attempt: 2
    - id: review
      kind: delegated_agent
expect:
- kind: equals
  key: roots_exactly
  value:
  - review
  - root
- kind: 'true'
  key: retry_linked
