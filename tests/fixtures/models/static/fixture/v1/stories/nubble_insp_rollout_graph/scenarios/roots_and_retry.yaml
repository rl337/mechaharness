# user story: nubble_insp_rollout_graph
# Migrated from probe plan `roots_and_retry.yaml` → product/test verb `rollout_graph_build`.
kind: user_story
environment:
  family: pass_through
  backend: mock
steps:
- do:
    rollout_graph_build:
      records:
      - id: root
        kind: model_call
      - id: retry
        kind: retry
        parent_id: root
        execution_node_id: produce
        attempt: 2
      - id: review
        kind: delegated_agent
  expect: &id001
  - kind: equals
    key: roots_exactly
    value:
    - review
    - root
  - kind: 'true'
    key: retry_linked
complete:
  expect: *id001
cleanup: []
