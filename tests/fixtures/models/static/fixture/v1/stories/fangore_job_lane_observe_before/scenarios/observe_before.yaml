# user story: fangore_job_lane_observe_before
kind: user_story
environment:
  family: pass_through
  backend: mock
  job_lanes:
    assets.generate:
      meta: {mode: deny_all}
      keys:
        asset_urls: {mode: open}
steps:
- do:
    lane_publish:
      started_at: '2026-10-21T10:00:00Z'
      keys:
        asset_urls: {url: https://cdn.example/early.png}
  lane: assets.generate
  run_id: gen-early
- do:
    lane_publish:
      started_at: '2026-10-21T14:00:00Z'
      keys:
        asset_urls: {url: https://cdn.example/late.png}
  lane: assets.generate
  run_id: gen-late
- do:
    lane_observe:
      target_lane: assets.generate
      selector: {before: '2026-10-21T12:00:00Z'}
      key: asset_urls
  lane: assets.generate
  expect:
  - kind: equals
    key: status
    value: ok
  - kind: equals
    key: run_id
    value: gen-early
  - kind: equals
    key: value
    value:
      url: https://cdn.example/early.png
complete:
  expect:
  - kind: equals
    key: run_id
    value: gen-early
cleanup: []
