# user story: fangore_decision_plane_telemetry
kind: user_story
environment:
  family: pass_through
  backend: mock
graph:
  recipe: decision_plane
  bind: binds/telemetry_fields.yaml
steps:
- do:
    run_recipe:
      name: decision_plane
      path: binds/telemetry_fields.yaml
complete:
  expect:
  - kind: 'true'
    key: has_question_schema_ids
  - kind: 'true'
    key: has_projection_fingerprint
  - kind: equals
    key: final_action
    value: billing
  - kind: equals
    key: model_ref
    value: flavor:local_decision
  - kind: equals
    key: latency_ms
    value: 42
  - kind: 'false'
    key: includes_raw_body
  - kind: lte
    key: budget_spent
    value: 10
  - kind: lte
    key: cost_units
    value: 10
cleanup: []
