# user story: fangore_jev_citation_matching_claim
# Fangore judges citation support over source+claim via product verb `judge`.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph: null
steps:
- do:
    judge:
      state_path: inputs/state.txt
      questions:
      - id: support
        kind: choice
        instructions: Does the source support the claim?
        options:
        - id: supported
          description: Supported
        - id: contradicted
          description: Contradicted
        - id: insufficient
          description: Insufficient
        - id: unavailable
          description: Unavailable
        allowed_actions:
        - supported
        - contradicted
        - insufficient
        - unavailable
      question_set_version: citation-v1
      action_question_id: support
      confidence_floor: 0.7
      verified_selected: supported
complete:
  expect:
  - kind: 'true'
    key: claim_verified
cleanup: []
