# user story: fangore_insp_handoff_record
kind: user_story
environment:
  family: pass_through
  backend: mock
steps:
- do:
    handoff_record:
      goals:
      - ship report
      exclusions:
      - do not email the customer
      completed:
      - a
      pending:
      - b
      rationale: because
      next_action: verify
      verdict:
        kind: ASK_HUMAN
        policyVersion: '1'
complete:
  expect:
  - kind: equals
    key: next_action
    value: verify
  - kind: equals
    key: goals
    value:
    - ship report
  - kind: equals
    key: exclusions
    value:
    - do not email the customer
  - kind: equals
    key: verdict_kind
    value: ASK_HUMAN
cleanup: []
