# user story: fangore_coding_static_checks
# Seeded Mypy no-untyped-def → annotate → host verify_runs mypy:true.
kind: user_story
environment:
  family: pass_through
  backend: mock
  local_work: project_coding
  workspace: temp
  static_seed: mypy_untyped
  coding_tool_script: static_mypy_repair
graph:
  recipe: guided_coding
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: coding-static-mypy-1
      inputs:
        goal: >-
          Mypy failed on no-untyped-def for typed_mod.py. Read
          .mechaharness/ci_failure.log and/or run `python -m mypy typed_mod.py`,
          add type annotations, and write .mechaharness/ci_fix.md naming Mypy
          no-untyped-def and the file you changed. Do not open a pull request.
        max_iterations: 16
        verify_runs:
        - path: typed_mod.py
          mypy: true
        - path: .mechaharness/ci_fix.md
          text_contains:
          - Mypy
          - no-untyped-def
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: gte
    key: guidance_yields
    value: 1
- do:
    answer:
      choose: thorough
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: gte
    key: resumes
    value: 1
  - kind: includes
    key: written_files
    value:
    - .mechaharness/ci_fix.md
    - typed_mod.py
- do:
    workspace_read:
      path: typed_mod.py
  expect:
  - kind: 'true'
    key: exists
  - kind: contains
    key: text
    value: 'def answer(x: int) -> int'
- do:
    workspace_read:
      path: .mechaharness/ci_fix.md
  expect:
  - kind: 'true'
    key: exists
  - kind: contains
    key: text
    value: Mypy
  - kind: contains
    key: text
    value: no-untyped-def
complete:
  expect:
  - kind: includes
    key: event_types
    value:
    - core:graph_yield
    - core:guidance_resume
    - core:graph_start
    - core:graph_end
cleanup: []
