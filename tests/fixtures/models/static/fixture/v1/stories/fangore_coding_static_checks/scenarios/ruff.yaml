# user story: fangore_coding_static_checks
# Seeded Ruff I001 → repair imports → host verify_runs ruff:true.
kind: user_story
environment:
  family: pass_through
  backend: mock
  local_work: project_coding
  workspace: temp
  static_seed: ruff_imports
  coding_tool_script: static_ruff_repair
graph:
  recipe: guided_coding
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: coding-static-ruff-1
      inputs:
        goal: >-
          Ruff failed on I001 (unsorted imports) for messy.py. Read
          .mechaharness/ci_failure.log and/or run `python -m ruff check messy.py`,
          fix the imports, and write .mechaharness/ci_fix.md naming Ruff I001
          and the file you changed. Do not open a pull request.
        max_iterations: 16
        verify_runs:
        - path: messy.py
          ruff: true
        - path: .mechaharness/ci_fix.md
          text_contains:
          - Ruff
          - I001
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: gte
    key: guidance_yields
    value: 1
- do:
    answer:
      choose: thorough
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: gte
    key: resumes
    value: 1
  - kind: includes
    key: written_files
    value:
    - .mechaharness/ci_fix.md
    - messy.py
- do:
    workspace_read:
      path: messy.py
  expect:
  - kind: 'true'
    key: exists
  - kind: contains
    key: text
    value: import os
  - kind: contains
    key: text
    value: from pathlib import Path
- do:
    workspace_read:
      path: .mechaharness/ci_fix.md
  expect:
  - kind: 'true'
    key: exists
  - kind: contains
    key: text
    value: Ruff
  - kind: contains
    key: text
    value: I001
complete:
  expect:
  - kind: includes
    key: event_types
    value:
    - core:graph_yield
    - core:guidance_resume
    - core:graph_start
    - core:graph_end
cleanup: []
