# user story: fangore_bounded_retry_recipe
kind: user_story
environment:
  family: pass_through
  backend: mock
graph:
  recipe: bounded_retry
  bind: binds/bounded_retry.yaml
steps:
- do:
    run_recipe:
      name: bounded_retry
      path: binds/bounded_retry.yaml
complete:
  expect:
  - kind: 'true'
    key: recipe_in_catalog
  - kind: equals
    key: status
    value: ok
  - kind: equals
    key: template_name
    value: bounded_retry
  - kind: includes
    key: subgraph_node_ids
    value:
    - attempt
    - classify
    - permit_retry
    - backoff
    - escalate
  - kind: 'true'
    key: attempt_repeating
  - kind: equals
    key: max_iterations
    value: 3
  - kind: 'true'
    key: requires_effect_reconciliation
  - kind: equals
    key: attempt_count
    value: 3
  - kind: 'true'
    key: attempt_succeeded
  - kind: 'false'
    key: escalated
  - kind: lte
    key: budget_spent
    value: 10
  - kind: lte
    key: cost_units
    value: 10
cleanup: []
