# user story: fangore_jev_req_review_gap_found
# He judges requirements coverage over a PR diff and story facts, then applies crash-test policy.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph: null
steps:
- do:
    judge:
      state_path: inputs/state.txt
      questions:
      - id: coverage
        kind: choice
        instructions: Are the PR change and user stories covered, including crash
          tests?
        options:
        - id: covered
          description: Covered
        - id: gap
          description: Gap
        - id: unclear
          description: Unclear
        allowed_actions:
        - covered
        - gap
        - unclear
      question_set_version: req-review-v1
      action_question_id: coverage
      confidence_floor: 0.7
      facts:
        crash_tests_present: true
complete:
  expect:
  - kind: equals
    key: outcome
    value: request_tests
cleanup: []
