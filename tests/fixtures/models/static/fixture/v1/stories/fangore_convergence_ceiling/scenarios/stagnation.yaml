# Repeated fingerprint trips stagnation terminal
kind: cli

commands:
  - convergence_ceiling:
      contract:
        version: story-conv-v1
        max_iterations: 10
        stagnation_window: 2
        max_elapsed_ms: 60000
      fingerprints: [same, same, same]
      elapsed_ms_per_tick: 5

expect:
  terminal: no_progress
  reason: stagnation
  success: false
