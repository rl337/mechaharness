kind: cli
commands:
- probe:
    name: convergence_ceiling
    contract:
      version: story-conv-v1
      max_iterations: 10
      stagnation_window: 2
      max_elapsed_ms: 60000
    fingerprints:
    - same
    - same
    - same
    elapsed_ms_per_tick: 5
expect:
- kind: equals
  key: terminal
  value: no_progress
- kind: equals
  key: reason
  value: stagnation
- kind: 'false'
  key: success
