# Plan document: ../plans/port_search.yaml
kind: cli
commands:
- recipe_plan:
    path: plans/port_search.yaml
expect:
- kind: equals
  key: found
  value:
    produces_artifact:
    - produce_critique_refine
    - verify_repair
    accepts_scenario:
    - safety_eval
    scenario_to_report:
    - safety_eval
    wildcard:
