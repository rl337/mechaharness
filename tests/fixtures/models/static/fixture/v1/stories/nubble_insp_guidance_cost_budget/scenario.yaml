# Cost counters advance across one guidance answer
kind: durable_generator
graph: verify_repair
controller: ops
store: memory

steps:
  - start:
      run_id: cost-1
      inputs:
        guidance:
          - request_id: req-cost
            question: Budget?
            choices:
              - id: a
                label: A
    expect:
      kind: advice_requested
      question: Budget?

  - answer:
      choose: a
      request_id: req-cost
    expect:
      kind: completed
      guidance_yields: 1
      resumes: 1
      local_steps: 2
