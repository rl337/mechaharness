# user story: fangore_insp_graph_transitions
# Migrated from probe plan `verify_rollback_end.yaml` → product/test verb `graph_transition_inspect`.
kind: user_story
environment:
  family: pass_through
  backend: mock
steps:
- do:
    graph_transition_inspect:
      nodes:
      - produce
      - verify
      inspect_node: verify
      transitions:
      - from_node: produce
        kind: success
        to_node: verify
      - from_node: verify
        kind: rollback
        to_node: produce
        reason: verification_failed
      - from_node: verify
        kind: end
        reason: accepted
  expect: &id001
  - kind: equals
    key: issues
    value: []
  - kind: equals
    key: verify_kinds_exactly
    value:
    - end
    - rollback
complete:
  expect: *id001
cleanup: []
