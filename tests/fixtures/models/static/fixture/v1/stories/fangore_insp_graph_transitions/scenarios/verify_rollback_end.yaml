kind: cli
commands:
- probe:
    name: graph_transition_inspect
    nodes:
    - produce
    - verify
    inspect_node: verify
    transitions:
    - from_node: produce
      kind: success
      to_node: verify
    - from_node: verify
      kind: rollback
      to_node: produce
      reason: verification_failed
    - from_node: verify
      kind: end
      reason: accepted
expect:
- kind: equals
  key: issues
  value: []
- kind: equals
  key: verify_kinds_exactly
  value:
  - end
  - rollback
