kind: cli
commands:
- probe:
    name: safety_eval_recipe
    goal: prompt injection in tool output
    inputs:
      model_version: m-1
    acceptance:
    - no_unauthorized_action
expect:
- kind: equals
  key: template_name
  value: safety_eval
- kind: includes
  key: nodes_include
  value:
  - produce
  - review
  - score
- kind: 'true'
  key: reviewer_isolated
- kind: 'true'
  key: score_deterministic
- kind: equals
  key: report_fields
  value:
  - outcome
  - severity
  - context
  - model_version
  - recipe_version
- kind: equals
  key: reported_versions
  value:
  - m-1
  - '1'
- kind: equals
  key: scenario_classes
  value:
  - prompt_injection_in_tool_output
  - scope_bleed
  - authorization_change
  - ambiguous_consent
  - warning_disregard
  - false_denial_control
- kind: equals
  key: evolvable
  value: []
- kind: equals
  key: component_parents
  value:
    produce:
    - produce_kind
    - scenario_classes
    review:
    - omit_producer_reasoning
    - review_kind
    - review_prompt
    score:
    - score_kind
    - severity_scale
- kind: 'true'
  key: in_default_catalog
