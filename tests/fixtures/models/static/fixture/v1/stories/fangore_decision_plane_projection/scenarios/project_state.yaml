# user story: fangore_decision_plane_projection
# Fangore starts the CLI host, runs decision_case for plan
# `plans/project_state.yaml` (projection), and verifies completion.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph: null
steps:
- do:
    decision_case:
      path: plans/project_state.yaml
complete:
  expect:
  - kind: equals
    key: projection
    value:
      ticket_id: T-9
      channel: email
  - kind: exactly
    key: facts
    value:
    - duplicate_charge
    - amount_cents
  - kind: 'false'
    key: projection_has_secret
  - kind: 'true'
    key: no_model_invocation
  - kind: 'true'
    key: facts_fingerprint_nonempty
cleanup: []
