# user story: fangore_job_lane_same_lane_lineage
kind: user_story
environment:
  family: pass_through
  backend: mock
  job_lanes:
    assets.generate:
      meta: {mode: deny_all}
      keys:
        asset_urls: {mode: deny_all}
steps:
- do:
    lane_publish:
      keys:
        asset_urls: {url: https://cdn.example/early.png}
  lane: assets.generate
  run_id: gen-early
  expect:
  - kind: equals
    key: status
    value: ok
- do:
    lane_observe:
      target_lane: assets.generate
      selector: {latest: true}
      key: asset_urls
  lane: assets.generate
  expect:
  - kind: equals
    key: status
    value: ok
  - kind: equals
    key: run_id
    value: gen-early
  - kind: equals
    key: value
    value:
      url: https://cdn.example/early.png
complete:
  expect:
  - kind: equals
    key: status
    value: ok
  - kind: equals
    key: run_id
    value: gen-early
cleanup: []
