# user story: fangore_compound_grants (compound read+write allows)
kind: user_story
environment:
  family: tool_loop
  backend: mock
  access_policy:
    layers:
    - - core:fs.read
    - - core:fs.write
steps:
- do:
    tool_loop:
      prompt: Write a.txt
      tool_name: write_file
      tool_grants:
      - core:fs.write
      family: tool_loop
complete:
  expect:
  - kind: equals
    key: permission_denied
    value: false
  - kind: equals
    key: allowed
    value: true
  - kind: equals
    key: text
    value: done
  - kind: lte
    key: cost_units
    value: 10
cleanup: []
