# user story: fangore_compound_grants (read-only denies write)
kind: user_story
environment:
  family: tool_loop
  backend: mock
  grants:
  - core:fs.read
steps:
- do:
    tool_loop:
      prompt: Write a.txt
      tool_name: write_file
      tool_grants:
      - core:fs.write
      family: tool_loop
complete:
  expect:
  - kind: equals
    key: permission_denied
    value: true
  - kind: equals
    key: allowed
    value: false
  - kind: lte
    key: cost_units
    value: 10
cleanup: []
