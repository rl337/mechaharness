# user story: fangore_insp_driver_session_resume
# Fangore starts the CLI host with family `pass_through` and backend `mock`, loads the
# `verify_repair` durable graph (controller `session`, store `memory`).
# Frontier and other MCP-capable clients cannot reenter a model session during a pending
# tool call.
# Guidance therefore returns as an ordinary tool result; the same driving session calls
# resume later with the answer.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph:
  recipe: verify_repair
  durable:
    controller: session
    store: memory
steps:
- do:
    start:
      run_id: session-1
      inputs:
        guidance:
        - question: Direction?
          choices:
          - id: a
            label: A
  expect:
  - kind: equals
    key: kind
    value: advice_requested
- do:
    answer:
      choose: a
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: 'true'
    key: separate_calls
complete:
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: 'true'
    key: separate_calls
cleanup: []
