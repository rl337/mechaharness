# user story: fangore_insp_lifecycle_graph_observe
# Config-bound lifecycle extensions via tool_lifecycle.
kind: user_story
environment:
  family: pass_through
  backend: mock
  lifecycle_extensions: &id001
  - acme:graph_watch
graph: null
steps:
- do:
    tool_lifecycle:
      mode: graph
      prompt: write
      grants:
      - core:fs.write
      tool_calls: []
      extension_ids: *id001
      goal: lifecycle
complete:
  expect:
  - kind: equals
    key: graph_status
    value: ok
  - kind: equals
    key: boundary
    value: core:before_graph_node
  - kind: equals
    key: extension_id
    value: acme:graph_watch
  - kind: 'true'
    key: default_ran
  - kind: equals
    key: cost_units
    value: 1
  - kind: lte
    key: budget_spent
    value: 10
cleanup: []
