# user story: fangore_job_lane_key_expose_artifacts
kind: user_story
environment:
  family: pass_through
  backend: mock
  job_lanes:
    assets.generate:
      meta: {mode: deny_all}
      keys:
        asset_urls: {mode: allow_lanes, lanes: [billing.settle]}
    billing.settle:
      meta: {mode: open}
      keys: {}
steps:
- do:
    lane_publish:
      keys:
        asset_urls:
          url: https://cdn.example/hero.png
          media_type: image/png
  lane: assets.generate
  run_id: gen-art
- do:
    lane_observe:
      target_lane: assets.generate
      selector: {latest: true}
      key: asset_urls
  lane: billing.settle
  expect:
  - kind: equals
    key: status
    value: ok
  - kind: equals
    key: value
    value:
      url: https://cdn.example/hero.png
      media_type: image/png
complete:
  expect:
  - kind: equals
    key: status
    value: ok
cleanup: []
