# user story: fangore_guided_coding_recipe
# Fangore starts the CLI host with family `pass_through` and backend `mock`, loads the
# `guided_coding` durable graph (controller `story`, store `memory`).
# Start yields advice_requested from soft point external_guidance; he answers minimal;
# the run completes under NoOp local work (no coding burst).
# Observability: exact generator counters + tapped yield/resume events only.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph:
  recipe: guided_coding
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: guided-coding-1
      inputs:
        goal: add a small helper
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: equals
    key: guidance_yields
    value: 1
  - kind: equals
    key: resumes
    value: 0
  - kind: equals
    key: local_steps
    value: 1
- do:
    answer:
      choose: minimal
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: 'true'
    key: pending_cleared
  - kind: equals
    key: guidance_yields
    value: 1
  - kind: equals
    key: resumes
    value: 1
  - kind: equals
    key: local_steps
    value: 2
complete:
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: 'true'
    key: pending_cleared
  - kind: includes
    key: event_types
    value:
    - core:graph_yield
    - core:guidance_resume
  - kind: exactly
    key: tapped_event_types
    value:
    - core:graph_node
    - core:graph_node
    - core:graph_yield
    - core:guidance_resume
    - core:graph_node
    - core:graph_yield
cleanup: []
