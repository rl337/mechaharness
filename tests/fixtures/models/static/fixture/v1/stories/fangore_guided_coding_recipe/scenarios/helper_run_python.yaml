# user story: fangore_guided_coding_recipe
# Fangore asks guided_coding to write a small add helper, answers external
# guidance, then verifies the file on disk and runs Python against it.
# Observability: exact generator counters + tapped EventLog sequence (no extra
# graph executions beyond one coding burst after guidance).
kind: user_story
environment:
  family: pass_through
  backend: mock
  local_work: project_coding
  workspace: temp
  coding_write:
    path: helpers/add.py
    content: |
      def add(a, b):
          return a + b
graph:
  recipe: guided_coding
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: guided-helper-1
      inputs:
        goal: write helpers/add.py with an add(a, b) helper
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: equals
    key: guidance_yields
    value: 1
  - kind: equals
    key: resumes
    value: 0
  - kind: equals
    key: local_steps
    value: 1
- do:
    answer:
      choose: minimal
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: equals
    key: guidance_yields
    value: 1
  - kind: equals
    key: resumes
    value: 1
  - kind: equals
    key: local_steps
    value: 2
  - kind: includes
    key: written_files
    value:
    - helpers/add.py
- do:
    workspace_read:
      path: helpers/add.py
  expect:
  - kind: 'true'
    key: exists
  - kind: contains
    key: text
    value: def add
- do:
    run_python:
      code: from helpers.add import add; print(add(2, 3))
  expect:
  - kind: equals
    key: exit_code
    value: 0
  - kind: contains
    key: stdout
    value: '5'
complete:
  expect:
  - kind: equals
    key: exit_code
    value: 0
  - kind: contains
    key: stdout
    value: '5'
  - kind: includes
    key: event_types
    value:
    - core:graph_yield
    - core:guidance_resume
    - core:graph_start
    - core:graph_end
    - core:access_check
  - kind: exactly
    key: tapped_event_types
    value:
    - core:graph_node
    - core:graph_node
    - core:graph_yield
    - core:guidance_resume
    - core:access_check
    - core:graph_start
    - core:graph_node
    - core:graph_node_start
    - core:graph_node_end
    - core:graph_node
    - core:graph_node
    - core:graph_end
    - core:graph_node
    - core:graph_yield
cleanup: []
