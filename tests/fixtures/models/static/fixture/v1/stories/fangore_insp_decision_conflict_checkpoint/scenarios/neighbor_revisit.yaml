# Write-scope neighbor revisit with cycle prevention
kind: cli
commands:
- decision_conflict_neighbor_revisit:
    scenarios:
    - id: cycle_never_cleared
      start: a
      write_scopes:
        a:
        - repo:x
        b:
        - repo:x
        - repo:y
        c:
        - repo:y
      clears: []
    - id: cleared_at_c
      start: a
      write_scopes:
        a:
        - repo:x
        b:
        - repo:x
        - repo:y
        c:
        - repo:y
      clears:
      - c
    - id: no_conflicts
      start: a
      write_scopes:
        a:
        - repo:x
        b:
        - repo:y
      clears: []
expect:
  scenarios_exactly:
    cycle_never_cleared:
      order:
      - a
      - b
      - c
      checkpoints: []
      cycle_blocked:
      - c
    cleared_at_c:
      order:
      - a
      - b
      - c
      checkpoints:
      - c
      cycle_blocked: []
    no_conflicts:
      order:
      - a
      checkpoints:
      - a
      cycle_blocked: []
