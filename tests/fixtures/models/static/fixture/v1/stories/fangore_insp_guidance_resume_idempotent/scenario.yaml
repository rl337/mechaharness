# Duplicate idempotency key is a no-op; stale sequence rejected
kind: durable_generator
graph: verify_repair
controller: c1
store: memory

steps:
  - start:
      run_id: idem-1
      inputs:
        guidance:
          - question: Again?
            choices:
              - id: a
                label: A
    expect:
      kind: advice_requested

  - answer:
      choose: a
      idempotency_key: same
    expect:
      kind: completed

  - answer:
      choose: a
      idempotency_key: same
      replay: true
    expect:
      kind: completed
      same_sequence: true

  - answer:
      choose: a
      idempotency_key: other
      stale: true
    expect_error: sequence
