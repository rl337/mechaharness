kind: cli
durable:
  graph: verify_repair
  controller: c1
  store: memory
commands:
- start:
    run_id: idem-1
    inputs:
      guidance:
      - question: Again?
        choices:
        - id: a
          label: A
  expect:
  - kind: equals
    key: kind
    value: advice_requested
- answer:
    choose: a
    idempotency_key: same
  expect:
  - kind: equals
    key: kind
    value: completed
- answer:
    choose: a
    idempotency_key: same
    replay: true
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: 'true'
    key: same_sequence
- answer:
    choose: a
    idempotency_key: other
    stale: true
  expect_error: sequence
