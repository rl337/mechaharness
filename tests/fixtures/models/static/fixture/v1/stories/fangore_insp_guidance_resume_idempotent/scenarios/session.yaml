# user story: fangore_insp_guidance_resume_idempotent
# Fangore loads verify_repair as a durable IoC session, walks guidance
# start → answer → idempotent replay → stale refuse, and verifies the
# terminal sequence error so drivers can retry safely.
kind: user_story

environment:
  family: pass_through
  backend: mock

graph:
  recipe: verify_repair
  durable:
    controller: c1
    store: memory

steps:
  - # S1 — start; guidance soft point yields advice_requested
    do:
      start:
        run_id: idem-1
        inputs:
          guidance:
            - question: Again?
              choices:
                - id: a
                  label: A
    expect:
      - kind: equals
        key: kind
        value: advice_requested

  - # S2 — answer once under idempotency key → completed
    do:
      answer:
        choose: a
        idempotency_key: same
    expect:
      - kind: equals
        key: kind
        value: completed

  - # S3 — replay same key → same committed sequence
    do:
      answer:
        choose: a
        idempotency_key: same
        replay: true
    expect:
      - kind: equals
        key: kind
        value: completed
      - kind: 'true'
        key: same_sequence

  - # S4 — stale sequence under another key → safe refuse
    do:
      answer:
        choose: a
        idempotency_key: other
        stale: true
    expect_error: sequence

complete:
  # Story done: stale resume refused with sequence error.
  expect:
    - kind: equals
      key: error
      value: sequence

cleanup: []
