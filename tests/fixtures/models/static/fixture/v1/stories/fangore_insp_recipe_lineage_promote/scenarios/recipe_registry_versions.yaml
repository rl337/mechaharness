kind: cli
commands:
- probe:
    name: recipe_registry_versions
    recipe: verify_repair
    steps:
    - op: add_version
      version: '2'
      parent_version: '1'
    - op: add_version
      version: '3'
      parent_version: '2'
    - op: attach_evaluation
      version: '2'
      result:
        pass_rate: 0.9
    - op: attach_evaluation
      version: '3'
      result:
        pass_rate: 0.95
    - op: promote
      version: '3'
    - op: rollback
    - op: add_version
      version: '4'
      parent_version: '8'
expect:
- kind: equals
  key: active_version
  value: '1'
- kind: equals
  key: versions
  value:
  - '1'
  - '2'
  - '3'
- kind: equals
  key: lineage
  value:
    '1': null
    '2': '1'
    '3': '2'
- kind: equals
  key: evaluation_counts
  value:
    '1': 0
    '2': 1
    '3': 1
- kind: equals
  key: errors
  value:
  - add_version:KeyError
