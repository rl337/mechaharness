# user story: fangore_insp_recipe_lineage_promote
# Fangore starts the CLI host with family `pass_through` and backend `mock`.
# New recipe versions are immutable artifacts with provenance, lineage, test results, and
# a reversible promotion pointer.
# Research and rule promotion patterns exist (`taloneth_insp_rule_promotion`); the recipe
# catalog now keeps versions instead of overwriting by name.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph: null
steps:
- do:
    recipe_plan:
      path: plans/registry_versions.yaml
complete:
  expect:
  - kind: equals
    key: active_version
    value: '1'
  - kind: equals
    key: versions
    value:
    - '1'
    - '2'
    - '3'
  - kind: equals
    key: lineage
    value:
      '1': null
      '2': '1'
      '3': '2'
  - kind: equals
    key: evaluation_counts
    value:
      '1': 0
      '2': 1
      '3': 1
  - kind: equals
    key: errors
    value:
    - add_version:KeyError
cleanup: []
