# user story: fangore_decision_plane_policy
# Fangore starts the CLI host, runs decision_case for plan
# `plans/low_confidence.yaml` (policy), and verifies completion.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph: null
steps:
- do:
    decision_case:
      path: plans/low_confidence.yaml
complete:
  expect:
  - kind: 'true'
    key: escalate
  - kind: equals
    key: escalation_reason
    value: confidence_below_floor
  - kind: equals
    key: escalation_route
    value: host_policy
cleanup: []
