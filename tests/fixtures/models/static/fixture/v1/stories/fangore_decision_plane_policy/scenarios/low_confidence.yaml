# user story: fangore_decision_plane_policy
kind: user_story
environment:
  family: pass_through
  backend: mock
graph:
  recipe: decision_plane
  bind: binds/low_confidence.yaml
steps:
- do:
    run_recipe:
      name: decision_plane
      path: binds/low_confidence.yaml
complete:
  expect:
  - kind: 'true'
    key: escalate
  - kind: equals
    key: escalation_reason
    value: confidence_below_floor
  - kind: equals
    key: escalation_route
    value: host_policy
  - kind: lte
    key: budget_spent
    value: 10
  - kind: lte
    key: cost_units
    value: 10
cleanup: []
