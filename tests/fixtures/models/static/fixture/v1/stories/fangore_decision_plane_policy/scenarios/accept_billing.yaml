kind: cli
commands:
- probe:
    name: decision_plane_policy_case
    questions:
    - id: team
      kind: choice
      options:
      - id: billing
        label: Billing
      - id: technical
        label: Technical
      allowed_actions:
      - billing
      - technical
    - id: risk
      kind: score
      min: 0
      max: 1
    escalation_route: host_policy
    answers:
      team: billing
      risk: 0.2
    confidence: 0.95
    confidence_floor: 0.7
expect:
- kind: equals
  key: final_action
  value: billing
- kind: 'false'
  key: escalate
- kind: equals
  key: batch_invocation_count
  value: 1
- kind: equals
  key: escalation_route
  value: host_policy
