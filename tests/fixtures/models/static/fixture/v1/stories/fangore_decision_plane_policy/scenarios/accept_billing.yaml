# user story: fangore_decision_plane_policy
kind: user_story
environment:
  family: pass_through
  backend: mock
graph:
  recipe: decision_plane
  bind: binds/accept_billing.yaml
steps:
- do:
    run_recipe:
      name: decision_plane
      path: binds/accept_billing.yaml
complete:
  expect:
  - kind: equals
    key: final_action
    value: billing
  - kind: 'false'
    key: escalate
  - kind: equals
    key: batch_invocation_count
    value: 1
  - kind: equals
    key: escalation_route
    value: host_policy
  - kind: lte
    key: budget_spent
    value: 10
  - kind: lte
    key: cost_units
    value: 10
cleanup: []
