# user story: fangore_decision_plane_policy
# Fangore starts the CLI host, runs decision_case for plan
# `plans/accept_billing.yaml` (policy), and verifies completion.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph: null
steps:
- do:
    decision_case:
      path: plans/accept_billing.yaml
complete:
  expect:
  - kind: equals
    key: final_action
    value: billing
  - kind: 'false'
    key: escalate
  - kind: equals
    key: batch_invocation_count
    value: 1
  - kind: equals
    key: escalation_route
    value: host_policy
cleanup: []
