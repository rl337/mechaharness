kind: cli
commands:
- probe:
    name: transactional_durable_resume
    goal: downstream-coding-job
    run_id_prefix: story-tdr
    crash_location: after_accept_before_record
expect:
- kind: 'true'
  key: crashed
- kind: equals
  key: status
  value: ok
- kind: equals
  key: node_status
  value: succeeded
- kind: equals
  key: dispatch_count
  value: 1
- kind: equals
  key: dispatch_count_after_crash
  value: 1
- kind: equals
  key: effect_state_before
  value: uncertain
- kind: equals
  key: effect_state_after
  value: completed
- kind: 'true'
  key: reconciliation_invoked
- kind: equals
  key: boundary_before
  value: dispatch
