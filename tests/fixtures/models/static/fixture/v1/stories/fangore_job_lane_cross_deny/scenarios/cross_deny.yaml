# user story: fangore_job_lane_cross_deny
kind: user_story
environment:
  family: pass_through
  backend: mock
  job_lanes:
    assets.generate:
      meta: {mode: deny_all}
      keys:
        asset_urls: {mode: deny_all}
    billing.settle:
      meta: {mode: open}
      keys: {}
steps:
- do:
    lane_publish:
      keys:
        asset_urls: {url: https://cdn.example/secret.png}
  lane: assets.generate
  run_id: gen-1
- do:
    lane_observe:
      target_lane: assets.generate
      selector: {latest: true}
      key: asset_urls
  lane: billing.settle
  expect:
  - kind: equals
    key: status
    value: denied
complete:
  expect:
  - kind: equals
    key: status
    value: denied
cleanup: []
