# user story: fangore_insp_instruction_gotchas
kind: user_story
environment:
  family: pass_through
  backend: mock
steps:
- do:
    instruction_gotcha_metrics:
      title: watch path
      body: do not dump full memory
      over_trigger: true
complete:
  expect:
  - kind: equals
    key: over_trigger_count
    value: 1
  - kind: equals
    key: status_after_promote
    value: active
  - kind: equals
    key: active_gotcha_count
    value: 1
cleanup: []
