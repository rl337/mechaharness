# user story: fangore_delegate_refactor
# Sequential delegate_pkg stage — coding-delegate dogfood.
# Static: coding_writes stubs (provisional). Live Completer is the gate.
kind: user_story
environment:
  family: pass_through
  backend: mock
  local_work: project_coding
  workspace: suite
  coding_writes:
  - path: "README.md"
    content: |
      # Gadget

      Tiny in-workspace library for coding-delegate dogfood (renamed from Widget).

      ## Usage

      ```python
      from widget import Gadget

      g = Gadget()
      g.inc()
      g.double()
      ```
  - path: "tests/test_widget.py"
    content: |
      from widget import Gadget


      def test_starts_at_zero() -> None:
          assert Gadget().value == 0


      def test_inc() -> None:
          g = Gadget()
          assert g.inc() == 1
          assert g.inc(2) == 3


      def test_double() -> None:
          g = Gadget(3)
          assert g.double() == 6
          assert g.value == 6
  - path: "widget/__init__.py"
    content: |
      """Tiny Gadget library — rename from Widget."""

      from __future__ import annotations


      class Gadget:
          def __init__(self, value: int = 0) -> None:
              self.value = int(value)

          def inc(self, n: int = 1) -> int:
              self.value += int(n)
              return self.value

          def double(self) -> int:
              self.value *= 2
              return self.value
graph:
  recipe: guided_coding
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: delegate-refactor
      inputs:
        goal: "Rename the public class `Widget` to `Gadget` everywhere (package, tests, README).\
          \ Keep the package import path `from widget import Gadget`. Keep inc and double\
          \ behavior. Required contracts (non-negotiable): keep package import `from widget\
          \ import \u2026` working. Do NOT use eval() or exec(). You MUST call write_file\
          \ for every file you create or change before finishing. Tests under tests/ must\
          \ stay green (pytest)."
        max_iterations: 24
        verify_runs:
        - path: widget/__init__.py
          text_contains:
          - class Gadget
          - def double
          text_forbids:
          - eval(
          - exec(
          - class Widget
        - path: tests/test_widget.py
          text_contains:
          - Gadget
          - test_double
          text_forbids:
          - eval(
          - exec(
          - Widget
        - path: README.md
          text_contains:
          - Gadget
          - from widget import Gadget
          text_forbids:
          - eval(
          - exec(
        - exit_code: 0
          path: tests/test_widget.py
          pytest: true
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: gte
    key: guidance_yields
    value: 1
  - kind: gte
    key: local_steps
    value: 1
- do:
    answer:
      choose: minimal
  expect:
  - key: kind
    kind: equals
    value: completed
  - key: resumes
    kind: gte
    value: 1
  - key: written_files
    kind: includes
    value:
    - widget/__init__.py
    - tests/test_widget.py
    - README.md
- do:
    workspace_read:
      path: widget/__init__.py
  expect:
  - key: exists
    kind: 'true'
  - key: text
    kind: contains
    value: class Gadget
  - key: text
    kind: contains
    value: def double
- do:
    workspace_read:
      path: tests/test_widget.py
  expect:
  - key: exists
    kind: 'true'
  - key: text
    kind: contains
    value: Gadget
  - key: text
    kind: contains
    value: test_double
- do:
    workspace_read:
      path: README.md
  expect:
  - key: exists
    kind: 'true'
  - key: text
    kind: contains
    value: Gadget
  - key: text
    kind: contains
    value: from widget import Gadget
complete:
  expect:
  - kind: includes
    key: event_types
    value:
    - core:graph_yield
    - core:guidance_resume
    - core:graph_start
    - core:graph_end
cleanup: []
