kind: cli
commands:
- probe:
    name: graph_budget_limits
    node_cost: 1
    soft_policy:
      soft_limit: 1
      hard_limit: null
    hard_policy:
      soft_limit: null
      hard_limit: 1
expect:
- kind: equals
  key: soft_status
  value: soft_exhausted
- kind: equals
  key: soft_error
  value: soft_budget_exceeded
- kind: equals
  key: soft_budget_level
  value: soft
- kind: equals
  key: hard_status
  value: failed
- kind: equals
  key: hard_error
  value: hard_budget_exceeded
- kind: equals
  key: hard_budget_level
  value: hard
