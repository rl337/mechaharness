# user story: fangore_jev_context_budget_pack
# Fangore starts the CLI host, runs decision_case for plan
# `plans/budget_pack.yaml` (context_budget), and verifies completion.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph: null
steps:
- do:
    decision_case:
      path: plans/budget_pack.yaml
complete:
  expect:
  - kind: exactly
    key: selected_ids
    value:
    - c
    - a
  - kind: 'true'
    key: within_budget
cleanup: []
