# user story: fangore_jev_context_budget_pack
# Fangore packs RAG hits via context_pack recipe (retrieve→pack).
kind: user_story
environment:
  family: pass_through
  backend: mock
  rag_corpus: binds/corpus.yaml
graph:
  recipe: context_pack
  bind: binds/pack.yaml
steps:
- do:
    run_recipe:
      name: context_pack
      path: binds/pack.yaml
complete:
  expect:
  - kind: equals
    key: selected_ids
    value:
    - c
    - a
  - kind: 'true'
    key: within_budget
  - kind: lte
    key: budget_spent
    value: 10
  - kind: lte
    key: cost_units
    value: 10
cleanup: []
