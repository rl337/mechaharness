# user story: fangore_decision_plane_model_policy
# Fangore starts the CLI host, runs decision_case for plan
# `plans/model_soft_point.yaml` (model_policy), and verifies completion.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph: null
steps:
- do:
    decision_case:
      path: plans/model_soft_point.yaml
complete:
  expect:
  - kind: 'true'
    key: soft_point_decision_model
  - kind: equals
    key: ask_model_ref
    value: flavor:local_decision
  - kind: 'false'
    key: describe_has_param_count
cleanup: []
