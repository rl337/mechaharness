# user story: fangore_decision_plane_model_policy
kind: user_story
environment:
  family: pass_through
  backend: mock
graph:
  recipe: decision_plane
  bind: binds/model_soft_point.yaml
steps:
- do:
    run_recipe:
      name: decision_plane
      path: binds/model_soft_point.yaml
complete:
  expect:
  - kind: equals
    key: template_name
    value: decision_plane
  - kind: 'true'
    key: soft_point_decision_model
  - kind: equals
    key: ask_model_ref
    value: flavor:local_decision
  - kind: 'false'
    key: describe_has_param_count
  - kind: lte
    key: budget_spent
    value: 10
  - kind: lte
    key: cost_units
    value: 10
cleanup: []
