# user story: fangore_jev_task_route_invalid
# He escalates when the model invents a disallowed lane.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph: null
steps:
- do:
    judge:
      state: 'WORKLOAD: anything.'
      questions:
      - id: route
        kind: choice
        instructions: Choose the execution lane for this workload.
        options:
        - id: local_small
          description: local_small
        - id: frontier
          description: frontier
        - id: tool
          description: tool
        - id: human
          description: human
        - id: mystery_gateway
          description: mystery_gateway
        allowed_actions:
        - local_small
        - frontier
        - tool
        - human
      action_question_id: route
      confidence_floor: 0.7
      facts:
        complexity: 0.1
complete:
  expect:
  - kind: 'true'
    key: escalate
cleanup: []
