# user story: fangore_insp_lifecycle_replace
# Fangore starts the CLI host, runs lifecycle_case for plan
# `plans/lifecycle_extension_replace.yaml` (replace), and verifies completion.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph: null
steps:
- do:
    lifecycle_case:
      path: plans/lifecycle_extension_replace.yaml
complete:
  expect:
  - kind: equals
    key: tool_result
    value: 'hand-off: skipped write'
  - kind: 'true'
    key: applied_replace
  - kind: 'false'
    key: default_ran
cleanup: []
