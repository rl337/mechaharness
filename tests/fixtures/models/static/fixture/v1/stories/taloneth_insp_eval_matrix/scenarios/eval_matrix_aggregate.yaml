# user story: taloneth_insp_eval_matrix
kind: user_story
environment:
  family: pass_through
  backend: mock
steps:
- do:
    eval_matrix_aggregate:
      trials:
      - trial_id: '1'
        success: true
        model: m1
        harness_fingerprint: fp:a
        task_family: math
      - trial_id: '2'
        success: false
        model: m1
        harness_fingerprint: fp:b
        task_family: math
complete:
  expect:
  - kind: equals
    key: cell_count
    value: 2
  - kind: includes
    key: fingerprints
    value:
    - fp:a
    - fp:b
cleanup: []
