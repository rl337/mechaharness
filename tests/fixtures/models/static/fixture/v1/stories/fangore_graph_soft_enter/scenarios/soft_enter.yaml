# user story: fangore_graph_soft_enter
kind: user_story
environment:
  family: pass_through
  backend: mock
graph:
  inline:
    goal: soft-call
    nodes:
    - id: soft
      kind: subgraph
      subgraph:
        goal: child
        nodes:
          c1:
            id: c1
            kind: compute
            status: pending
          c2:
            id: c2
            kind: compute
            status: pending
            depends_on: [c1]
        edges: []
        version: '1'
steps:
- do:
    graph_walk:
      action: start
  expect:
  - kind: equals
    key: status
    value: paused
  - kind: equals
    key: entered_node_id
    value: soft
  - kind: equals
    key: stopped_before
    value: c1
  - kind: equals
    key: effect_calls
    value: 0
- do:
    graph_walk:
      action: step
  expect:
  - kind: equals
    key: status
    value: paused
  - kind: equals
    key: effect_calls
    value: 1
complete:
  expect:
  - kind: equals
    key: effect_calls
    value: 1
cleanup: []
