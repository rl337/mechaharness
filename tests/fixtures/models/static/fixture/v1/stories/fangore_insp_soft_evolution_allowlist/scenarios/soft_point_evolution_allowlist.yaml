# user story: fangore_insp_soft_evolution_allowlist
# Fangore starts the CLI host with family `pass_through` and backend `mock`.
# Hard nodes and trusted contracts are never silently rewritten by an optimizer; only
# allowlisted soft parameters (prompts, bounded rounds, reviewer counts) may evolve.
# Soft points already exist (`fangore_graph_template_soft_points`,
# `fangore_insp_soft_vs_hard`).
kind: user_story
environment:
  family: pass_through
  backend: mock
graph: null
steps:
- do:
    recipe_plan:
      path: plans/soft_evolution.yaml
complete:
  expect:
  - kind: equals
    key: outcomes
    value:
      tune_prompt: allowed
      drop_isolation: refused
      more_reviewers: allowed
      swap_runner: refused
  - kind: equals
    key: evolvable
    value:
      produce_critique_refine:
      - critique_prompt
      - max_rounds
      independent_review:
      - reviewer_count
      verify_repair: []
cleanup: []
