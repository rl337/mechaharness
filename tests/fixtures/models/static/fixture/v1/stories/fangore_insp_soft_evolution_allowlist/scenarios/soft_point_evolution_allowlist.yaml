# Plan document: ../plans/soft_evolution.yaml
kind: cli
commands:
- recipe_plan:
    path: plans/soft_evolution.yaml
expect:
- kind: equals
  key: outcomes
  value:
    tune_prompt: allowed
    drop_isolation: refused
    more_reviewers: allowed
    swap_runner: refused
- kind: equals
  key: evolvable
  value:
    produce_critique_refine:
    - critique_prompt
    - max_rounds
    independent_review:
    - reviewer_count
    verify_repair: []
