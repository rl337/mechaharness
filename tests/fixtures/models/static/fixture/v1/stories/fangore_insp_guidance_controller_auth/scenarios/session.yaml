kind: cli
durable:
  graph: verify_repair
  controller: owner
  store: memory
commands:
- start:
    run_id: auth-1
    inputs:
      guidance:
      - question: Owned?
        choices:
        - id: a
          label: A
  expect:
  - kind: equals
    key: kind
    value: advice_requested
- answer:
    choose: a
    controller: intruder
  expect_error: permission
- inspect: {}
  expect:
  - kind: 'true'
    key: controller_ok
- start:
    run_id: auth-2
    inputs:
      guidance:
      - question: Ship?
        requested_authority: final_approval
        choices:
        - id: 'yes'
          label: 'Yes'
  expect:
  - kind: equals
    key: kind
    value: advice_requested
- answer:
    choose: 'yes'
  expect_error: permission
