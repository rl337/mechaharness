# user story: fangore_host_kit_event_tap
# Fangore starts the CLI host with family `pass_through` and backend `mock`.
# Fangore’s console needs live path lighting as a durable plan runs.
# They want the same short host wiring used for submit-once jobs — not a second
# hand-built executor — and still receive node start and end events for the active steps.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph: null
steps:
- do:
    infer:
      prompt: light the path.
complete:
  expect:
  - kind: equals
    key: status
    value: ok
  - kind: exactly
    key: tapped_event_types
    value:
    - core:access_check
    - core:graph_start
    - core:graph_node
    - core:graph_node_start
    - core:cost
    - core:inference
    - core:graph_node_end
    - core:graph_node
    - core:graph_node
    - core:graph_end
  - kind: includes
    key: event_types
    value:
    - core:inference
    - core:cost
  - kind: positive
    key: total_tokens
  - kind: lte
    key: total_tokens
    value: 32
  - kind: lte
    key: cost_units
    value: 1
cleanup: []
