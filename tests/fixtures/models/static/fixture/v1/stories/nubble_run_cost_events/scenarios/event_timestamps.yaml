# user story: nubble_run_cost_events (timestamp claim)
# Same walk as event_types.yaml; Nubble also checks that inference and cost
# events carry the host clock instant he configured on the environment.
kind: user_story

environment:
  family: pass_through
  backend: mock
  clock: '2026-01-15T12:00:00Z'

graph: null

steps:
  - # S1 — run the one-shot job under the pinned clock
    do:
      infer:
        prompt: Say hello.

complete:
  expect:
    - kind: equals
      key: inference_ts
      value: '2026-01-15T12:00:00Z'
    - kind: equals
      key: cost_ts
      value: '2026-01-15T12:00:00Z'
    - kind: lte
      key: cost_units
      value: 1

cleanup: []
