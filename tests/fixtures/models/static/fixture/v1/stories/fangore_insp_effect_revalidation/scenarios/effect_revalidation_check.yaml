# user story: fangore_insp_effect_revalidation
# Pause before publish, revoke live epoch, continue → revalidation_failed.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph:
  inline:
    goal: publish
    nodes:
    - id: plan
      kind: compute
    - id: publish
      kind: publish
      depends_on: [plan]
      payload:
        tool_phase: execute
steps:
- do:
    graph_walk:
      action: start
      until: publish
      stop: before
      envelope_epoch: 2
      live_authorization_epoch: 2
  expect:
  - kind: equals
    key: status
    value: paused
  - kind: equals
    key: stopped_before
    value: publish
  - kind: equals
    key: effect_calls
    value: 1
- do:
    graph_walk:
      action: set_live_epoch
      live_authorization_epoch: 3
  expect:
  - kind: equals
    key: status
    value: ok
  - kind: equals
    key: live_authorization_epoch
    value: 3
- do:
    graph_walk:
      action: continue
  expect:
  - kind: equals
    key: status
    value: failed
  - kind: contains
    key: node_error
    value: revalidation_failed:authorization_epoch_advanced:2!=3
  - kind: equals
    key: effect_calls
    value: 1
complete:
  expect:
  - kind: equals
    key: status
    value: failed
  - kind: equals
    key: effect_calls
    value: 1
cleanup: []
