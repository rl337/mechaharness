# user story: fangore_insp_wip_backpressure
kind: user_story
environment:
  family: pass_through
  backend: mock
steps:
- do:
    wip_policy:
      max_active_nodes: 2
      max_per_write_scope: 1
      active_nodes: 1
      active_in_scope: 1
complete:
  expect:
  - kind: 'true'
    key: allows_new_scope
  - kind: 'false'
    key: allows_same_scope
cleanup: []
