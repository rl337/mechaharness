kind: cli
commands:
- probe:
    name: graph_linkage_preflight
    check_missing_runner: true
    check_missing_stop: false
    check_ok_linear: true
expect:
- kind: 'false'
  key: missing_runner_ok
- kind: equals
  key: missing_runner_codes_exactly
  value:
  - no_runner
- kind: 'true'
  key: ok_linear_ok
- kind: 'true'
  key: ok_linear_fingerprint_nonempty
