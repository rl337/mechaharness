# user story: fangore_insp_recipe_version_pointer
# Fangore starts the CLI host with family `pass_through` and backend `mock`.
# Recipe execution policies are versioned, testable, replaceable artifacts with a
# reversible promotion pointer — not only class version fields and demotion stamps.
# Incubation stamps exist in `fangore_insp_template_incubation`; lineage and evaluation
# attachments are in `fangore_insp_recipe_lineage_promote`.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph: null
steps:
- do:
    recipe_plan:
      path: plans/registry_versions.yaml
complete:
  expect:
  - kind: equals
    key: active_version
    value: '1'
  - kind: equals
    key: versions
    value:
    - '1'
    - '2'
  - kind: equals
    key: lineage
    value:
      '1': null
      '2': '1'
  - kind: equals
    key: evaluation_counts
    value:
      '1': 0
      '2': 0
  - kind: equals
    key: errors
    value:
    - promote:KeyError
cleanup: []
