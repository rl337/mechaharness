# user story: nubble_insp_review_audit_reconstruct
# Migrated from probe plan `review_audit_reconstruct.yaml` → product/test verb `review_audit_reconstruct`.
kind: user_story
environment:
  family: pass_through
  backend: mock
steps:
- do:
    review_audit_reconstruct:
      scenarios:
      - id: fully_attested
        decision:
          eventId: e1
          stateHash: h
          policyVersion: p1
          verdict: ALLOW
          recipeId: independent_review
          recipeVersion: '1'
          approvalIds:
          - appr:1
          effectIds:
          - fx:1
          executedAction: email.send
        attested:
          source_trust: trusted
          delegated_scope: env:child-1
          policy_revision: rev-7
      - id: denied_without_reason
        decision:
          eventId: e2
          stateHash: h
          policyVersion: p1
          verdict: DENY
          recipeId: independent_review
          recipeVersion: '1'
        attested:
          source_trust: untrusted
          delegated_scope: env:child-1
          policy_revision: rev-7
      - id: denied_with_reason
        decision:
          eventId: e3
          stateHash: h
          policyVersion: p1
          verdict: DENY
          recipeId: independent_review
          recipeVersion: '1'
          denialIds:
          - den:1
        attested:
          source_trust: untrusted
          delegated_scope: env:child-1
          policy_revision: rev-7
          denial_reasons:
          - untrusted_source
      - id: asked_human_unapproved
        decision:
          eventId: e4
          stateHash: h
          policyVersion: p1
          verdict: ASK_HUMAN
          recipeId: verify_repair
          recipeVersion: '2'
        attested:
          source_trust: trusted
          delegated_scope: env:child-2
          policy_revision: rev-7
      - id: effect_not_recorded
        decision:
          eventId: e5
          stateHash: h
          policyVersion: p1
          verdict: ALLOW
          recipeId: verify_repair
          recipeVersion: '2'
          executedAction: file.write
        attested:
          source_trust: trusted
          delegated_scope: env:child-2
          policy_revision: rev-7
      - id: envelope_fills_gaps
        decision:
          eventId: e6
          stateHash: h
          policyVersion: p1
          verdict: ALLOW
        envelope:
          recipe_id: bounded_retry
          recipe_version: '1'
          policy_revision: rev-8
          capability_envelope_ref: env:3
        attested:
          source_trust: trusted
  expect: &id001
  - kind: equals
    key: scenarios
    value:
      fully_attested:
        reconstructable: true
        missing: []
        approvals:
        - appr:1
        denials: []
        effects:
        - fx:1
        policy:
        - p1
        - rev-7
      denied_without_reason:
        reconstructable: false
        missing:
        - denial_reasons
        - denial_ids
        approvals: []
        denials: []
        effects: []
        policy:
        - p1
        - rev-7
      denied_with_reason:
        reconstructable: true
        missing: []
        approvals: []
        denials:
        - den:1
        effects: []
        policy:
        - p1
        - rev-7
      asked_human_unapproved:
        reconstructable: false
        missing:
        - approval_ids
        approvals: []
        denials: []
        effects: []
        policy:
        - p1
        - rev-7
      effect_not_recorded:
        reconstructable: false
        missing:
        - effect_ids
        approvals: []
        denials: []
        effects: []
        policy:
        - p1
        - rev-7
      envelope_fills_gaps:
        reconstructable: true
        missing: []
        approvals: []
        denials: []
        effects: []
        policy:
        - p1
        - rev-8
complete:
  expect: *id001
cleanup: []
