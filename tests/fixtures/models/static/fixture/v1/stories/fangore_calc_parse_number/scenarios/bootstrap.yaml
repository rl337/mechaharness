# user story: fangore_calc_parse_number
# Sequential calc_cli stage — shared suite workspace (environment.workspace=suite).
# Static: coding_write stub. Live: real Completer ignores stub and edits calc.py.
kind: user_story
environment:
  family: pass_through
  backend: mock
  local_work: project_coding
  workspace: suite
  coding_write:
    path: calc.py
    content: |
      """CLI math calculator — number literals."""
      from __future__ import annotations

      import sys


      def evaluate(expr: str) -> float:
          text = expr.strip()
          if not text:
              raise ValueError("empty expression")
          return float(text)


      def main(argv=None) -> int:
          args = list(sys.argv[1:] if argv is None else argv)
          if len(args) != 1:
              print("usage: calc.py <expression>", file=sys.stderr)
              return 2
          try:
              print(evaluate(args[0]))
              return 0
          except Exception as exc:
              print(f"error: {exc}", file=sys.stderr)
              return 1


      if __name__ == "__main__":
          raise SystemExit(main())
graph:
  recipe: guided_coding
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: calc-bootstrap
      inputs:
        goal: "Create calc.py in the workspace: a CLI math calculator that for now only evaluates number literals (e.g. 42, 3.14). Do not implement operators yet. Required API shape (non-negotiable): define both `def evaluate(expr)` and `def main(argv=None) -> int` by those exact names (main must not be only an inline `if __name__ == '__main__'` block). main reads sys.argv[1], prints the result, exits 0 on success / 1 on error / 2 on bad usage. Implement a real expression parser \u2014 do NOT use eval(), exec(), or ast.literal_eval on the user expression. You MUST call write_file with the full calc.py contents before finishing."
        max_iterations: 24
        verify_runs:
        - path: calc.py
          text_contains:
          - def evaluate
          - def main
          text_forbids:
          - eval(
          - exec(
        - args:
          - '42'
          exit_code: 0
          path: calc.py
          stdout_contains: '42'
        - args:
          - '3.14'
          exit_code: 0
          path: calc.py
          stdout_contains: '3.14'
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: gte
    key: guidance_yields
    value: 1
  - kind: gte
    key: local_steps
    value: 1
- do:
    answer:
      choose: minimal
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: gte
    key: resumes
    value: 1
  - kind: includes
    key: written_files
    value:
    - calc.py
- do:
    workspace_read:
      path: calc.py
  expect:
  - kind: 'true'
    key: exists
  - kind: contains
    key: text
    value: def evaluate
  - kind: contains
    key: text
    value: def main
- do:
    run_python:
      path: calc.py
      args:
      - "42"
  expect:
  - kind: equals
    key: exit_code
    value: 0
  - kind: contains
    key: stdout
    value: "42"
- do:
    run_python:
      path: calc.py
      args:
      - "3.14"
  expect:
  - kind: equals
    key: exit_code
    value: 0
  - kind: contains
    key: stdout
    value: "3.14"
complete:
  expect:
  - kind: equals
    key: exit_code
    value: 0
  - kind: includes
    key: event_types
    value:
    - core:graph_yield
    - core:guidance_resume
    - core:graph_start
    - core:graph_end
cleanup: []
