# user story: fangore_counter_persist
# Sequential counter_pkg stage — multi-file package + pytest contracts.
# Static: coding_writes stubs. Live: Completer ignores stubs.
kind: user_story
environment:
  family: pass_through
  backend: mock
  local_work: project_coding
  workspace: suite
  coding_writes:
  - path: "counter/__init__.py"
    content: |
      """Tiny Counter library — persist."""

      from __future__ import annotations

      import json
      from pathlib import Path


      class Counter:
          def __init__(self, value: int = 0) -> None:
              self.value = int(value)

          def inc(self, n: int = 1) -> int:
              self.value += int(n)
              return self.value

          def dec(self, n: int = 1) -> int:
              self.value -= int(n)
              return self.value

          def save(self, path: str | Path) -> None:
              Path(path).write_text(json.dumps({"value": self.value}), encoding="utf-8")

          @classmethod
          def load(cls, path: str | Path) -> Counter:
              data = json.loads(Path(path).read_text(encoding="utf-8"))
              return cls(value=int(data["value"]))
  - path: "tests/test_counter.py"
    content: |
      from pathlib import Path

      from counter import Counter


      def test_starts_at_zero() -> None:
          assert Counter().value == 0


      def test_inc_dec() -> None:
          c = Counter()
          assert c.inc() == 1
          assert c.dec() == 0


      def test_save_load(tmp_path: Path) -> None:
          path = tmp_path / "c.json"
          c = Counter()
          c.inc(5)
          c.save(path)
          assert Counter.load(path).value == 5
graph:
  recipe: guided_coding
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: counter-persist
      inputs:
        goal: "Add `Counter.save(path)` and `Counter.load(path)` classmethod (or equivalent named `load`) that round-trip `value` as JSON. Extend tests. Keep inc/dec. Required contracts (non-negotiable): keep package import `from counter import Counter` working; public class must be named `Counter`. Do NOT use eval() or exec(). You MUST call write_file for every file you create or change before finishing. Tests under tests/ must stay green (pytest)."
        max_iterations: 24
        verify_runs:
        - path: counter/__init__.py
          text_contains:
          - def save
          - def load
          text_forbids:
          - eval(
          - exec(
        - path: tests/test_counter.py
          text_contains:
          - save
          - load
          text_forbids:
          - eval(
          - exec(
        - exit_code: 0
          path: tests/test_counter.py
          pytest: true
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: gte
    key: guidance_yields
    value: 1
  - kind: gte
    key: local_steps
    value: 1
- do:
    answer:
      choose: minimal
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: gte
    key: resumes
    value: 1
  - kind: includes
    key: written_files
    value:
    - counter/__init__.py
    - tests/test_counter.py
- do:
    workspace_read:
      path: counter/__init__.py
  expect:
  - key: exists
    kind: 'true'
  - key: text
    kind: contains
    value: def save
  - key: text
    kind: contains
    value: def load
- do:
    workspace_read:
      path: tests/test_counter.py
  expect:
  - key: exists
    kind: 'true'
  - key: text
    kind: contains
    value: save
  - key: text
    kind: contains
    value: load
complete:
  expect:
  - kind: includes
    key: event_types
    value:
    - core:graph_yield
    - core:guidance_resume
    - core:graph_start
    - core:graph_end
cleanup: []
