# user story: fangore_verify_repair_recipe
kind: user_story
environment:
  family: pass_through
  backend: mock
graph:
  recipe: verify_repair
  bind: binds/verify_repair.yaml
steps:
- do:
    run_recipe:
      name: verify_repair
      path: binds/verify_repair.yaml
complete:
  expect:
  - kind: 'true'
    key: recipe_in_catalog
  - kind: equals
    key: status
    value: ok
  - kind: equals
    key: template_name
    value: verify_repair
  - kind: includes
    key: subgraph_node_ids
    value:
    - produce
    - verify
    - repair
    - complete
  - kind: 'true'
    key: verification_passed
  - kind: equals
    key: repair_attempts
    value: 1
  - kind: equals
    key: final_status
    value: succeeded
  - kind: lte
    key: budget_spent
    value: 10
  - kind: lte
    key: cost_units
    value: 10
cleanup: []
