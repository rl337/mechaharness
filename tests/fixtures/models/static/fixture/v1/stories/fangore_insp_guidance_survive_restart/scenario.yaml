# Pending guidance survives host rebuild on a shared store
kind: durable_generator
graph: verify_repair
controller: c1
store: shared

steps:
  - start:
      run_id: restart-1
      inputs:
        guidance:
          - question: Still pending after restart?
            choices:
              - id: ok
                label: OK
    expect:
      kind: advice_requested
      question: Still pending after restart?

  - rebuild: {}

  - inspect: {}
    expect:
      phase: guidance_required
      pending_question: Still pending after restart?
      same_request_id: true
