# user story: fangore_insp_guidance_survive_restart
# Fangore starts the CLI host with family `pass_through` and backend `mock`, loads the
# `verify_repair` durable graph (controller `c1`, store `shared`).
# A suspended generator run must survive executor or MCP process restart and present the
# identical pending question.
# Uses the CheckpointStore / run-store seam from durable resume
# (`fangore_insp_durable_resume`, `fangore_tdr_crash_before_intent`) rather than a
# second recovery protocol.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph:
  recipe: verify_repair
  durable:
    controller: c1
    store: shared
steps:
- do:
    start:
      run_id: restart-1
      inputs:
        guidance:
        - question: Still pending after restart?
          choices:
          - id: ok
            label: OK
  expect:
  - kind: equals
    key: kind
    value: advice_requested
  - kind: equals
    key: question
    value: Still pending after restart?
- do:
    rebuild: {}
- do:
    inspect: {}
  expect:
  - kind: equals
    key: phase
    value: guidance_required
  - kind: equals
    key: pending_question
    value: Still pending after restart?
  - kind: 'true'
    key: same_request_id
complete:
  expect:
  - kind: equals
    key: phase
    value: guidance_required
  - kind: equals
    key: pending_question
    value: Still pending after restart?
  - kind: 'true'
    key: same_request_id
cleanup: []
