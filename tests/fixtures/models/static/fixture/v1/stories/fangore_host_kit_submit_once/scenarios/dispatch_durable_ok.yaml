kind: cli
commands:
- probe:
    name: host_kit_submit_once
    id: dispatch_durable_ok
    mode: dispatch
    durable: true
    run_id: hk-dispatch-ok
    task_id: t1
expect:
- kind: equals
  key: status
  value: ok
- kind: equals
  key: dispatch_count
  value: 1
- kind: equals
  key: external_handle
  value: job-t1-1
- kind: equals
  key: durability
  value: durable
- kind: 'false'
  key: reconciliation_invoked
