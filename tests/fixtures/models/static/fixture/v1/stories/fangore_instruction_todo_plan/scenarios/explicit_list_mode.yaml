# user story: fangore_instruction_todo_plan
# Fangore sets instruction_mode=list with two string items; plan_classify
# builds a list plan without numbered-text parsing.
kind: user_story
environment:
  family: pass_through
  backend: mock
  local_work: plan_classify
graph:
  recipe: instruction_todo_plan
  durable:
    controller: story
    store: memory
steps:
- do:
    start:
      run_id: explicit-list-1
      inputs:
        instruction_mode: list
        instructions:
        - item1
        - item2
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: equals
    key: plan.mode
    value: list
  - kind: equals
    key: plan.items[0].instruction
    value: item1
  - kind: equals
    key: plan.items[1].instruction
    value: item2
complete:
  expect:
  - kind: equals
    key: kind
    value: completed
  - kind: equals
    key: plan.mode
    value: list
cleanup: []
