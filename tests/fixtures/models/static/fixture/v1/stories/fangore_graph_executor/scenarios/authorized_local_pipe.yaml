kind: cli
commands:
- probe:
    name: graph_executor_run
    goal: local pipe
    produce_value: 1
    max_attempts: 2
    fail_until_attempt: 99
    check_deny: true
    grants:
    - core:graph.execute
    - core:graph.escalate
expect:
- kind: equals
  key: status
  value: ok
- kind: equals
  key: consume_sum
  value: 2
- kind: 'true'
  key: emitted_graph_start
- kind: 'true'
  key: emitted_graph_end
- kind: 'true'
  key: denied_without_execute_grant
- kind: equals
  key: flaky_attempts
  value: 2
