# Bind: ../binds/fan_out_aggregate.yaml — Plan: ../plans/demoted_refuse.yaml
kind: cli
commands:
- instantiate_recipe:
    path: binds/fan_out_aggregate.yaml
  expect:
  - kind: equals
    key: template_name
    value: fan_out_aggregate
  - kind: equals
    key: template_status
    value: active
  - kind: includes
    key: subgraph_node_ids
    value:
    - plan
    - branch_0
    - branch_1
    - reduce
  - kind: equals
    key: source_workflow_ref
    value: host:workflows/compare_v1
  - kind: 'true'
    key: catalog_soft_points_nonempty
- recipe_plan:
    path: plans/demoted_refuse.yaml
  expect:
  - kind: 'true'
    key: demoted_refused
