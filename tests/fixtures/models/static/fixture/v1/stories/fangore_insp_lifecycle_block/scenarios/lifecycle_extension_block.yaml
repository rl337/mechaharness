kind: cli
commands:
- probe:
    name: lifecycle_extension_block
    prompt: Write a.txt
    grants:
    - core:fs.write
    tool_calls:
    - id: '1'
      name: write_file
      arguments:
        path: a.txt
expect:
- kind: equals
  key: tool_result
  value: blocked by host extension
- kind: 'true'
  key: applied_block
- kind: 'false'
  key: default_ran
