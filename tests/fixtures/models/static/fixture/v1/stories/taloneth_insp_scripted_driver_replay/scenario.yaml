# Strict host fails when advice arrives with no answer binding
kind: durable_generator
graph: verify_repair
controller: scripted
store: memory

steps:
  - start:
      inputs:
        guidance:
          - question: Unexpected?
            choices:
              - id: x
                label: X
    expect:
      kind: advice_requested

  - answer: {}
    expect_error: unexpected_advice
