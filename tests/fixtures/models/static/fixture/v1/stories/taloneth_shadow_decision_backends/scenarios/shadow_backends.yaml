# Compare decision backends without inventing missing results
kind: cli

commands:
  - shadow_decision_backends:
      state_hash: story-h1
      candidate_actions:
        - allow
        - ask_human
        - deny
      evidence_refs:
        - obs:12
      backends:
        rules:
          available: true
          latency_ms: 1.0
          verified_success: 0.9
          whole_task_cost: 0.05
        systemone:
          available: false
          exclusion_reason: lane_not_loaded
        small_local:
          available: true
          latency_ms: 12.0
          verified_success: 0.85
          whole_task_cost: 0.2

expect:
  unavailable_exactly:
    - systemone
  available_exactly:
    - rules
    - small_local
  matched_actions_exactly:
    - allow
    - ask_human
    - deny
