# user story: taloneth_shadow_decision_backends
# Taloneth starts the CLI host with family `pass_through` and backend `mock`.
# Taloneth compares rules, local model, and System One on a matched ticket.
# When the decide profile is cold, System One must be marked unavailable — no fake
# latency or verdict.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph: null
steps:
- do:
    shadow_decision_backends:
      state_hash: story-h1
      candidate_actions:
      - allow
      - ask_human
      - deny
      evidence_refs:
      - obs:12
      backends:
        rules:
          available: true
          latency_ms: 1.0
          verified_success: 0.9
          whole_task_cost: 0.05
        systemone:
          available: false
          exclusion_reason: lane_not_loaded
        small_local:
          available: true
          latency_ms: 12.0
          verified_success: 0.85
          whole_task_cost: 0.2
complete:
  expect:
  - kind: equals
    key: unavailable_exactly
    value:
    - systemone
  - kind: equals
    key: available_exactly
    value:
    - rules
    - small_local
  - kind: equals
    key: matched_actions_exactly
    value:
    - allow
    - ask_human
    - deny
cleanup: []
