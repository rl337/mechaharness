# Bind document: ../binds/produce_critique_refine.yaml
kind: cli
commands:
- instantiate_recipe:
    path: binds/produce_critique_refine.yaml
expect:
- kind: 'true'
  key: recipe_in_catalog
- kind: equals
  key: status
  value: ok
- kind: equals
  key: template_name
  value: produce_critique_refine
- kind: includes
  key: subgraph_node_ids
  value:
  - produce
  - critique
  - refine
  - complete
- kind: 'true'
  key: critic_isolated
- kind: equals
  key: refine_max_iterations
