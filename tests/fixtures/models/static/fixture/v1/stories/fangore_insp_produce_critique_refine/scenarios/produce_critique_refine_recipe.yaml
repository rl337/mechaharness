kind: cli
commands:
- probe:
    name: produce_critique_refine_recipe
    goal: draft release notes
    acceptance:
    - no_unverified_claims
    soft_bindings:
      max_rounds: 3
expect:
- kind: equals
  key: template_name
  value: produce_critique_refine
- kind: includes
  key: nodes_include
  value:
  - produce
  - critique
  - refine
  - complete
- kind: 'true'
  key: critic_isolated
- kind: equals
  key: refine_max_iterations
  value: 3
- kind: equals
  key: component_parents
  value:
    complete:
    - complete_kind
    critique:
    - acceptance
    - critique_kind
    - critique_prompt
    - omit_producer_reasoning
    produce:
    - produce_kind
    refine:
    - max_rounds
    - refine_kind
    - stop_contract
- kind: equals
  key: evolvable
  value:
  - critique_prompt
  - max_rounds
