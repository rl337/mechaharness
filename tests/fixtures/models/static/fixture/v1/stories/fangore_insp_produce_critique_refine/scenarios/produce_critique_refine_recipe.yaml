- kind: equals
  key: component_parents
  value:
    complete:
    - complete_kind
    critique:
    - acceptance
    - critique_kind
    - critique_prompt
    - omit_producer_reasoning
    produce:
    - produce_kind
    refine:
    - max_rounds
    - refine_kind
    - stop_contract
- kind: equals
  key: evolvable
  value:
  - critique_prompt
  - max_rounds
