kind: cli
commands:
- probe:
    name: requirements_gap_case
    reviewer_count: 2
    acceptance:
    - stories_covered
    - crash_tests_present
    questions:
    - id: coverage
      kind: choice
      options:
      - id: covered
        label: Covered
      - id: gap
        label: Gap
      - id: unclear
        label: Unclear
      allowed_actions:
      - covered
      - gap
      - unclear
    action_question_id: coverage
    answers:
      coverage: gap
    confidence: 0.9
    confidence_floor: 0.7
    facts:
      crash_tests_present: true
expect:
- kind: equals
  key: outcome
  value: request_tests
