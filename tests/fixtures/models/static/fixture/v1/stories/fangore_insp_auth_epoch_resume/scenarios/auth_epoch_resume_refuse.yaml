# user story: fangore_insp_auth_epoch_resume
kind: user_story
environment:
  family: pass_through
  backend: mock
  authorization_epoch: 2
steps:
- do:
    auth_epoch_resume:
      first_epoch: 2
      resume_epoch: 3
complete:
  expect:
  - kind: equals
    key: first_status
    value: ok
  - kind: equals
    key: checkpoint_epoch
    value: 2
  - kind: equals
    key: resume_status
    value: failed
  - kind: contains
    key: error_contains
    value: authorization_epoch_mismatch:2!=3
  - kind: equals
    key: runner_calls_after_resume
    value: 0
  - kind: lte
    key: cost_units
    value: 1
cleanup: []
