# user story: fangore_insp_lifecycle_observe
# Config-bound lifecycle extensions via tool_lifecycle.
kind: user_story
environment:
  family: pass_through
  backend: mock
  lifecycle_extensions: &id001
  - acme:watch_a
  - acme:watch_b
graph: null
steps:
- do:
    tool_lifecycle:
      mode: tool
      prompt: write
      grants:
      - core:fs.write
      tool_calls:
      - id: c1
        name: write_file
        arguments:
          path: a.txt
      extension_ids: *id001
      goal: lifecycle
complete:
  expect:
  - kind: equals
    key: extension_ids
    value:
    - acme:watch_a
    - acme:watch_b
  - kind: equals
    key: orders
    value:
    - 1
    - 2
  - kind: 'true'
    key: default_ran
  - kind: equals
    key: tool_result
    value: wrote a.txt
cleanup: []
