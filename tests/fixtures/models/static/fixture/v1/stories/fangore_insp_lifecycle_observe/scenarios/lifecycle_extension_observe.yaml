# user story: fangore_insp_lifecycle_observe
# Fangore starts the CLI host, runs lifecycle_case for plan
# `plans/lifecycle_extension_observe.yaml` (observe), and verifies completion.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph: null
steps:
- do:
    lifecycle_case:
      path: plans/lifecycle_extension_observe.yaml
complete:
  expect:
  - kind: equals
    key: extension_ids
    value:
    - acme:watch_a
    - acme:watch_b
  - kind: equals
    key: orders
    value:
    - 1
    - 2
  - kind: 'true'
    key: default_ran
  - kind: equals
    key: tool_result
    value: wrote a.txt
cleanup: []
