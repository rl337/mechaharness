kind: cli
commands:
- probe:
    name: lifecycle_extension_rewrite
    prompt: Write a.txt
    grants:
    - core:fs.write
    tool_calls:
    - id: '1'
      name: write_file
      arguments:
        path: a.txt
expect:
- kind: equals
  key: tool_result
  value: wrote /sandbox/a.txt
- kind: 'true'
  key: applied_rewrite
- kind: 'true'
  key: default_ran
