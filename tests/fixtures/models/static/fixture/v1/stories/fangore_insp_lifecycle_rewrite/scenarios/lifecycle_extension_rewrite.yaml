# user story: fangore_insp_lifecycle_rewrite
# Config-bound lifecycle extensions via tool_lifecycle.
kind: user_story
environment:
  family: pass_through
  backend: mock
  lifecycle_extensions: &id001
  - acme:sandbox_rewrite
graph: null
steps:
- do:
    tool_lifecycle:
      mode: tool
      prompt: write
      grants:
      - core:fs.write
      tool_calls:
      - id: c1
        name: write_file
        arguments:
          path: a.txt
      extension_ids: *id001
      goal: lifecycle
complete:
  expect:
  - kind: equals
    key: tool_result
    value: wrote /sandbox/a.txt
  - kind: 'true'
    key: applied_rewrite
  - kind: 'true'
    key: default_ran
cleanup: []
