# user story: fangore_insp_lifecycle_rewrite
# Fangore starts the CLI host, runs lifecycle_case for plan
# `plans/lifecycle_extension_rewrite.yaml` (rewrite), and verifies completion.
kind: user_story
environment:
  family: pass_through
  backend: mock
graph: null
steps:
- do:
    lifecycle_case:
      path: plans/lifecycle_extension_rewrite.yaml
complete:
  expect:
  - kind: equals
    key: tool_result
    value: wrote /sandbox/a.txt
  - kind: 'true'
    key: applied_rewrite
  - kind: 'true'
    key: default_ran
cleanup: []
