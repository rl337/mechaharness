# user story: fangore_insp_initialize_preflight
kind: user_story
environment:
  family: pass_through
  backend: mock
graph:
  recipe: initialize_preflight
  bind: binds/initialize_preflight.yaml
steps:
- do:
    run_recipe:
      name: initialize_preflight
      path: binds/initialize_preflight.yaml
complete:
  expect:
  - kind: 'true'
    key: recipe_in_catalog
  - kind: equals
    key: status
    value: ok
  - kind: includes
    key: subgraph_node_ids
    value:
    - linkage
    - capability_check
    - checkpoint_compat
    - ready
  - kind: 'true'
    key: preflight_ok
  - kind: equals
    key: template_name
    value: initialize_preflight
  - kind: lte
    key: budget_spent
    value: 10
  - kind: lte
    key: cost_units
    value: 10
cleanup: []
