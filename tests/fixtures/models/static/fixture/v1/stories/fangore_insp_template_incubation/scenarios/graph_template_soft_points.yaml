kind: cli
commands:
- probe:
    name: graph_template_soft_points
    template: fan_out_aggregate
    goal: incubate
    branch_count: 2
    acceptance:
    - merged
    source_workflow_ref: host:workflows/compare_v1
expect:
- kind: equals
  key: template_name
  value: fan_out_aggregate
- kind: equals
  key: template_status
  value: active
- kind: includes
  key: node_ids_include
  value:
  - plan
  - branch_0
  - branch_1
  - reduce
- kind: equals
  key: source_workflow_ref
  value: host:workflows/compare_v1
- kind: 'true'
  key: catalog_soft_points_nonempty
- kind: 'true'
  key: demoted_refused
