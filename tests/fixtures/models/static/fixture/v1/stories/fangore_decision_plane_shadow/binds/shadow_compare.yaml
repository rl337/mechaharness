name: decision_plane
summary: Shadow a small decision model without giving it control
goal: triage
soft_bindings:
  confidence_floor: 0.7
  shadow_mode: true
  questions:
  - id: team
    kind: choice
    options:
    - id: billing
      label: Billing
    - id: technical
      label: Technical
    allowed_actions:
    - billing
    - technical
  - id: risk
    kind: score
    min: 0
    max: 1
  state_projection:
    ticket_id: T-1
inputs:
  production_answers:
    team: billing
    risk: 0.2
  shadow_answers:
    team: technical
    risk: 0.8
  confidence: 0.9
