# user story: fangore_insp_tool_effect_classes
# Fangore starts the CLI host with family `pass_through` and backend `mock`.
# He runs `tool_phase_guard`: observe/prepare contracts cannot register write
# or external effects; execute may. Alias smuggling is refused.
kind: user_story
environment:
  family: pass_through
  backend: mock
steps:
- do:
    tool_phase_guard:
      contracts:
      - name: peek
        tool_phase: observe
        external_effects: read
      - name: peek_alias
        tool_phase: observe
        external_effects: write
      - name: draft_email
        tool_phase: prepare
        external_effects: none
      - name: draft_send
        tool_phase: prepare
        external_effects: external
      - name: mystery_observer
        tool_phase: observe
        external_effects: unknown
      - name: send_email
        tool_phase: execute
        external_effects: external
      alias_probe: peek_alias
  expect:
  - kind: equals
    key: registered
    value:
    - peek
    - draft_email
    - send_email
  - kind: equals
    key: refused
    value:
    - peek_alias
    - draft_send
    - mystery_observer
  - kind: 'false'
    key: alias_supported
complete:
  expect:
  - kind: equals
    key: registered
    value:
    - peek
    - draft_email
    - send_email
  - kind: 'false'
    key: alias_supported
cleanup: []
