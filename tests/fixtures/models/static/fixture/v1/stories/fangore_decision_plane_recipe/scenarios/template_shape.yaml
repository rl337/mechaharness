# user story: fangore_decision_plane_recipe
kind: user_story
environment:
  family: pass_through
  backend: mock
graph:
  recipe: decision_plane
  bind: binds/decision_plane.yaml
steps:
- do:
    run_recipe:
      name: decision_plane
      path: binds/decision_plane.yaml
complete:
  expect:
  - kind: equals
    key: template_name
    value: decision_plane
  - kind: 'true'
    key: has_soft_point
  - kind: equals
    key: final_action
    value: billing
  - kind: lte
    key: budget_spent
    value: 10
  - kind: lte
    key: cost_units
    value: 10
cleanup: []
